# Submit file: the firn install matrix — drive `firn install` unattended in a
# VM across a representative set of (family x image x encryption x secure-boot)
# cells, then boot each result and assert it came up.
#
#   kubectl create -f argo/firn-install-test.yaml
#
# firn is the single snosi installer (core ADR-0027/0028). This lane is its
# analogue of snosi-install-test: only an install produces the partitioning,
# encryption, TPM enrollment, and boot entries under test — none of it appears
# in a published image.
#
# Cells fan out with withItems but SERIALIZE on the snosi-vm-qa semaphore
# (one VM at a time), so the full matrix runs back-to-back — budget hours, not
# minutes. Trim the list for a quick smoke run.
#
# Matrix (10 active cells): the AUTO-UNLOCKABLE encryption modes -- none,
# tpm2-luks, tpm2-luks-passphrase (all TPM auto-unlock) -- for both families,
# cayo + snow + snowfield, Secure Boot on/off. Interactive-unlock modes (ab
# `luks`, bootc `luks-passphrase`) are held out: they prompt for a key/passphrase
# at boot, which an unattended lab cannot answer, so they can never pass here
# (see the INTERACTIVE-UNLOCK notes by the cells). The bootc x tpm2-luks cells
# are the highest-value ones: "installed AND booted" exercises the encrypted-boot
# unlock firn ADR-0012 left unproven. The /var filesystem defaults to ext4;
# the run-firn-install-tests `varfs` axis switches ab cells to btrfs to
# exercise snosi PR #705 (firn ADR-0013) -- validated via a one-off run.
#
# bootc + Secure Boot IS in the active matrix as of 2026-08-12: firn implements
# secure-install schema-1 (ADR-0014) -- it stages the shim -> MOK-signed
# systemd-boot -> MokManager ESP chain and runs mokutil. The lane completes
# enrollment host-side after install (virt-fw-vars --add-mok + clear MokNew),
# the MokManager keypress stand-in. This is NOT a pre-seed masquerade: the boot
# only succeeds if the staged chain is firn's, so a green is real. The ab MOK
# pre-seed (mok = "skip") is likewise legitimate -- ab installs stage no chain.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: firn-install-matrix-
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    snosi.io/trigger: manual
spec:
  serviceAccountName: argo
  entrypoint: main
  # 12 cells serialized on the VM semaphore; allow a full day.
  activeDeadlineSeconds: 86400
  templates:
    - name: main
      dag:
        tasks:
          - name: cell
            withItems:
              # `product` is the image axis (cayo|snow|snowfield); named to
              # avoid the manifest test's `image:`-key = container heuristic.
              # --- bootc: auto-unlockable encryption modes, Secure Boot OFF ---
              - { family: "bootc", product: "cayo",      encryption: "none",                 secureboot: "false" }
              - { family: "bootc", product: "cayo",      encryption: "tpm2-luks",            secureboot: "false" }
              - { family: "bootc", product: "snow",      encryption: "tpm2-luks",            secureboot: "false" }
              # INTERACTIVE-UNLOCK (not runnable unattended): luks-passphrase
              # prompts for the LUKS passphrase at every boot by design (firn
              # roadmap: "luks-passphrase still prompts interactively at boot").
              # The lab has no console-input path, so it would hang at the
              # prompt -- a failure that proves nothing. Held out:
              #   { family: "bootc", product: "snow", encryption: "luks-passphrase", secureboot: "false" }
              # --- bootc + Secure Boot (real path, firn secure-install schema-1) ---
              # firn stages the ESP chain (shim -> MOK-signed systemd-boot ->
              # MokManager) and runs mokutil (mok = "enroll"); the lane completes
              # enrollment host-side after install (virt-fw-vars --add-mok + clear
              # MokNew) -- the MokManager keypress stand-in, NOT a pre-seed. The
              # boot only succeeds if the staged chain is firn's, so a green is
              # real (firn ADR-0014; proven cayo/none/sb 2026-08-12).
              - { family: "bootc", product: "snow",      encryption: "none",                 secureboot: "true"  }
              - { family: "bootc", product: "snow",      encryption: "tpm2-luks-passphrase", secureboot: "true"  }
              - { family: "bootc", product: "snowfield", encryption: "tpm2-luks-passphrase", secureboot: "true"  }
              # --- ab: auto-unlockable encryption modes, SB on and off (MOK when on) ---
              - { family: "ab",    product: "cayo",      encryption: "none",                 secureboot: "false" }
              - { family: "ab",    product: "cayo",      encryption: "tpm2-luks",            secureboot: "true"  }
              - { family: "ab",    product: "snow",      encryption: "tpm2-luks",            secureboot: "true"  }
              - { family: "ab",    product: "snow",      encryption: "none",                 secureboot: "true"  }
              # INTERACTIVE-UNLOCK (not runnable unattended): ab `luks` gives
              # /var a randomly generated recovery key and no TPM, so the
              # installed system prompts for that key at boot (confirmed
              # 2026-08-12: cell hung at "Please enter passphrase for disk
              # var"). The key is unknown to the lab, so unlike the known
              # -passphrase value it cannot even be injected. Held out:
              #   { family: "ab", product: "snow", encryption: "luks", secureboot: "false" }
            templateRef:
              name: run-firn-install-tests
              template: run-firn-install-tests
            arguments:
              parameters:
                - { name: family,     value: "{{item.family}}" }
                - { name: image,      value: "{{item.product}}" }
                - { name: encryption, value: "{{item.encryption}}" }
                - { name: secureboot, value: "{{item.secureboot}}" }
