# Digest watcher for the secure install lane.
#
# Purpose: run `run-secure-install-tests` automatically the moment a NEW
# ghcr.io/frostyard/cayo:latest is published, so the fix for snosi#517 gets
# proven without anyone watching for the image to appear.
#
# Why the image and not the ISO: the secure install pulls the OS image at run
# time from the tracking ref, and snosi#520's fix lives in that image's
# initramfs. The Dakota ISO carries the installer (fisherman), which has not
# changed — so a rebuilt ISO is NOT required for this proof, only a rebuilt
# image.
#
# Deliberately separate from `image-poller`: that template triggers the
# container smoke suite for every product and its templateRef is fixed. This
# watches one tag and runs one lane, and is meant to be deleted once the secure
# lane is green and the poller can own it.
#
#   kubectl apply -f argo/secure-install-watch.yaml
#   kubectl delete cronworkflow secure-install-watch -n argo      # when done
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: secure-install-watch
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
spec:
  schedules:
    - "*/20 * * * *"
  timezone: UTC
  # The lane takes ~25 minutes and holds the VM semaphore. Overlapping runs
  # would queue behind each other and pile up while an image is being tested.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  workflowSpec:
    serviceAccountName: argo
    entrypoint: watch
    activeDeadlineSeconds: 10800
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/frostyard/cayo"
        - name: image-tag
          value: "latest"
        # Distinct from the image-poller's `digest-cayo-latest` key: this
        # watcher and that poller advance independently, and sharing a key
        # would let one suppress the other's trigger.
        - name: state-key
          value: "secure-install-cayo-latest"
    templates:
      - name: watch
        dag:
          tasks:
            - name: check
              template: check-digest

            # Submits a STANDALONE workflow rather than running the lane as a
            # nested task. Two reasons, both learned the hard way:
            #
            #  * Honest reporting. Nested, the lane's failure became a handled
            #    branch and this workflow reported Succeeded over a failed run
            #    -- and collect_runs.py maps by node templateRef, so that green
            #    would have reached the dashboard as a passing secure install.
            #  * The lane holds the VM semaphore for ~25 minutes. A watcher
            #    should not occupy it; it should start work and get out of the
            #    way.
            #
            # The submitted workflow carries the same generateName as a manual
            # run, so it appears on the dashboard exactly like one.
            - name: submit
              depends: "check.Succeeded"
              when: "{{tasks.check.outputs.parameters.changed}} == true"
              template: submit-lane

            - name: record
              depends: "submit.Succeeded"
              when: "{{tasks.check.outputs.parameters.changed}} == true"
              template: record-digest
              arguments:
                parameters:
                  - name: remote-digest
                    value: "{{tasks.check.outputs.parameters.remote-digest}}"

      - name: submit-lane
        resource:
          action: create
          successCondition: metadata.name
          manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: snosi-secure-install-auto-
              namespace: argo
              labels:
                app.kubernetes.io/part-of: lab
                snosi.io/trigger: digest-watch
            spec:
              serviceAccountName: argo
              entrypoint: main
              activeDeadlineSeconds: 10800
              templates:
                - name: main
                  dag:
                    tasks:
                      - name: secure-install
                        templateRef:
                          name: run-secure-install-tests
                          template: run-secure-install-tests
                        arguments:
                          parameters:
                            - name: profile
                              value: "cayo"
                            - name: tracking-ref
                              value: "ghcr.io/frostyard/cayo:latest"

      - name: check-digest
        outputs:
          parameters:
            - name: changed
              valueFrom: { path: /tmp/changed }
            - name: remote-digest
              valueFrom: { path: /tmp/remote }
        script:
          image: quay.io/skopeo/stable:latest
          command: [bash]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          source: |
            set -euo pipefail
            IMAGE="{{workflow.parameters.image}}"
            TAG="{{workflow.parameters.image-tag}}"
            KEY="{{workflow.parameters.state-key}}"

            REMOTE="$(skopeo inspect "docker://${IMAGE}:${TAG}" --format '{{.Digest}}')"
            [[ "${REMOTE}" == sha256:* ]] || { echo "refusing a malformed digest: ${REMOTE}" >&2; exit 1; }
            printf '%s' "${REMOTE}" > /tmp/remote

            # The ConfigMap is mounted read-only; a missing key reads as empty.
            STORED="$(cat "/state/${KEY}" 2>/dev/null || true)"

            echo "stored: ${STORED:-<none>}" >&2
            echo "remote: ${REMOTE}" >&2

            if [[ -z "${STORED}" ]]; then
              # First sight of this key. Seed it WITHOUT running: otherwise
              # enabling the watcher immediately tests whatever is already
              # published, which is the image we already know is broken.
              echo "seeding baseline, not triggering" >&2
              printf 'false' > /tmp/changed
            elif [[ "${STORED}" == "${REMOTE}" ]]; then
              echo "unchanged" >&2
              printf 'false' > /tmp/changed
            else
              echo "CHANGED -- triggering the secure install lane" >&2
              printf 'true' > /tmp/changed
            fi
          volumeMounts:
            - { name: state, mountPath: /state, readOnly: true }

      - name: record-digest
        inputs:
          parameters:
            - name: remote-digest
        script:
          image: cgr.dev/chainguard/kubectl:latest-dev
          command: [bash]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          source: |
            set -euo pipefail
            kubectl patch configmap image-polling-digests -n argo --type merge \
              -p "{\"data\":{\"{{workflow.parameters.state-key}}\":\"{{inputs.parameters.remote-digest}}\"}}"
            echo "recorded {{workflow.parameters.state-key}} = {{inputs.parameters.remote-digest}}" >&2

    volumes:
      - name: state
        configMap:
          name: image-polling-digests
          optional: true
