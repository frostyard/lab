    class GateError(Exception):
        """A bounded, input-free failure code."""


    def require(ok, code):
        if not ok:
            raise GateError(code)


    def full(pattern, value):
        return type(value) is str and re.fullmatch(pattern, value, flags=re.ASCII) is not None


    def sysext_probe(p):
        """The optional sysext_probe block: feature names, units and first-start files."""
        require(type(p) is dict and set(p) == {"features", "units", "first_start"}, "sysext_fields")
        features, units, first = p["features"], p["units"], p["first_start"]
        require(type(features) is list and 1 <= len(features) <= 8 and
                all(full(r"[a-z][a-z0-9-]{0,31}", name) for name in features) and
                len(set(features)) == len(features), "sysext_features")
        require(type(units) is list and 1 <= len(units) <= 16 and
                all(full(r"[A-Za-z0-9@._-]{1,64}\.(?:service|socket|mount)", name) for name in units) and
                len(set(units)) == len(units), "sysext_units")
        require(type(first) is list and len(first) <= 4, "sysext_first_start")
        seen = set()
        for entry in first:
            require(type(entry) is dict and set(entry) == {"unit", "path"}, "sysext_first_start")
            unit, path = entry["unit"], entry["path"]
            require(full(r"[A-Za-z0-9@._-]{1,64}\.service", unit) and unit not in seen, "sysext_first_start")
            seen.add(unit)
            # No ".." part: the path stays below /etc.
            require(full(r"/etc/[A-Za-z0-9._-]{1,64}(?:/[A-Za-z0-9._-]{1,64}){0,3}", path) and
                    ".." not in path.split("/"), "sysext_first_start")
        return p


    def first_login_probe(p):
        """The optional first_login_probe block: the two bounded wait windows."""
        require(type(p) is dict and set(p) == {"session_wait", "app_wait"}, "first_login_fields")
        # type() is int, so a bool can never pass as a wait window.
        require(type(p["session_wait"]) is int and 60 <= p["session_wait"] <= 900, "first_login_fields")
        require(type(p["app_wait"]) is int and 30 <= p["app_wait"] <= 600, "first_login_fields")
        return p


    def problems_probe(p):
        require(type(p) is dict and set(p) == {"path"} and p["path"] in ("fresh", "update"), "problems_fields")
        return p["path"]


    def report_probe(p):
        """The optional report_probe block: 1 intake value and nothing else."""
        require(type(p) is dict and set(p) == {"intake"} and p["intake"] in REPORT_INTAKES,
                "report_fields")
        return p["intake"]


    def product_repo(m):
        return PRODUCTS[m["product"]]


    def normalize(m):
        require(type(m) is dict and set(m) in (FIELDS, SYSEXT_FIELDS, LOGIN_FIELDS, PROBLEMS_FIELDS,
                                               REPORT_FIELDS), "manifest_fields")
        # A repository of the other product must never pass: the family is the
        # product, and every reference below uses that product's repository.
        require(type(m["product"]) is str and m["product"] in PRODUCTS and m["family"] == m["product"], "product")
        repo = product_repo(m)
        require(m["secureboot"] is True and m["encryption"] == "tpm2-luks-passphrase", "security_mode")
        for name in ("iso_sha256", "index_key_sha256", "cosign_key_sha256", "mok_cert_sha256"):
            require(full(r"[0-9a-f]{64}", m[name]), "hash_format")
        require(full(r"[0-9a-f]{40}", m["snosi_commit"]), "commit_format")
        require(m["snosi_commit"] == SNOSI_COMMIT, "commit_pin")
        require(m["trust_fingerprint"] == FINGERPRINT, "fingerprint")
        for name in ("iso_version", "version_n", "version_n_plus_1"):
            require(full(r"[0-9]{14}", m[name]), "version_format")
        if "sysext_probe" in m or "first_login_probe" in m:
            # The sysext and first-login probes never stage N+1: N+1 is only the
            # controlled tag's current target, so the two versions only have to differ.
            require(m["version_n"] != m["version_n_plus_1"], "version_distinct")
            if "sysext_probe" in m:
                sysext_probe(m["sysext_probe"])
            else:
                first_login_probe(m["first_login_probe"])
        elif "problems_probe" in m:
            # The fresh path never stages N+1, so its versions only have to differ;
            # the update path stages N+1, so N must be older.
            if problems_probe(m["problems_probe"]) == "fresh":
                require(m["version_n"] != m["version_n_plus_1"], "version_distinct")
            else:
                require(m["version_n"] < m["version_n_plus_1"], "version_order")
        elif "report_probe" in m:
            # The report probe never stages N+1 either, so its versions only have
            # to differ, and only a Floe image carries the report sender.
            report_probe(m["report_probe"])
            require(m["product"] == "floe", "report_product")
            require(m["version_n"] != m["version_n_plus_1"], "version_distinct")
        else:
            require(m["version_n"] < m["version_n_plus_1"], "version_order")
        require(m["iso_url"] == ISO_BASE + "snosi-installer_" + m["iso_version"] + "_x86-64.iso", "iso_url")
        for name in ("image_n", "image_n_plus_1"):
            require(full(re.escape(repo) + r"@sha256:[0-9a-f]{64}", m[name]), "image_ref")
        require(m["image_n"] != m["image_n_plus_1"], "digest_distinct")
        for tag, version in (("version_tag_n", "version_n"), ("version_tag_n_plus_1", "version_n_plus_1")):
            require(m[tag] == repo + ":" + m[version], "immutable_tag")
        require(full(re.escape(repo) + r":[a-z0-9][a-z0-9._-]{0,127}", m["target_ref"])
                and m["target_ref"] not in (repo + ":latest", m["version_tag_n"], m["version_tag_n_plus_1"]), "target_ref")
        require(type(m["timeouts"]) is dict and set(m["timeouts"]) == set(LIMITS), "timeout_fields")
        for key, limit in LIMITS.items():
            require(type(m["timeouts"][key]) is int and 300 <= m["timeouts"][key] <= limit, "timeout_value")
        if "first_login_probe" in m:
            # Both login boots carry the same guest unit window, so the two waits
            # plus the 180 s the guest unit and the session need must fit the
            # smaller of the two phase budgets; a manifest that cannot fit is
            # refused here rather than cut short in the VM.
            probe = m["first_login_probe"]
            require(probe["session_wait"] + probe["app_wait"] + 180
                    <= min(m["timeouts"]["installed_boot"], m["timeouts"]["reboot"]), "first_login_window")
        return m


    def canonical(m):
        return (json.dumps(m, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n").encode()


    def pairs(items):
        value = {}
        for key, item in items:
            require(key not in value, "duplicate_key")
            value[key] = item
        return value


    def read_json(path):
        raw = Path(path).read_bytes()
        require(len(raw) <= 16384, "input_size")
        try:
            m = json.loads(raw, object_pairs_hook=pairs,
                           parse_constant=lambda _: (_ for _ in ()).throw(GateError("json_value")))
        except (ValueError, UnicodeError) as exc:
            raise GateError("json_format") from exc
        return m, raw


    def load(path, frozen=False):
        m, raw = read_json(path)
        normalize(m)
        if frozen:
            require(raw == canonical(m), "not_canonical")
        return m


    def inspect(args, code, timeout=120, status=False):
        try:
            result = subprocess.run(args, capture_output=True, timeout=timeout, check=False)
        except (OSError, subprocess.SubprocessError) as exc:
            raise GateError(code) from exc
        require(result.returncode == 0, code)
        return result.stderr if status else result.stdout


    def inspect_file(args, code, destination, timeout=120, max_size=256 * 1024 * 1024, stdin=None):
        try:
            with Path(destination).open("wb") as stream:
                result = subprocess.run(args, stdout=stream, stderr=subprocess.PIPE,
                                        stdin=stdin, timeout=timeout, check=False,
                                        preexec_fn=lambda: limit_process(max_size, timeout))
        except (OSError, subprocess.SubprocessError) as exc:
            raise GateError(code) from exc
        require(result.returncode == 0 and 0 < Path(destination).stat().st_size <= max_size, code)


    def limit_process(max_size, timeout):
        resource.setrlimit(resource.RLIMIT_FSIZE, (max_size, max_size))
        resource.setrlimit(resource.RLIMIT_CPU, (min(timeout, 120), min(timeout, 120) + 1))


    def fetch(url, code="download"):
        return inspect(["curl", "-fsSL", "--max-time", "60", url], code)


    def sha(data):
        return hashlib.sha256(data).hexdigest()


    def image_info(ref):
        try:
            data = json.loads(inspect(["skopeo", "inspect", "--no-tags", "docker://" + ref], "registry_inspect"), object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError("registry_json") from exc
        require(type(data) is dict and full(r"sha256:[0-9a-f]{64}", data.get("Digest")), "registry_digest")
        return data


    def resolve(ref, digest):
        require(image_info(ref)["Digest"] == "sha256:" + digest, "tag_drift")


    def snow_catalog(catalog, product="snow"):
        # Name kept from the Snow lane; selects the entry of the manifest product.
        if type(catalog) is not list or product not in PRODUCTS:
            return False
        repo = PRODUCTS[product]
        entries = [entry for entry in catalog if type(entry) is dict and
                   entry.get("family") == "bootc" and entry.get("name") == product]
        if len(entries) != 1:
            return False
        ref = entries[0].get("ref")
        return (type(ref) is str and ref.startswith((repo + ":", repo + "@sha256:")) and
                entries[0].get("cosign_pub_key") == "/usr/lib/snosi/cosign.pub")


    def esp_offset(iso):
        """Read GPT partition 2 from ISO bytes; never attach a loop device."""
        size = iso.stat().st_size
        with iso.open("rb") as image:
            image.seek(512)
            header = image.read(512)
            require(header[:8] == b"EFI PART", "iso_gpt")
            length = struct.unpack_from("<I", header, 12)[0]
            require(92 <= length <= 512, "iso_gpt")
            crc = struct.unpack_from("<I", header, 16)[0]
            checked = bytearray(header[:length])
            checked[16:20] = b"\0" * 4
            require(zlib.crc32(checked) == crc, "iso_gpt")
            lba, count, width, entries_crc = struct.unpack_from("<QIII", header, 72)
            require(2 <= count <= 1024 and width == 128 and (lba + 1) * 512 + count * width <= size, "iso_gpt")
            image.seek(lba * 512)
            entries = image.read(count * width)
            require(zlib.crc32(entries) == entries_crc, "iso_gpt")
        second = entries[128:256]
        require(second[:16] == bytes.fromhex("28732ac11ff8d211ba4b00a0c93ec93b"), "iso_esp")
        start, end = struct.unpack_from("<QQ", second, 32)
        require(0 < start <= end and end * 512 < size, "iso_esp")
        return start * 512


    def inspect_iso(iso, root, m, key, cosign, mok):
        # Pinned Snosi ISO appends a GPT ESP (partition 2). The initramfs is
        # FAT32, not in the ISO9660 tree. mtools reads it without loop/mount.
        initrd = root / "initrd.img"
        offset = esp_offset(iso)
        try:
            result = subprocess.run(["mcopy", "-i", str(iso) + "@@" + str(offset),
                                     "::firn-installer/initrd.img", str(initrd)],
                                    capture_output=True, timeout=120, check=False,
                                    preexec_fn=lambda: limit_process(1024 * 1024 * 1024, 120))
        except (OSError, subprocess.SubprocessError) as exc:
            raise GateError("iso_initramfs") from exc
        require(result.returncode == 0 and initrd.is_file() and
                0 < initrd.stat().st_size <= 1024 * 1024 * 1024, "iso_initramfs")
        archive = root / "initrd.cpio"
        inspect_file(["zstd", "-dc", "--", str(initrd)], "iso_archive", archive,
                     max_size=4 * 1024**3)
        listing = root / "initrd-members"
        with archive.open("rb") as source:
            inspect_file(["cpio", "-it"], "iso_embedded", listing,
                         max_size=16 * 1024 * 1024, stdin=source)
        members = listing.read_bytes().splitlines()
        embedded = {}
        for entry in ("/usr/bin/firn", "/etc/firn/catalog.json", "/usr/lib/snosi/cosign.pub",
                      "/usr/lib/snosi/os-update-pubring.gpg", "/usr/lib/snosi/mok.crt",
                      "/usr/bin/cosign", "/etc/snosi-installer-release"):
            name = entry.lstrip("/").encode()
            matches = [member for member in members if member in (name, b"./" + name)]
            require(len(matches) == 1, "iso_embedded")
            output = root / ("item-" + str(len(embedded)))
            with archive.open("rb") as source:
                inspect_file(["cpio", "-i", "--to-stdout", matches[0].decode("ascii")], "iso_embedded",
                             output, stdin=source)
            embedded[entry] = output
        for entry, pinned in (("/usr/lib/snosi/cosign.pub", cosign),
                              ("/usr/lib/snosi/os-update-pubring.gpg", key),
                              ("/usr/lib/snosi/mok.crt", mok)):
            require(embedded[entry].read_bytes() == pinned, "iso_embedded_key")
        catalog_file = embedded["/etc/firn/catalog.json"]
        require(catalog_file.stat().st_size <= 16384, "iso_catalog")
        try:
            catalog = json.loads(catalog_file.read_bytes(), object_pairs_hook=pairs,
                                 parse_constant=lambda _: (_ for _ in ()).throw(GateError("iso_catalog")))
        except GateError as exc:
            raise GateError("iso_catalog") from exc
        except (ValueError, UnicodeError) as exc:
            raise GateError("iso_catalog") from exc
        require(snow_catalog(catalog, m["product"]), "iso_catalog")
        release = embedded["/etc/snosi-installer-release"]
        require(release.stat().st_size <= 4096 and m["iso_version"].encode() in release.read_bytes(), "iso_release")
        return sha(embedded["/usr/bin/firn"].read_bytes())


    def now():
        return datetime.datetime.now(datetime.timezone.utc).isoformat()


    def timestamp(value):
        if not full(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+\-]{12,32}", value):
            return False
        try:
            return datetime.datetime.fromisoformat(value).utcoffset() is not None
        except ValueError:
            return False


    def check_state(m, data):
        require(type(data) is dict and set(data) == CHECK_FIELDS, "checks_state")
        require(type(data["assembly_n"]) is str and data["assembly_n"] in ASSEMBLIES and
                type(data["assembly_n_plus_1"]) is str and data["assembly_n_plus_1"] in ASSEMBLIES,
                "checks_state")
        expected = {"manifest_sha256": sha(canonical(m)), "version_n": m["version_n"],
                    "version_n_plus_1": m["version_n_plus_1"],
                    "digest_n": m["image_n"].rsplit(":", 1)[-1],
                    "digest_n_plus_1": m["image_n_plus_1"].rsplit(":", 1)[-1],
                    "snosi_commit": m["snosi_commit"], "iso_sha256": m["iso_sha256"],
                    "index_key_sha256": m["index_key_sha256"],
                    "cosign_key_sha256": m["cosign_key_sha256"],
                    "mok_cert_sha256": m["mok_cert_sha256"],
                    "firn_provenance": "iso-esp-p2/firn-installer/initrd.img",
                    "firn_compatibility": "installer-vm-v2-recipe-validator-only"}
        require(all(data[key] == value for key, value in expected.items()) and
                full(r"[0-9a-f]{64}", data["firn_sha256"]) and timestamp(data["timestamp"]) and
                type(data["tags"]) is dict and len(data["tags"]) <= 32, "checks_state")
        require(all(full(r"[a-z][a-z0-9-]{0,39}", key) and timestamp(value)
                    for key, value in data["tags"].items()), "checks_state")


    def save(path, data):
        dest = Path(path)
        with tempfile.NamedTemporaryFile(mode="wb", dir=dest.parent, prefix=".snow-qa-", delete=False) as stream:
            temp = stream.name
            try:
                stream.write(canonical(data))
                stream.flush()
                os.fsync(stream.fileno())
            except BaseException:
                os.unlink(temp)
                raise
        os.replace(temp, dest)
        directory = os.open(dest.parent, os.O_RDONLY | os.O_DIRECTORY)
        try:
            os.fsync(directory)
        finally:
            os.close(directory)


    def preflight(m, checks_path):
        normalize(m)
        base = "https://raw.githubusercontent.com/frostyard/snosi/" + m["snosi_commit"] + "/"
        key = fetch(base + "shared/native-ab/keys/import-pubring.gpg", "trust_material_missing")
        cosign = fetch(base + "cosign.pub", "trust_material_missing")
        mok = fetch(base + "shared/native-ab/keys/mok-2026.crt", "trust_material_missing")
        for data, field in ((key, "index_key_sha256"), (cosign, "cosign_key_sha256"), (mok, "mok_cert_sha256")):
            require(sha(data) == m[field], "key_hash")
        with tempfile.TemporaryDirectory(prefix="snow-qa-") as folder:
            root = Path(folder)
            key_path = root / "index.gpg"
            key_path.write_bytes(key)
            fingerprint = inspect(["gpg", "--show-keys", "--with-colons", str(key_path)], "index_key")
            records = fingerprint.splitlines()
            primary = [records[index + 1].split(b":")[9] for index, line in enumerate(records[:-1])
                       if line.startswith(b"pub:") and records[index + 1].startswith(b"fpr:")]
            require(FINGERPRINT.encode() in primary, "key_fingerprint")
            pub = root / "cosign.pub"
            pub.write_bytes(cosign)
            sums = root / "SHA256SUMS"
            sig = root / "SHA256SUMS.gpg"
            sums.write_bytes(fetch(ISO_BASE + "SHA256SUMS"))
            sig.write_bytes(fetch(ISO_BASE + "SHA256SUMS.gpg"))
            signature_status = inspect(["gpgv", "--status-fd=2", "--keyring", str(key_path),
                                        str(sig), str(sums)], "index_signature", status=True)
            valid = [line.split() for line in signature_status.splitlines()
                     if line.startswith(b"[GNUPG:] VALIDSIG ")]
            signers = [parts[-1] if len(parts) > 3 and re.fullmatch(rb"[0-9A-F]{40}", parts[-1])
                       else parts[2] for parts in valid if len(parts) >= 3]
            require(signers == [FINGERPRINT.encode()], "index_signer")
            name = m["iso_url"].rsplit("/", 1)[-1].encode()
            entries = [line.split() for line in sums.read_bytes().splitlines()]
            matching = [entry for entry in entries if len(entry) == 2 and entry[1].lstrip(b"*") == name]
            require(matching == [[m["iso_sha256"].encode(), name]] or
                    matching == [[m["iso_sha256"].encode(), b"*" + name]], "iso_index")
            # No redirect-to-latest and no trusting a downloaded checksum without the signed index.
            iso = root / "installer.iso"
            inspect(["curl", "-fsSL", "--max-time", str(m["timeouts"]["install"]),
                     "-o", str(iso), m["iso_url"]], "iso_download", timeout=m["timeouts"]["install"] + 30)
            digest = hashlib.sha256()
            with iso.open("rb") as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                    digest.update(chunk)
            require(digest.hexdigest() == m["iso_sha256"], "iso_hash")
            firn_sha256 = inspect_iso(iso, root, m, key, cosign, mok)
            assemblies = {}
            for which, ref, version in (("n", m["image_n"], m["version_n"]),
                                        ("n_plus_1", m["image_n_plus_1"], m["version_n_plus_1"])):
                inspect(["cosign", "verify", "--key", str(pub), ref], "oci_signature")
                info = image_info(ref)
                require(info["Digest"] == "sha256:" + ref.rsplit(":", 1)[-1], "oci_digest")
                labels = info.get("Labels")
                require(type(labels) is dict and labels.get("org.opencontainers.image.version") == version, "oci_version")
                assembly = labels.get("io.snosi.bootc.secureboot-assembly")
                require(type(assembly) is str and assembly in ASSEMBLIES, "oci_assembly")
                assemblies[which] = assembly
                require(labels.get("io.snosi.bootc.secureboot-capable") == "true", "oci_capability")
        resolve(m["version_tag_n"], m["image_n"].rsplit(":", 1)[-1])
        resolve(m["version_tag_n_plus_1"], m["image_n_plus_1"].rsplit(":", 1)[-1])
        resolve(m["target_ref"], m["image_n_plus_1"].rsplit(":", 1)[-1])
        # The minimal validator contract runs later inside the installer VM;
        # preflight records only authenticated Firn provenance and its hash.
        save(checks_path, {"manifest_sha256": sha(canonical(m)), "timestamp": now(),
                           "version_n": m["version_n"], "version_n_plus_1": m["version_n_plus_1"],
                           "digest_n": m["image_n"].rsplit(":", 1)[-1],
                           "digest_n_plus_1": m["image_n_plus_1"].rsplit(":", 1)[-1],
                           "assembly_n": assemblies["n"], "assembly_n_plus_1": assemblies["n_plus_1"],
                           "snosi_commit": m["snosi_commit"], "iso_sha256": m["iso_sha256"],
                           "firn_sha256": firn_sha256, "firn_provenance": "iso-esp-p2/firn-installer/initrd.img",
                           "firn_compatibility": "installer-vm-v2-recipe-validator-only",
                           "index_key_sha256": m["index_key_sha256"],
                           "cosign_key_sha256": m["cosign_key_sha256"],
                           "mok_cert_sha256": m["mok_cert_sha256"], "tags": {}})


    def tag(m, phase, checks_path):
        normalize(m)
        require(full(r"[a-z][a-z0-9-]{0,39}", phase), "phase_format")
        path = Path(checks_path)
        data, _ = read_json(path)
        check_state(m, data)
        require(phase not in data["tags"] and len(data["tags"]) < 32, "checks_state")
        resolve(m["target_ref"], m["image_n_plus_1"].rsplit(":", 1)[-1])
        data["tags"][phase] = now()
        save(path, data)


    def nonce_valid(value):
        return full(r"[0-9a-f]{32}", value)


    def boot_id_valid(value):
        return full(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", value)


    def spec_transport_allowed(phase, transport):
        # installed-n is exactly what Firn wrote. Later phases follow the updater
        # (containers-storage) or a booted deployment that still says registry;
        # any other transport is foreign. The record keeps the observed value.
        if phase == "installed-n":
            return transport == "registry"
        return transport in ("registry", "containers-storage")


    def staged_marker(m, raw):
        # /run/snosi/update-staged is three key=value lines: image, digest, staged_at.
        require(type(raw) is bytes and 0 < len(raw) <= 4096, "stage_marker")
        try:
            lines = raw.decode("ascii").splitlines()
        except UnicodeError as exc:
            raise GateError("stage_marker") from exc
        fields = {}
        for line in lines:
            key, separator, value = line.partition("=")
            require(separator == "=" and key in ("image", "digest", "staged_at")
                    and key not in fields and re.fullmatch(r"[ -~]{1,256}", value) is not None, "stage_marker")
            fields[key] = value
        require("image" in fields and "digest" in fields, "stage_marker")
        require(fields["digest"] == "sha256:" + m["image_n_plus_1"].rsplit(":", 1)[-1]
                and fields["image"] == m["target_ref"], "stage_marker")


    def verdict(m, phase, nonce, prior, record):
        require(type(record) is dict and set(record) == RECORD_FIELDS, "record_fields")
        require(record["phase"] == phase and record["nonce"] == nonce, "record_identity")
        require(boot_id_valid(record["boot_id"]) and record["boot_id"] != prior, "boot_identity")
        newer = phase in ("boot-n-plus-1", "rollback")
        require(record["booted_digest"] == m["image_n_plus_1" if newer else "image_n"].rsplit(":", 1)[-1]
                and record["booted_version"] == m["version_n_plus_1" if newer else "version_n"], "booted_image")
        # Firn installs with --target-imgref, so the spec names target_ref in every phase.
        # The Snow/Floe/Snowfield/Sundog updater switches the spec to containers-storage (same name).
        require(record["spec_image"] == m["target_ref"], "target_spec")
        require(spec_transport_allowed(phase, record["spec_transport"]), "target_transport")
        require(record["staged_digest"] == (m["image_n_plus_1"].rsplit(":", 1)[-1] if phase == "stage" else None), "staged_image")
        require(record["rollback_digest"] == (m["image_n"].rsplit(":", 1)[-1] if newer else
                m["image_n_plus_1"].rsplit(":", 1)[-1] if phase == "boot-n" else None), "rollback_image")
        require(record["policy_sha256"] == m["cosign_key_sha256"] and
                record["policy_ok"] is True and record["pull_ok"] is True and
                record["pull_digest"] == m["image_n_plus_1"].rsplit(":", 1)[-1], "signature_policy")
        require(all(record[name] is True for name in
                    ("secure_boot", "uki_type2", "lockdown", "root_luks", "root_btrfs"))
                and type(record["tpm_pcr11_tokens"]) is int and record["tpm_pcr11_tokens"] == 1, "boot_security")
        # Recorded here, judged by the runner after the evidence is written:
        # a non-zero count must not discard the attested boot (frostyard/snosi#1130).
        require(type(record["fsverity_errors"]) is int and 0 <= record["fsverity_errors"] <= 10**9, "fsverity_field")
        # lab#174: the kept lines are bounded evidence for a human; they are never
        # judged on their content, only on a shape a reader can trust.
        kept = record["fsverity_lines"]
        require(type(kept) is list and len(kept) <= FSVERITY_LINES_MAX
                and len(kept) <= record["fsverity_errors"], "fsverity_lines")
        require(all(type(entry) is list and len(entry) == 4
                    and full(r"[A-Za-z0-9._-]{1,32}", entry[0])
                    and type(entry[1]) is int and 0 <= entry[1] < 2**64
                    and type(entry[2]) is int and 0 <= entry[2] < 2**64
                    and type(entry[3]) is int and -99 <= entry[3] <= 99
                    for entry in kept), "fsverity_lines")
        require(full(r"[0-9A-Za-z._+~-]{1,64}", record["kernel"]), "kernel_field")
        require(record["action"] == ("staged" if phase == "stage" else "rolled-back" if phase == "rollback" else None), "action")
        require(record["lockdown_mode"] in ("integrity", "confidentiality", "unavailable"), "lockdown_field")
        cmdline = record["cmdline"]
        require(type(cmdline) is list and 1 <= len(cmdline) <= 32
                and all(type(token) is str and 1 <= len(token) <= 128
                        and full(r"[!-~]+", token)
                        and re.search(r"[0-9a-fA-F]{32,}", token) is None
                        for token in cmdline)
                and len(" ".join(cmdline)) <= 1036, "cmdline_field")
        cmdline_lockdown = record["cmdline_lockdown"]
        require(cmdline_lockdown is None or full(r"[a-z]{1,16}", cmdline_lockdown), "cmdline_field")
        require(record["marker_digest"] == (m["image_n_plus_1"].rsplit(":", 1)[-1] if phase == "stage" else None), "stage_marker")
        return record["boot_id"]


    def phase_attest(m, phase, nonce, prior, serial, checks):
        require(phase in PHASES and nonce_valid(nonce) and
                (prior == "none" or boot_id_valid(prior)), "phase_arguments")
        check_state(m, read_json(checks)[0])
        # Bound the entire snapshot, including unrelated serial chatter. Every
        # marker must be valid: never pick a convenient record from a union.
        raw = Path(serial).read_bytes()
        require(len(raw) <= 1024 * 1024, "serial_size")
        # Lines end at LF only, as in the runner's error parser: a CR inside a
        # line never ends a marker (trailing CRs from ONLCR are stripped).
        # A chunk carrier line holds a fragment of a record line in its own
        # data, so it is never a record line itself (lab#177, ADR-0014).
        lines = [line for line in raw.split(b"\n") if b"SNOW_QA_KMSG1" not in line]
        # The guest writes its one record more than once (to ttyS0 and again
        # after serial-getty's TTY setup); identical copies are one record.
        # A copy can follow the getty prompt on its line ("snow-qa login: "
        # has no newline; run-snow-bootc-lifecycle-fhhk4).
        tokens = {marker_token(line, b"SNOW_QA_V1") for line in lines if b"SNOW_QA_V1" in line}
        # A stalled ttyS0 can cut the line and the kernel then appends its own
        # text to it (lab#177); only a complete token is a record (ADR-0013).
        markers = {token for token in tokens
                   if re.fullmatch(rb"SNOW_QA_V1 ([A-Za-z0-9_-]{1,8192})", token) is not None}
        # An incomplete marker is a cut record; no marker at all is no record.
        require(markers or not tokens, "record_encoding")
        require(len(markers) == 1, "record_count")
        markers = sorted(markers)
        match = re.fullmatch(rb"SNOW_QA_V1 ([A-Za-z0-9_-]{1,8192})", markers[0])
        require(match is not None, "record_encoding")
        encoded = match[1]
        try:
            decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
            require(base64.urlsafe_b64encode(decoded).rstrip(b"=") == encoded, "record_encoding")
            record = json.loads(decoded, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(GateError("record_encoding")))
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_encoding") from exc
        verdict(m, phase, nonce, prior, record)
        return record


    def marker_token(line, name):
        # The marker from its name to the end of the line, after an optional
        # prefix that ends in whitespace (the getty prompt); never mid-word.
        line = line.rstrip(b"\r")
        index = line.find(name)
        if index > 0 and not line[index - 1:index].isspace():
            return line
        return line[index:]


    # lab#177 (ADR-0014): the guest also sends every record line to /dev/kmsg,
    # as numbered bounded chunks of its base64url text (1 kmsg record holds
    # about 1 KiB; a record can reach 8 KiB, 12 KiB for sysext). The host joins
    # them back into the serial slice before any parser reads it, so no parser
    # changes.
    KMSG_TOKEN = rb"SNOW_QA_KMSG1 ([0-9a-f]{16}) ([0-9]{1,2})/([0-9]{1,2}) ([0-9a-f]{8}) ([A-Za-z0-9_-]{1,384})"
    # A joined line is one of the 4 marker lines. A slice line counts as a
    # complete record only when it also matches the bound its own parser uses,
    # so a copy the kernel cut into is never reported as a record.
    MARKER_LINE = rb"(?:SNOW_QA_V1|SNOW_QA_ERR|SNOW_SYSEXT_V1|SNOW_SYSEXT_ERR|SNOW_LOGIN_V1|SNOW_LOGIN_ERR|SNOW_PROBLEMS_V1|SNOW_PROBLEMS_ERR|SNOW_REPORT_V1|SNOW_REPORT_ERR) [ -~]+"
    COMPLETE_LINES = ((b"SNOW_QA_V1", rb"[A-Za-z0-9_-]{1,8192}"),
                      (b"SNOW_QA_ERR", rb"[a-z_]{1,40}"),
                      (b"SNOW_SYSEXT_V1", rb"[A-Za-z0-9_-]{1,%d}" % (SYSEXT_TOKEN_MAX + 64)),
                      (b"SNOW_SYSEXT_ERR", rb"[a-z_]{1,40}"),
                      (b"SNOW_LOGIN_V1", rb"[A-Za-z0-9_-]{1,8192}"),
                      (b"SNOW_LOGIN_ERR", rb"[a-z_]{1,40}"),
                      (b"SNOW_PROBLEMS_V1", rb"[A-Za-z0-9_-]{1,%d}" % (PROBLEMS_TOKEN_MAX + 64)),
                      (b"SNOW_PROBLEMS_ERR", rb"[a-z_]{1,40}"),
                      (b"SNOW_REPORT_V1", rb"[A-Za-z0-9_-]{1,%d}" % (REPORT_TOKEN_MAX + 64)),
                      (b"SNOW_REPORT_ERR", rb"[a-z_]{1,40}"))
    SERIAL_MAX = 1024 * 1024


    def complete_marker(lines):
        """Each marker name whose line in the slice is complete, never cut."""
        found = set()
        for line in lines:
            if b"SNOW_QA_KMSG1" in line:
                continue   # a chunk carrier line is not a record line
            for name, tail in COMPLETE_LINES:
                if name in line and re.fullmatch(name + b" " + tail, marker_token(line, name)) is not None:
                    found.add(name)
        return found


    def kmsg_join(serial):
        """Join the kernel-log chunks into record lines and rewrite the slice."""
        path = Path(serial)
        raw = path.read_bytes()
        require(len(raw) <= SERIAL_MAX, "serial_size")
        # The guest always ends a record line with a newline, so a slice that
        # ends inside a line holds a copy still in transfer, never a record:
        # keep complete lines only (lab#177). The next call makes the slice
        # again from the console snapshot.
        kept = raw[:raw.rfind(b"\n") + 1]
        lines = kept.split(b"\n")
        groups = {}
        for line in lines:
            if b"SNOW_QA_KMSG1" not in line:
                continue
            match = re.fullmatch(KMSG_TOKEN, marker_token(line, b"SNOW_QA_KMSG1"))
            if match is None:
                continue
            ident, index, total, crc, data = match[1], int(match[2]), int(match[3]), match[4], match[5]
            # A cut fragment or a corrupted chunk is dropped, never repaired.
            if not 1 <= index <= total <= KMSG_MAX_CHUNKS:
                continue
            if hashlib.sha256(data).hexdigest()[:8].encode() != crc:
                continue
            groups.setdefault((ident, total), {}).setdefault(index, set()).add(data)
        joined = set()
        for (ident, total), parts in groups.items():
            # 2 different valid chunks for 1 index mean a corrupted record.
            if any(len(chunks) != 1 for chunks in parts.values()):
                continue
            if sorted(parts) != list(range(1, total + 1)):
                continue
            encoded = b"".join(next(iter(parts[index])) for index in range(1, total + 1))
            # Canonical base64url only: the guest never pads, so a token that
            # does not re-encode to the same text is not its chunk text.
            try:
                decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4),
                                           altchars=b"-_", validate=True)
            except ValueError:
                continue
            if base64.urlsafe_b64encode(decoded).rstrip(b"=") != encoded:
                continue
            # The id binds the whole line; a joined line is a record line only.
            if hashlib.sha256(decoded).hexdigest()[:16].encode() != ident:
                continue
            if re.fullmatch(MARKER_LINE, decoded) is None:
                continue
            joined.add(decoded)
        # Idempotent: a line the slice already holds is never appended again.
        have = set(lines)
        added = [line for line in sorted(joined) if line not in have]
        payload = kept + b"".join(line + b"\n" for line in added)
        require(len(payload) <= SERIAL_MAX, "serial_size")
        with open(path, "wb", opener=lambda name, flags: os.open(name, flags, 0o600)) as stream:
            stream.write(payload)
        print("serial_record=%d kmsg_record=%d" %
              (1 if complete_marker(lines) else 0, 1 if joined else 0))


    def phase_verdict(m, phase, nonce, prior, serial, checks):
        return phase_attest(m, phase, nonce, prior, serial, checks)["boot_id"]


    def sysext_decode(encoded):
        """One published record, or None for a marker that does not decode."""
        try:
            require(0 < len(encoded) <= SYSEXT_TOKEN_MAX + 64, "record_encoding")
            decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
            require(base64.urlsafe_b64encode(decoded).rstrip(b"=") == encoded, "record_encoding")
            # Bound the decompressed size: a hostile token must not expand freely.
            raw = zlib.decompressobj().decompress(decoded, 262144)
            data = json.loads(raw, object_pairs_hook=pairs,
                              parse_constant=lambda _: (_ for _ in ()).throw(GateError("record_encoding")))
        except (ValueError, UnicodeError, zlib.error, GateError):
            return None
        return data if type(data) is dict else None


    def sysext_record(path):
        try:
            raw = Path(path).read_bytes()
            require(len(raw) <= 1048576, "record_size")
            data = json.loads(raw, object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_fields") from exc
        require(type(data) is dict, "record_fields")
        return data


    def mapping(value):
        return value if type(value) is dict else {}


    SYSEXT_CODE = r"[a-z_]{1,40}(?::[A-Za-z0-9@._:-]{1,96})?"
    ACCOUNT_NAME = r"[A-Za-z_][A-Za-z0-9_.-]{0,31}"


    def sysext_compare(record, enable, units):
        """Host checks against the enable record: first-start bytes and account ids.

        Only manifest first-start units and valid account names can name a code:
        record keys are guest data and must never shape checks.txt or the reason.
        """
        failures = set()
        before = mapping(enable.get("first_start"))
        current = mapping(record.get("first_start"))
        for unit in units:
            item, prior = current.get(unit), before.get(unit)
            if type(item) is not dict or type(prior) is not dict or prior.get("exists") is not True:
                # Not made in the enable boot: the guest's own codes report it, and
                # a first start in the reboot boot is no rerun.
                continue
            if item.get("exists") is True and item.get("sha256") != prior.get("sha256"):
                failures.add("first_start_changed:" + unit)
            if item.get("ConditionResult") != "no":
                failures.add("first_start_rerun:" + unit)
        for group, key in (("users", "uid"), ("groups", "gid")):
            old = mapping(mapping(enable.get("sysusers")).get(group))
            new = mapping(mapping(record.get("sysusers")).get(group))
            for name, item in new.items():
                if not full(ACCOUNT_NAME, name):
                    continue
                prior = old.get(name)
                if (type(item) is dict and type(prior) is dict and item.get(key) is not None
                        and prior.get(key) is not None and item.get(key) != prior.get(key)):
                    failures.add("sysusers_changed:" + name)
        return sorted(failures)


    def sysext_record_count(raw):
        """Every distinct record the serial slice carries; unreadable tokens are dropped."""
        require(len(raw) <= 1024 * 1024, "serial_size")
        records = set()
        for line in raw.split(b"\n"):
            if b"SNOW_SYSEXT_V1" not in line:
                continue
            match = re.fullmatch(rb"SNOW_SYSEXT_V1 ([A-Za-z0-9_-]{1,%d})" % (SYSEXT_TOKEN_MAX + 64),
                                 marker_token(line, b"SNOW_SYSEXT_V1"))
            if match is None:
                continue
            record = sysext_decode(match[1])
            if record is not None:
                records.add(canonical(record))
        require(len(records) == 1, "record_count")
        return json.loads(records.pop(), object_pairs_hook=pairs)


    def sysext_load_evidence(record):
        """The LoadState evidence fields: exact keys, text or null, bounded."""
        def text(value, limit):
            return value is None or (type(value) is str and len(value) <= limit)

        target = record["target"]
        require(type(target) is dict and set(target) == set(SYSEXT_TARGET_KEYS) and
                all(text(target[key], SYSEXT_UPHOLDS_MAX if key == "Upholds" else 240)
                    for key in SYSEXT_TARGET_KEYS), "record_target")
        units = record["units"]
        require(type(units) is dict and all(
            type(entry) is dict and all(key in entry and text(entry[key], 240)
                                        for key in SYSEXT_UNIT_LOAD_KEYS)
            for entry in units.values()), "record_unit_load")


    def sysext_phase_attest(m, phase, nonce, prior, serial, destination, enable=None):
        require("sysext_probe" in m and phase in SYSEXT_PHASES and nonce_valid(nonce) and
                (prior == "none" or boot_id_valid(prior)), "phase_arguments")
        record = sysext_record_count(Path(serial).read_bytes())
        require(set(record) - {"truncated"} == SYSEXT_RECORD_FIELDS, "record_fields")
        require(record["phase"] == phase and record["nonce"] == nonce, "record_identity")
        require(boot_id_valid(record["boot_id"]) and record["boot_id"] != prior, "boot_identity")
        # Fixed-code tokens only: these codes reach checks.txt and the run reason,
        # so one may never carry a newline or another writer's text.
        require(type(record["failures"]) is list and len(record["failures"]) <= 128 and
                all(full(SYSEXT_CODE, code) for code in record["failures"]),
                "record_failures")
        # Evidence only (snosi#1189): shape-checked, never compared and never a failure.
        sysext_load_evidence(record)
        # The guest's own codes are not recomputed; a reboot record is compared with
        # the enable record for the files and accounts it must not change.
        units = [entry["unit"] for entry in m["sysext_probe"]["first_start"]]
        host = sysext_compare(record, sysext_record(enable), units) if phase == "sysext-reboot" and enable else []
        data = dict(record)
        data["host_failures"] = host
        with open(destination, "wb", opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
            stream.write(canonical(data))
        failures = sorted(set(record["failures"]) | set(host))
        # The whole list reaches checks.txt and the run reason: one grammar, one bound.
        require(len(failures) <= 128 and all(full(SYSEXT_CODE, code) for code in failures), "record_failures")
        print(record["boot_id"])
        print("failures=" + (",".join(failures) if failures else "none"))
        return record["boot_id"]


    # The first-login records are report-only evidence. The host still validates
    # every field, the identity and the booted image, so a malformed or foreign
    # record can never become a first-login statement.
    def login_record_shape(record):
        """Strict shape of one login record: exact keys, types and bounds."""
        require(type(record) is dict and set(record) == LOGIN_RECORD_FIELDS, "record_fields")
        require(record["phase"] in LOGIN_PHASES and nonce_valid(record["nonce"]), "record_identity")
        require(full(r"[0-9a-f]{64}", record["booted_digest"]), "record_fields")
        require(record["display_manager"] in (None, "gdm", "sddm")
                and type(record["autologin"]) is bool, "record_fields")
        session = record["session"]
        if session is not None:
            # Only a real user session is evidence: a tty, a greeter or a closing
            # session says nothing about the first login, and every value must be
            # free of control characters and spaces.
            require(type(session) is dict and set(session) == {"type", "class", "state", "desktop"}
                    and session["type"] in ("wayland", "x11") and session["class"] == "user"
                    and session["state"] in ("active", "online")
                    and full(r"[A-Za-z0-9:._+-]{0,64}", session["desktop"]), "record_session")
        require(type(record["entries"]) is list and len(record["entries"]) <= 16
                and all(type(path) is str and path.startswith("/")
                        and full(r"[A-Za-z0-9._/@+-]{1,160}", path) for path in record["entries"]),
                "record_entries")
        apps = record["apps"]
        require(type(apps) is dict and set(apps) == set(LOGIN_APPS) and
                all(type(item) is dict and set(item) == {"entry", "binary"}
                    and type(item["entry"]) is bool and type(item["binary"]) is bool
                    for item in apps.values()), "record_apps")
        require(type(record["started"]) is list and record["started"] == sorted(set(record["started"]))
                and all(app in LOGIN_APPS for app in record["started"]), "record_started")
        require(type(record["mark_done"]) is list and len(record["mark_done"]) <= len(LOGIN_APPS)
                and all(type(item) is dict and set(item) == {"app", "rc"} and item["app"] in LOGIN_APPS
                        and type(item["rc"]) is int and -1 <= item["rc"] <= 255
                        for item in record["mark_done"]), "record_mark_done")
        require(type(record["markers"]) is dict and set(record["markers"]) == set(LOGIN_APPS)
                and all(type(value) is bool for value in record["markers"].values()), "record_markers")
        require(type(record["waited"]) is int and 0 <= record["waited"] <= 3600, "record_waited")


    def login_record_count(raw):
        """The one record the serial slice carries, by the SNOW_QA_V1 rules."""
        require(len(raw) <= SERIAL_MAX, "serial_size")
        lines = [line for line in raw.split(b"\n") if b"SNOW_QA_KMSG1" not in line]
        # Identical copies (ttyS0 and the getty rewrite) collapse into one token;
        # a getty prompt before the marker is not part of it.
        tokens = {marker_token(line, b"SNOW_LOGIN_V1") for line in lines if b"SNOW_LOGIN_V1" in line}
        # A stalled ttyS0 can cut the line and the kernel text follows on it, so
        # only a complete token is a record; an incomplete marker is a cut record.
        markers = {token for token in tokens
                   if re.fullmatch(rb"SNOW_LOGIN_V1 ([A-Za-z0-9_-]{1,8192})", token) is not None}
        require(markers or not tokens, "record_encoding")
        require(len(markers) == 1, "record_count")
        match = re.fullmatch(rb"SNOW_LOGIN_V1 ([A-Za-z0-9_-]{1,8192})", sorted(markers)[0])
        require(match is not None, "record_encoding")
        encoded = match[1]
        try:
            decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
            require(base64.urlsafe_b64encode(decoded).rstrip(b"=") == encoded, "record_encoding")
            require(len(decoded) <= LOGIN_TOKEN_MAX, "record_size")
            record = json.loads(decoded, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(GateError("record_encoding")))
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_encoding") from exc
        return record


    def login_phase_attest(m, phase, nonce, prior, serial, destination):
        require("first_login_probe" in m and phase in LOGIN_PHASES and nonce_valid(nonce) and
                (prior == "none" or boot_id_valid(prior)), "phase_arguments")
        record = login_record_count(Path(serial).read_bytes())
        login_record_shape(record)
        require(record["phase"] == phase and record["nonce"] == nonce, "record_identity")
        require(boot_id_valid(record["boot_id"]) and record["boot_id"] != prior, "boot_identity")
        # Both login boots run the installed N image; the probe never stages N+1.
        require(record["booted_digest"] == m["image_n"].rsplit(":", 1)[-1], "booted_image")
        with open(destination, "wb", opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
            stream.write(canonical(record))
        print(record["boot_id"])
        print("started=" + ("+".join(record["started"]) if record["started"] else "none"))
        print("session=" + (record["session"]["type"] if record["session"] else "none"))
        return record["boot_id"]


    def login_record(path):
        """One written login record, read back and shape-checked."""
        try:
            raw = Path(path).read_bytes()
            require(len(raw) <= 65536, "record_size")
            data = json.loads(raw, object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_fields") from exc
        login_record_shape(data)
        return data


    def login_detail(record):
        """One fixed detail line per login boot; every value is bounded evidence."""
        def listed(values):
            return ",".join(values) if values else "none"

        return ("phase=%s dm=%s autologin=%s session=%s started=%s entries=%s mark_done=%s "
                "markers=%s waited=%d" % (
                    record["phase"], record["display_manager"] or "none",
                    "yes" if record["autologin"] else "no",
                    record["session"]["type"] if record["session"] else "none",
                    "+".join(record["started"]) if record["started"] else "none",
                    listed([os.path.basename(path) for path in record["entries"]]),
                    listed(["%s:%d" % (item["app"], item["rc"]) for item in record["mark_done"]]),
                    listed([app for app in LOGIN_APPS if record["markers"][app]]),
                    record["waited"]))


    def login_summary(m, records):
        """The one-word first-login verdict; report only, never a failure."""
        first = records[0]
        if m["product"] == "floe" or first["display_manager"] is None:
            if m["product"] != "floe":
                # A desktop product whose display manager the probe never named:
                # nothing about a first login is proven, and nothing failed.
                return "unproven-no-display-manager"
            # Floe is a headless server: there is no first-run autostart entry.
            known = any(record["entries"] or record["apps"][app]["entry"] or record["apps"][app]["binary"]
                        for record in records for app in LOGIN_APPS)
            return "headless-entry" if known else "headless-no-entry"
        if any(record["autologin"] is False for record in records):
            return "unproven-no-autologin"
        if any(record["session"] is None for record in records):
            return "unproven-no-session"
        if len(records) < 2:
            return "unproven-no-second-login"
        once, second = records[0], records[1]
        if second["started"]:
            # The app ran again on the second fresh login: its marker did not
            # stop it, which is what a first-run gate must do.
            return ("repeated-" if once["started"] else "late-") + "+".join(
                sorted(set(once["started"]) | set(second["started"])))
        if not once["started"]:
            return "none"
        if len(once["started"]) > 1:
            return "both-once"
        app = once["started"][0]
        done = [item for item in once["mark_done"] if item["app"] == app]
        if not done or done[0]["rc"] != 0 or once["markers"][app] is not True:
            return app + "-once-mark-done-failed"
        return app + "-once"


    def login_report(m, first, second=None):
        records = [login_record(Path(path)) for path in (first, second) if path is not None]
        require(records, "record_fields")
        summary = login_summary(m, records)
        # The summary reaches checks.txt and the run reason: one grammar, one bound.
        require(LOGIN_SUMMARY.fullmatch(summary) is not None, "record_fields")
        print("first_login=" + summary)
        for record in records:
            print(login_detail(record))


    def fsverity_error_count(log):
        """Count fs-verity corruption messages in a kernel log; never edits the log.

        Kernels 7.2.11 to 7.2.14 log "FILE CORRUPTED" when btrfs readahead verifies
        a large folio of an fs-verity file too early; the re-read succeeds
        (frostyard/snosi#1130; upstream kdave/linux 254e15591ee4). Compressed
        extents hit it almost always; uncompressed files rarely, at extent
        boundaries. The runner judges the count against a known-defect kernel list.
        """
        total = 0
        for line in log.splitlines():
            if b"FILE CORRUPTED" in line:
                total += 1
            suppressed = re.search(rb"fsverity_msg: ([0-9]{1,9}) callbacks suppressed", line)
            if suppressed:
                total += int(suppressed[1])
        return total


    # lab#174: the kept fs-verity lines are evidence, never a judge input; 32 is
    # the same bound every lane uses for one phase.
    FSVERITY_LINES_MAX = 32
    # One message of the kernel log: the file identity only. The line also
    # carries a wanted and a real sha512, and those never leave the guest.
    FSVERITY_MESSAGE = re.compile(
        rb"fs-verity \(([A-Za-z0-9._-]{1,32}), inode ([0-9]{1,20})\): "
        rb"FILE CORRUPTED! pos=([0-9]{1,20}), level=(-?[0-9]{1,2})(,|$)")


    def fsverity_lines(log):
        """[device, inode, pos, level] for each fs-verity corruption line, in log order.

        Read-only, like fsverity_error_count: the log is never edited. A line that
        does not match the message shape is ignored (its count still reaches
        fsverity_errors), an entry whose inode or pos does not fit 64 bits is
        skipped, and only the first FSVERITY_LINES_MAX entries are kept.
        """
        found = []
        for line in log.splitlines():
            match = FSVERITY_MESSAGE.search(line)
            if match is None:
                continue
            # group 5 is the comma-or-end that closes the message.
            device, inode, pos, level = match.group(1, 2, 3, 4)
            inode, pos = int(inode), int(pos)
            if inode >= 2**64 or pos >= 2**64:
                continue
            found.append([device.decode("ascii"), inode, pos, int(level)])
            if len(found) == FSVERITY_LINES_MAX:
                break
        return found


    def guest_command(args, code, timeout=120):
        return inspect(args, code, timeout=timeout)


    def guest_json(args, code):
        try:
            return json.loads(guest_command(args, code), object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError(code) from exc


    def guest_lockdown():
        return b"[integrity]" in GUEST_PATHS["lockdown"].read_bytes() or b"[confidentiality]" in GUEST_PATHS["lockdown"].read_bytes()


    def lockdown_field():
        # Evidence only, read after the lockdown gate: a mode this read cannot
        # see is "unavailable", never a guess.
        try:
            lockdown_text = GUEST_PATHS["lockdown"].read_bytes()
        except OSError:
            return "unavailable"
        for mode in ("integrity", "confidentiality"):
            if b"[" + mode.encode() + b"]" in lockdown_text:
                return mode
        return "unavailable"


    def cmdline_field():
        try:
            with GUEST_PATHS["cmdline"].open("rb") as source:
                cmdline_raw = source.read(4097)
        except OSError:
            return "unavailable", ["<unavailable>"]
        # A cut read could split a secret below the 32-hex redaction bound, so an
        # oversized command line is not recorded at all (x86 allows 2048 bytes).
        if len(cmdline_raw) > 4096:
            return "unavailable", ["<oversized>"]
        cmdline_text = cmdline_raw.decode("ascii", "replace")
        cleaned = "".join(ch if ch.isspace() or (ord(ch) >= 33 and ord(ch) <= 126) else "?"
                          for ch in cmdline_text)
        raw_tokens = cleaned.split()
        lockdown_tokens = [token.split("=", 1)[1] for token in raw_tokens
                           if token.startswith("lockdown=")]
        if len(lockdown_tokens) == 0:
            cmdline_lockdown = None
        elif len(lockdown_tokens) >= 2:
            cmdline_lockdown = "multiple"
        elif re.fullmatch(r"[a-z]{1,16}", lockdown_tokens[0]) is not None:
            cmdline_lockdown = lockdown_tokens[0]
        else:
            cmdline_lockdown = "malformed"
        redacted = [re.sub(r"[0-9a-fA-F]{32,}", "<hex>", token)[:128]
                    for token in raw_tokens]
        kept = []
        joined_length = 0
        dropped = False
        for token in redacted:
            candidate = joined_length + (1 if kept else 0) + len(token)
            if len(kept) >= 31 or candidate > 1024:
                # Keep a prefix of the command line, in order.
                dropped = True
                break
            kept.append(token)
            joined_length = candidate
        if dropped:
            kept.append("<truncated>")
        if not kept:
            kept = ["<empty>"]
        return cmdline_lockdown, kept


    def guest_status():
        return guest_json(["bootc", "status", "--format", "json"], "bootc_status")


    def status_fields(status):
        try:
            spec = status["spec"]["image"]
            booted = status["status"]["booted"]["image"]
            staged = status["status"].get("staged")
            rollback = status["status"].get("rollback")
            def digest(node):
                if node is None:
                    return None
                value = node["image"]["imageDigest"]
                require(full(r"sha256:[0-9a-f]{64}", value), "status_digest")
                return value.removeprefix("sha256:")
            boot_digest = booted["imageDigest"]
            require(full(r"sha256:[0-9a-f]{64}", boot_digest), "status_digest")
            return spec["image"], spec["transport"], boot_digest.removeprefix("sha256:"), booted["version"], digest(staged), digest(rollback)
        except (KeyError, TypeError, AttributeError, IndexError) as exc:
            raise GateError("bootc_status") from exc


    def status_uki_paths(status):
        # Normalize only complete UKI path tokens, whether bootctl reports
        # $BOOT, a mounted absolute ESP path or the ESP-relative path. Reject
        # even one malformed/prefixed lookalike; repeated identical paths in
        # current and default blocks are normal, different digests are not.
        esp_prefix = re.escape(str(GUEST_PATHS["esp"]).encode())
        # bootctl --esp-path=X prints "uki: X//EFI/..." (a doubled slash).
        pattern = (rb"(?<![A-Za-z0-9_./$-])(?:(?:\$BOOT|/boot/efi|" + esp_prefix + rb")/?)?"
                   rb"(?P<path>/EFI/Linux/bootc/bootc_composefs-[0-9a-f]{128}\.efi)"
                   rb"(?![A-Za-z0-9_./-])")
        matches = list(re.finditer(pattern, status))
        mentions = re.finditer(rb"/EFI/Linux/bootc/bootc_composefs-", status)
        if not matches or any(not any(m.start() <= mention.start() < m.end() for m in matches)
                              for mention in mentions):
            return set()
        return {m.group("path") for m in matches}


    def current_uki(status, uki_path):
        # No assumed bootctl heading or Stub label; all path occurrences must
        # resolve to the single measured UKI on the independent mounted ESP.
        return (status_uki_paths(status) == {uki_path.encode()} and
                re.search(rb"(?im)^[ \t]*Secure Boot:[ \t]*enabled\b(?:[ \t]+\([^\r\n]*\))?[ \t]*$", status) is not None and
                re.search(rb"(?im)^[ \t]*Measured UKI:[ \t]*yes[ \t]*$", status) is not None)


    def adjacent_esp(root_device):
        # Root LUKS backing partition, not a user-supplied ESP or filename.
        info = guest_json(["lsblk", "--json", "--paths", "--output", "PATH,PKNAME,PARTN,FSTYPE"], "esp_discovery")
        require(type(info) is dict and type(info.get("blockdevices")) is list, "esp_discovery")
        nodes = []
        def collect(items):
            for node in items:
                require(type(node) is dict, "esp_discovery")
                nodes.append(node)
                children = node.get("children", [])
                require(type(children) is list, "esp_discovery")
                collect(children)
        collect(info["blockdevices"])
        roots = [n for n in nodes if n.get("path") == root_device]
        require(len(roots) == 1 and roots[0].get("fstype") == "crypto_LUKS" and
                full(r"[2-9][0-9]*", str(roots[0].get("partn"))) and
                full(r"/dev/[a-zA-Z0-9/_-]+", roots[0].get("pkname")), "esp_discovery")
        root = roots[0]
        esps = [n for n in nodes if n.get("pkname") == root["pkname"] and
                str(n.get("partn")) == str(int(root["partn"]) - 1) and
                n.get("fstype") == "vfat" and full(r"/dev/[a-zA-Z0-9/_-]+", n.get("path"))]
        require(len(esps) == 1 and esps[0]["path"] != root_device, "esp_discovery")
        return esps[0]["path"]


    @contextmanager
    def mounted_esp(device):
        esp = GUEST_PATHS["esp"]
        require(not esp.is_symlink() and not os.path.ismount(esp), "esp_mount")
        esp.mkdir(mode=0o700, exist_ok=True)
        guest_command(["mount", "--no-mtab", "-t", "vfat", "-o", "ro,nosuid,nodev,noexec", device, str(esp)], "esp_mount")
        try:
            yield esp
        finally:
            guest_command(["umount", str(esp)], "esp_unmount")


    def esp_uki(esp, status):
        # Bootctl supplies the booted measured path. An independent Type #2
        # BLS entry on the uniquely derived ESP must point at the same UKI.
        paths = status_uki_paths(status)
        require(len(paths) == 1, "uki")
        uki_path = next(iter(paths)).decode()
        require(current_uki(status, uki_path), "uki")
        image = esp / uki_path.lstrip("/")
        require(all(not (esp.joinpath(*image.relative_to(esp).parts[:index])).is_symlink()
                    for index in range(1, len(image.relative_to(esp).parts) + 1)) and
                image.is_file() and image.stat().st_size > 0, "uki")
        require(not (esp / "loader").is_symlink() and not (esp / "loader/entries").is_symlink(), "uki_bls")
        entries = list((esp / "loader/entries").glob("*.conf"))
        require(0 < len(entries) <= 128, "uki_bls")
        matching = []
        for entry in entries:
            require(not entry.is_symlink() and entry.stat().st_size <= 4096, "uki_bls")
            lines = [line.strip().split() for line in entry.read_bytes().splitlines()
                     if line.strip() and not line.lstrip().startswith(b"#")]
            directives = [(line[0].lower(), line[1:]) for line in lines]
            candidates = [value[0] for key, value in directives if key in (b"uki", b"efi") and len(value) == 1]
            if uki_path.encode() in candidates:
                require(len(candidates) == 1 and not any(key in (b"linux", b"initrd") for key, _ in directives), "uki_bls")
                matching.append(entry)
        require(len(matching) == 1, "uki_bls")


    SNOW_POLICY = [{"type": "sigstoreSigned", "keyPath": "/usr/lib/snosi/cosign.pub",
                    "signedIdentity": {"type": "matchRepository"}}]
    LOCAL_TRANSPORTS = ("containers-storage", "tarball", "docker-archive", "oci-archive", "dir", "oci")
    # The strict update policy names these five repositories and no other. An
    # omitted scope is not strict: with the permissive system policy default, an
    # image of that repository would pull unsigned.
    FROSTYARD_SCOPES = ("ghcr.io/frostyard/cayo", "ghcr.io/frostyard/floe", "ghcr.io/frostyard/snow",
                        "ghcr.io/frostyard/snowfield", "ghcr.io/frostyard/sundog")


    def policy_ok(policy, repo=REPO):
        # The shipped snosi strict container policy
        # (shared/bootc-secure/tree/usr/lib/snosi/containers/bootc-policy.json since
        # snosi ADR-0025, shared/bootc-secure/tree/etc/containers/policy.json before
        # it): reject by default; every registry repository it names is
        # sigstore-signed with the pinned key, the product's repository (Snow,
        # Floe, Snowfield or Sundog) exactly so; only local transports accept anything
        # (run-snow-bootc-lifecycle-2tnjh audit, Snow 20261026105903).
        if type(policy) is not dict or set(policy) != {"default", "transports"}:
            return False
        transports = policy["transports"]
        if policy["default"] != [{"type": "reject"}] or type(transports) is not dict:
            return False
        docker = transports.get("docker")
        if type(docker) is not dict or docker.get(repo) != SNOW_POLICY or "" in docker:
            return False
        if not all(type(name) is str and name.startswith("ghcr.io/frostyard/") and rules == SNOW_POLICY
                   for name, rules in docker.items()):
            return False
        return all(name == "docker" or (name in LOCAL_TRANSPORTS and rules == {"": [{"type": "insecureAcceptAnything"}]})
                   for name, rules in transports.items())


    def system_policy_ok(system, strict):
        # snosi ADR-0025: on an image that ships the strict update policy, the
        # system policy at /etc/containers/policy.json accepts workload images by
        # default. Its transports must equal the strict policy's transports, so a
        # Frostyard repository pulled by name still verifies its signature.
        return (type(system) is dict and set(system) == {"default", "transports"} and
                system["default"] == [{"type": "insecureAcceptAnything"}] and
                system["transports"] == strict["transports"])


    def guest(credentials):
        # The probe is product-neutral and headless-safe: it reads bootc, policy,
        # LUKS, TPM and boot state only, with no desktop check, so Floe
        # (headless server), Snowfield and Sundog guests run it unchanged.
        # Credentials are installed by the VM's systemd unit from SMBIOS, not
        # echoed to serial. The normalized manifest is a private host-provided file.
        creds = Path(credentials)
        def credential(name):
            value = (creds / name).read_text().strip()
            require(len(value) <= 256, "credential")
            return value
        phase, nonce = credential("phase"), credential("nonce")
        require(phase in PHASES and nonce_valid(nonce), "credential")
        m = load(GUEST_MANIFEST, frozen=True)
        phase_budget = m["timeouts"]["stage" if phase == "stage" else
                                      "installed_boot" if phase == "installed-n" else "reboot"]
        def uptime_value(path, first_field=False):
            try:
                with path.open("rb") as source:
                    raw = source.read(128)
            except OSError as exc:
                raise GateError("unit_start") from exc
            if first_field:
                raw = raw.split(b" ", 1)[0]
            require(len(raw) <= 64 and re.fullmatch(rb"[0-9]+(?:\.[0-9]+)?\n?", raw) is not None, "unit_start")
            return float(raw)
        started = uptime_value(creds / "unit_started")
        require(started <= uptime_value(GUEST_PATHS["uptime"], first_field=True), "unit_start")
        # Share the phase budget between actions, retaining a probe/evidence window.
        def action_timeout(code):
            now = uptime_value(GUEST_PATHS["uptime"], first_field=True)
            require(now >= started, "unit_start")
            remaining = phase_budget - 120 - (now - started)
            require(remaining > 0, code)
            return remaining
        for key in ("image_n", "image_n_plus_1", "target_ref"):
            require(credential(key) == m[key], "credential")
        boot_id = GUEST_PATHS["boot_id"].read_text().strip()
        require(boot_id_valid(boot_id), "boot_identity")
        def read_policy(name):
            raw = GUEST_PATHS[name].read_bytes()
            require(len(raw) <= 16384, "policy")
            try:
                return json.loads(raw, object_pairs_hook=pairs)
            except (ValueError, UnicodeError) as exc:
                raise GateError("policy") from exc
        # Presence decides the layout, not the parsed value: a present file with a
        # literal null must fail, never fall back to the old layout.
        has_update = GUEST_PATHS["update_policy"].exists()
        parsed = read_policy("policy")
        update = read_policy("update_policy") if has_update else None
        if not has_update:
            # An image before snosi ADR-0025 keeps the strict policy at /etc.
            require(policy_ok(parsed, product_repo(m)), "policy")
        else:
            # A newer image keeps the strict policy in /usr and lets /etc accept
            # workload images by default, so that policy must name every scope.
            require(policy_ok(update, product_repo(m)), "policy")
            require(set(update["transports"]["docker"]) == set(FROSTYARD_SCOPES), "policy")
            require(system_policy_ok(parsed, update), "policy")
        key = GUEST_PATHS["key"].read_bytes()
        require(0 < len(key) <= 16384 and sha(key) == m["cosign_key_sha256"], "policy_key")
        # When the image ships the strict update policy in /usr, the pull passes it
        # with --signature-policy; otherwise it relies on the installed root policy.
        # The probe never passes --tls-verify=false or a permissive policy.
        pull = ["podman", "pull", m["target_ref"]]
        if has_update:
            pull = ["podman", "pull", "--signature-policy", str(GUEST_PATHS["update_policy"]), m["target_ref"]]
        guest_command(pull, "policy_pull", timeout=action_timeout("policy_pull"))
        pulled = guest_command(["podman", "image", "inspect", "--format", "{{.Digest}}", m["target_ref"]], "pull_digest").decode().strip()
        # Podman may report a platform-child digest while skopeo resolved an
        # index digest. Until that relationship is verified on the pinned
        # artifact, reject rather than treating a different digest as proof.
        require(pulled == "sha256:" + m["image_n_plus_1"].rsplit(":", 1)[-1], "pull_digest")
        require(b"enabled" in guest_command(["mokutil", "--sb-state"], "secure_boot").lower(), "secure_boot")
        require(guest_lockdown(), "lockdown")
        lockdown_mode = lockdown_field()
        cmdline_lockdown, cmdline = cmdline_field()
        luks_status = guest_command(["cryptsetup", "status", "root"], "root_luks")
        require(b"/dev/mapper/root is active" in luks_status, "root_luks")
        devices = re.findall(rb"(?m)^\s*device:\s+(/dev/[a-zA-Z0-9/_-]+)\s*$", luks_status)
        require(len(devices) == 1 and b".." not in devices[0], "root_luks")
        # A composefs boot mounts / as overlay; the btrfs root filesystem is /sysroot.
        require(guest_command(["findmnt", "-n", "-o", "FSTYPE", "/sysroot"], "root_btrfs").strip() == b"btrfs", "root_btrfs")
        with mounted_esp(adjacent_esp(devices[0].decode())) as esp:
            esp_uki(esp, guest_command(["bootctl", "--esp-path=" + str(esp), "--no-pager", "status"], "uki"))
        # Inspect LUKS metadata without exporting tokens, sealed blobs or recovery material.
        tokens = guest_json(["cryptsetup", "luksDump", "--dump-json-metadata", devices[0].decode()], "tpm_token")
        entries = tokens.get("tokens")
        require(type(entries) is dict and len(entries) == 1 and all(
            type(token) is dict and token.get("type") == "systemd-tpm2" and
            token.get("tpm2-pcrs") == [] and token.get("tpm2_pubkey_pcrs") == [11] and
            "tpm2-pcrlock" not in token and
            # systemd names the signed-policy public key "tpm2_pubkey" (older: "tpm2-pubkey").
            any(type(token.get(name)) is str and len(token[name]) > 0 for name in ("tpm2_pubkey", "tpm2-pubkey"))
            for token in entries.values()), "tpm_token")
        spec, transport, booted, version, staged, rollback = status_fields(guest_status())
        action = marker = None
        if phase == "stage":
            # Attest the pre-action N boot before invoking the shipped updater.
            require(booted == m["image_n"].rsplit(":", 1)[-1] and version == m["version_n"]
                    and spec == m["target_ref"] and transport == "registry" and staged is None and rollback is None, "booted_image")
            guest_command(["/usr/libexec/bootc-update-stage"], "updater", timeout=action_timeout("updater"))
            spec, transport, booted, version, staged, rollback = status_fields(guest_status())
            marker_text = GUEST_PATHS["update_check"].read_text()
            require(len(marker_text) <= 4096 and "outcome=staged" in marker_text.splitlines(), "stage_outcome")
            with GUEST_PATHS["update_staged"].open("rb") as source:
                staged_marker(m, source.read(4097))
            action, marker = "staged", m["image_n_plus_1"].rsplit(":", 1)[-1]
        elif phase == "rollback":
            require(booted == m["image_n_plus_1"].rsplit(":", 1)[-1] and version == m["version_n_plus_1"]
                    and spec == m["target_ref"] and spec_transport_allowed(phase, transport) and
                    staged is None and rollback == m["image_n"].rsplit(":", 1)[-1], "rollback_image")
            # Preserve the attested pre-action state: rollback changes pending
            # deployment bookkeeping, not the currently running boot.
            guest_command(["bootc", "rollback"], "rollback_action", timeout=action_timeout("rollback_action"))
            action = "rolled-back"
        # After the update/rollback action, so this boot's reads are all counted.
        # -q drops the "-- No entries --" banner; empty or banner-only output means
        # no kernel entry was read, which must not count as zero errors.
        kernel_log = guest_command(["journalctl", "-q", "-k", "-b", "--no-pager"], "fsverity_log")
        require(kernel_log.strip() not in (b"", b"-- No entries --"), "fsverity_log")
        kernel = GUEST_PATHS["osrelease"].read_text().strip()
        require(full(r"[0-9A-Za-z._+~-]{1,64}", kernel), "kernel_field")
        record = dict(phase=phase, nonce=nonce, boot_id=boot_id, spec_image=spec, spec_transport=transport,
                      booted_digest=booted, booted_version=version, staged_digest=staged,
                      rollback_digest=rollback, policy_sha256=sha(key), policy_ok=True,
                      pull_ok=True, pull_digest=pulled.removeprefix("sha256:"), secure_boot=True,
                      uki_type2=True, lockdown=True, lockdown_mode=lockdown_mode,
                      cmdline_lockdown=cmdline_lockdown, cmdline=cmdline,
                      root_luks=True, root_btrfs=True,
                      tpm_pcr11_tokens=1, kernel=kernel, fsverity_errors=fsverity_error_count(kernel_log),
                      fsverity_lines=fsverity_lines(kernel_log),
                      action=action, marker_digest=marker)
        verdict(m, phase, nonce, "none", record)
        return "SNOW_QA_V1 " + base64.urlsafe_b64encode(canonical(record).strip()).decode().rstrip("=")


    # The sysext probe boots the installed N image, enables updex features and
    # reports what merged, which units started and which accounts appeared. It
    # never stages, switches or rolls back an image.
    SYSUSERS_BEFORE = "sysusers-before.json"


    def sanitize(value, limit=240):
        """One captured line: UTF-8 text, no control characters, no long hex runs."""
        text = value.decode("utf-8", "replace") if isinstance(value, bytes) else str(value)
        text = re.sub(r"[\x00-\x1f\x7f-\x9f\u2028\u2029]", "", text)
        text = re.sub(r"[0-9a-fA-F]{32,}", "[REDACTED]", text)
        return text[:limit]


    def tail_lines(raw, limit):
        if not isinstance(raw, bytes):
            return []
        return [sanitize(line) for line in raw.splitlines()[-limit:]]


    def sysext_run(args, timeout=120):
        """Run one probe command. Its status and bounded text become the record."""
        try:
            result = subprocess.run(args, capture_output=True, timeout=timeout, check=False)
        except (OSError, subprocess.SubprocessError):
            return 1, b"", b""
        return result.returncode, result.stdout or b"", result.stderr or b""


    def sysext_show(unit, properties):
        """systemctl show as KEY=VALUE, limited to the named properties."""
        keys = properties.split(",")
        rc, out, _ = sysext_run(["systemctl", "show", "--property=" + properties, unit])
        values = {}
        if rc != 0:
            return values
        for line in out.splitlines():
            key, separator, value = line.decode("utf-8", "replace").partition("=")
            if separator and key in keys and key not in values:
                values[key] = sanitize(value, SYSEXT_UPHOLDS_MAX if key == "Upholds" else 240)
        return values


    def sysext_journal(unit, limit):
        rc, out, err = sysext_run(["journalctl", "-b", "-u", unit, "--no-pager",
                                   "-o", "short-monotonic", "-n", str(limit)])
        return tail_lines(out + err, limit) if rc == 0 else []


    def sysext_journal_head(unit, limit):
        """The first journal lines of this boot: where a failure started (lab#165).

        journalctl -n +N lists the oldest N entries of the current boot, which
        systemd 254 and later accept.
        """
        rc, out, _ = sysext_run(["journalctl", "-b", "-u", unit, "--no-pager",
                                 "-o", "short-monotonic", "-n", "+" + str(limit)])
        return [sanitize(line) for line in out.splitlines()[:limit]] if rc == 0 else []


    def sysext_merged():
        """Extension names merged on /usr, plus the names exactly as reported."""
        rc, out, _ = sysext_run(["systemd-sysext", "status", "--json=short"])
        if rc != 0 or len(out) > 65536:
            return {"names": [], "reported": []}
        try:
            data = json.loads(out, object_pairs_hook=pairs)
        except (ValueError, UnicodeError, GateError):
            return {"names": [], "reported": []}
        nodes = data if type(data) is list else data.get("hierarchies") if type(data) is dict else None
        reported = []
        if type(nodes) is not list:
            return {"names": [], "reported": []}
        for node in nodes:
            if type(node) is not dict or node.get("hierarchy") not in ("/usr", "usr"):
                continue
            entries = node.get("extensions")
            if type(entries) is not list:
                continue
            for entry in entries:
                if type(entry) is str:
                    reported.append(entry)
                elif type(entry) is dict and type(entry.get("name")) is str:
                    reported.append(entry["name"])
        reported = sorted({sanitize(name) for name in reported})
        names = sorted({name[:-4] if name.endswith(".raw") else name for name in reported})
        return {"names": names, "reported": reported}


    def sysext_link(feature):
        """The basename /var/lib/extensions/<feature>.raw resolves to, or None."""
        try:
            return sanitize((SYSEXT_EXTENSIONS / (feature + ".raw")).resolve(strict=True).name)
        except (OSError, RuntimeError):
            return None


    def sysext_poll(units):
        """Wait, bounded, for every probed unit to report ActiveState=active."""
        end = time.monotonic() + SYSEXT_POLL_TIMEOUT
        while True:
            if all(sysext_show(unit, "ActiveState").get("ActiveState") == "active" for unit in units):
                return
            if time.monotonic() >= end:
                return
            time.sleep(SYSEXT_POLL_INTERVAL)


    def sysext_settle(units):
        """Sample every probed unit, wait SYSEXT_SETTLE once, then sample again.

        The target is sampled with the second sample, so it shows the state after the wait.
        """
        properties = ("ActiveState,SubState,Result,NRestarts,ActiveEnterTimestampMonotonic,"
                      "LoadState,NeedDaemonReload")
        before = {unit: sysext_show(unit, properties) for unit in units}
        time.sleep(SYSEXT_SETTLE)
        after = {unit: sysext_show(unit, properties) for unit in units}
        target = sysext_show(SYSEXT_TARGET, ",".join(SYSEXT_TARGET_KEYS))
        return before, after, {key: target.get(key) for key in SYSEXT_TARGET_KEYS}


    def sysext_unit_codes(unit, before, after):
        """Failure codes for one probed unit across the settle window (lab#165).

        A Type=simple unit in a crash loop samples as active between two
        restarts, so both samples must be active, with the same NRestarts and
        the same ActiveEnterTimestampMonotonic. A .socket or .mount has no NRestarts.
        """
        codes = []
        if before.get("ActiveState") != "active" or after.get("ActiveState") != "active":
            codes.append("unit_inactive:" + unit)
        restarts = (before.get("NRestarts"), after.get("NRestarts"))
        entered = (before.get("ActiveEnterTimestampMonotonic"),
                   after.get("ActiveEnterTimestampMonotonic"))
        restarted = (restarts[0] != restarts[1] or entered[0] != entered[1]
                     or not full(r"[0-9]+", entered[1]) or int(entered[1]) == 0)
        if unit.endswith(".service") and not all(full(r"[0-9]+", value) for value in restarts):
            restarted = True
        if restarted:
            codes.append("unit_restarted:" + unit)
        return codes


    def sysext_unit_state(unit, before, after):
        """One unit's state after the settle window, with both samples' evidence."""
        first, last = before.get(unit, {}), after.get(unit, {})
        entry = {key: last.get(key) for key in
                 ("ActiveState", "SubState", "Result", "NRestarts") + SYSEXT_UNIT_LOAD_KEYS}
        entry["NRestartsBefore"] = first.get("NRestarts")
        entry["ActiveEnterBefore"] = first.get("ActiveEnterTimestampMonotonic")
        entry["ActiveEnterAfter"] = last.get("ActiveEnterTimestampMonotonic")
        entry["settle"] = SYSEXT_SETTLE
        failed = bool(sysext_unit_codes(unit, first, last))
        entry["journal"] = sysext_journal(unit, 20) if failed else []
        entry["journal_head"] = sysext_journal_head(unit, SYSEXT_HEAD_LINES) if failed else []
        return entry


    def sysext_first_start(entry):
        """The first-start unit state and the file it is expected to have written."""
        unit, path = entry["unit"], entry["path"]
        state = sysext_show(unit, "ActiveState,Result,ConditionResult,ExecMainStartTimestampMonotonic,ExecMainStatus")
        item = {key: state.get(key) for key in ("ActiveState", "Result", "ConditionResult",
                                                "ExecMainStartTimestampMonotonic", "ExecMainStatus")}
        item.update(exists=False, size=None, mode=None, sha256=None)
        target = SYSEXT_ROOT / path.lstrip("/")
        try:
            if target.is_file() and not target.is_symlink():
                info = target.stat()
                digest = hashlib.sha256()
                with target.open("rb") as stream:
                    for chunk in iter(lambda: stream.read(65536), b""):
                        digest.update(chunk)
                item.update(exists=True, size=info.st_size, mode=format(info.st_mode & 0o7777, "04o"),
                            sha256=digest.hexdigest())
        except OSError:
            pass
        item["journal"] = sysext_journal(unit, 10)
        return item


    def sysusers_names():
        try:
            return sorted(path.name for path in SYSUSERS_DIR.glob("*.conf") if path.is_file())
        except OSError:
            return []


    def sysusers_save(names):
        SYSEXT_STATE.mkdir(mode=0o700, parents=True, exist_ok=True)
        with open(SYSEXT_STATE / SYSUSERS_BEFORE, "wb",
                  opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
            stream.write(canonical(names))


    def sysusers_before():
        try:
            raw = (SYSEXT_STATE / SYSUSERS_BEFORE).read_bytes()
            data = json.loads(raw[:65536], object_pairs_hook=pairs)
        except (OSError, ValueError, UnicodeError, GateError):
            return []
        return data if type(data) is list and all(type(name) is str for name in data) else []


    def sysusers_entries(fragments):
        """u NAME, g NAME and m USER GROUP lines of the new fragments."""
        users, groups, memberships = [], [], []
        for name in fragments:
            try:
                raw = (SYSUSERS_DIR / name).read_bytes()[:65536]
            except OSError:
                continue
            for line in raw.decode("utf-8", "replace").splitlines():
                fields = line.strip().split()
                if not fields or fields[0].startswith("#"):
                    continue
                kind = fields[0]
                if kind in ("u", "g") and len(fields) >= 2 and full(r"[A-Za-z_][A-Za-z0-9_.-]{0,31}", fields[1]):
                    (users if kind == "u" else groups).append(fields[1])
                elif kind == "m" and len(fields) >= 3 and full(r"[A-Za-z_][A-Za-z0-9_.-]{0,31}", fields[1]) \
                        and full(r"[A-Za-z_][A-Za-z0-9_.-]{0,31}", fields[2]):
                    memberships.append((fields[1], fields[2]))
        return users, groups, memberships


    def getent_id(database, name):
        """The uid or gid getent reports for one name, or None when it is absent."""
        rc, out, _ = sysext_run(["getent", database, name], timeout=60)
        if rc != 0:
            return None
        lines = out.decode("utf-8", "replace").splitlines()[:1]
        fields = lines[0].split(":") if lines else []
        if len(fields) < 4 or fields[0] != name or not fields[2].isdigit():
            return None
        return int(fields[2])


    def sysusers_state(fragments):
        users, groups, memberships = sysusers_entries(fragments)
        state = {"fragments": fragments, "users": {}, "groups": {}, "memberships": {}}
        failures = set()
        for name in users:
            uid = getent_id("passwd", name)
            state["users"][name] = {"present": uid is not None, "uid": uid}
            if uid is None:
                failures.add("sysusers_missing:" + name)
        for name in groups:
            gid = getent_id("group", name)
            state["groups"][name] = {"present": gid is not None, "gid": gid}
            if gid is None:
                failures.add("sysusers_missing:" + name)
        for user, group in memberships:
            rc, out, _ = sysext_run(["id", "-nG", user], timeout=60)
            member = rc == 0 and group in out.decode("utf-8", "replace").split()
            state["memberships"][user + ":" + group] = member
            if not member:
                failures.add("sysusers_missing:" + user + ":" + group)
        return state, failures


    def sysext_token(record):
        return base64.urlsafe_b64encode(zlib.compress(canonical(record).strip(), 9)).decode().rstrip("=")


    def sysext_line_lists(record):
        """Every journal-like line list of a record, oldest line first."""
        lists = [record["extra_journal"][unit] for unit in sorted(record["extra_journal"])]
        lists += [record["units"][unit]["journal"] for unit in sorted(record["units"])]
        lists += [record["first_start"][unit]["journal"] for unit in sorted(record["first_start"])]
        lists += [record["updex"][feature]["output"] for feature in sorted(record["updex"])]
        return [entry for entry in lists if entry]


    def sysext_head_lists(record):
        """The non-empty journal heads of the probed units, in unit order (lab#165)."""
        lists = [record["units"][unit]["journal_head"] for unit in sorted(record["units"])]
        return [entry for entry in lists if entry]


    def sysext_truncate(record):
        """The published token; the oldest captured lines yield until it fits."""
        data = json.loads(canonical(record), object_pairs_hook=pairs)
        encoded = sysext_token(data)
        if len(encoded) <= SYSEXT_TOKEN_MAX:
            return encoded
        data["truncated"] = True
        while len(encoded) > SYSEXT_TOKEN_MAX:
            # The tails yield first; a head only loses its newest line, so the
            # first cause of a failure stays longest (lab#165).
            lists = sysext_line_lists(data)
            if lists:
                lists[0].pop(0)
            else:
                heads = sysext_head_lists(data)
                if not heads:
                    break
                heads[-1].pop()
            encoded = sysext_token(data)
        require(len(encoded) <= SYSEXT_TOKEN_MAX, "record_size")
        return encoded


    def sysext(credentials):
        """One sysext-probe record: merged extensions, units, first start, sysusers."""
        creds = Path(credentials)

        def credential(name):
            value = (creds / name).read_text().strip()
            require(len(value) <= 256, "credential")
            return value

        phase, nonce = credential("phase"), credential("nonce")
        require(phase in SYSEXT_PHASES and nonce_valid(nonce), "credential")
        m = load(GUEST_MANIFEST, frozen=True)
        require("sysext_probe" in m, "sysext_manifest")
        probe = m["sysext_probe"]
        for key in ("image_n", "image_n_plus_1", "target_ref"):
            require(credential(key) == m[key], "credential")
        boot_id = GUEST_PATHS["boot_id"].read_text().strip()
        require(boot_id_valid(boot_id), "boot_identity")
        # status_fields validates the bootc status shape; only the booted digest is
        # recorded here, and it must name image_n in every sysext phase.
        _, _, booted_digest, _, _, _ = status_fields(guest_status())
        if phase == "sysext-enable":
            # Before any action: the fragments this enable writes are the new ones.
            before = sysusers_names()
            sysusers_save(before)
            updex = {}
            for feature in probe["features"]:
                rc, out, err = sysext_run(["updex", "features", "enable", feature, "--now"], timeout=600)
                updex[feature] = {"rc": rc, "output": tail_lines(out + err, 20)}
            sysext_poll(probe["units"])
        else:
            before = sysusers_before()
            updex = {}
            sysext_poll(probe["units"])
        settle_before, settle_after, target = sysext_settle(probe["units"])
        merged = sysext_merged()
        links = {feature: sysext_link(feature) for feature in probe["features"]}
        units = {unit: sysext_unit_state(unit, settle_before, settle_after) for unit in probe["units"]}
        first_start = {entry["unit"]: sysext_first_start(entry) for entry in probe["first_start"]}
        fragments = [name for name in sysusers_names() if name not in before]
        sysusers, failures = sysusers_state(fragments)
        extra_journal = {}
        for unit in ("reload-sysext.service", "systemd-sysext.service"):
            if sysext_show(unit, "Result").get("Result") not in (None, "", "success"):
                extra_journal[unit] = sysext_journal(unit, 20)
        if not fragments:
            failures.add("no_sysusers_fragment")
        for feature, entry in updex.items():
            if entry["rc"] != 0:
                failures.add("updex_enable:" + feature)
        for feature in probe["features"]:
            if feature not in merged["names"]:
                failures.add("not_merged:" + feature)
            if links[feature] is None:
                failures.add("not_linked:" + feature)
        for unit in probe["units"]:
            failures.update(sysext_unit_codes(unit, settle_before.get(unit, {}),
                                              settle_after.get(unit, {})))
        for unit, entry in first_start.items():
            if not entry["exists"]:
                failures.add("first_start_missing:" + unit)
            if phase == "sysext-enable":
                started = entry["ExecMainStartTimestampMonotonic"] or ""
                if entry["Result"] != "success" or not started.isdigit() or int(started) == 0:
                    failures.add("first_start_not_run:" + unit)
        if booted_digest != m["image_n"].rsplit(":", 1)[-1]:
            failures.add("booted_image")
        record = dict(phase=phase, nonce=nonce, boot_id=boot_id, booted_digest=booted_digest,
                      updex=updex, merged=merged, links=links, units=units, target=target,
                      first_start=first_start, sysusers=sysusers, extra_journal=extra_journal,
                      failures=sorted(failures))
        require(set(record) == SYSEXT_RECORD_FIELDS, "record_fields")
        return "SNOW_SYSEXT_V1 " + sysext_truncate(record)


    # The first-login probe: after a fresh install a test-only autologin
    # configuration in the installed /etc logs a user in, and the probe records
    # which first-login app started. It is report-only: no display manager, no
    # session or a failed first run is evidence, never a failure of the run.
    def login_path(path):
        """One absolute guest path below LOGIN_ROOT."""
        return LOGIN_ROOT / str(path).lstrip("/")


    def login_read(path, limit=65536):
        """Bounded bytes of one guest file, or None when it cannot be read."""
        try:
            require(not path.is_symlink(), "login_read")
            with path.open("rb") as stream:
                return stream.read(limit)
        except (OSError, GateError):
            return None


    def login_run(args, timeout=120):
        """One probe command: (rc, stdout at most 1 MiB); rc -1 on timeout or OSError."""
        try:
            result = subprocess.run(args, capture_output=True, timeout=timeout, check=False)
        except (OSError, subprocess.SubprocessError):
            return -1, b""
        return result.returncode, (result.stdout or b"")[:LOGIN_OUTPUT_MAX]


    def login_display_manager():
        """Which display manager is active: gdm, sddm, or None."""
        rc, out = login_run(["systemctl", "show", "--value", "-p", "Id", "display-manager.service"], 60)
        if rc != 0:
            return None
        name = out.strip()
        if name in (b"gdm.service", b"gdm3.service"):
            return "gdm"
        return "sddm" if name == b"sddm.service" else None


    def login_config_lines(path):
        """The active (non-comment) lines of a config file, or None when unreadable."""
        raw = login_read(path)
        if raw is None:
            return None
        return [line.strip() for line in raw.decode("utf-8", "replace").splitlines()
                if line.strip() and not line.lstrip().startswith("#")]


    def login_active_lines(path):
        """The active (non-comment) lines of a config file; read only, never edited."""
        return login_config_lines(path) or []


    def login_section_keys(lines, name):
        """key -> value of the active lines of one [section], whitespace stripped.

        SDDM and GLib both strip whitespace around `=` and around a section
        name, so `User = other` is as active as `User=other`, and ` [Autologin] `
        names the same section. Keys stay case-sensitive. The last active line
        of a key wins, as GLib's key file reader takes it.
        """
        values, inside = {}, False
        for line in lines:
            stripped = line.strip()
            if stripped.startswith("[") and stripped.endswith("]"):
                inside = stripped[1:-1].strip() == name
                continue
            if not inside:
                continue
            key, separator, value = stripped.partition("=")
            if separator:
                values[key.strip()] = value.strip()
        return values


    def login_autologin(display_manager):
        """True when the autologin configuration the setup wrote still applies."""
        if display_manager == "gdm":
            values = login_section_keys(login_active_lines(login_path("etc/gdm3/daemon.conf")), "daemon")
            return (values.get("AutomaticLoginEnable") == "true"
                    and values.get("AutomaticLogin") == LOGIN_USER)
        if display_manager != "sddm":
            return False
        # The same parse for the drop-in: an effective `User = snowqa` is the
        # one the setup wrote, whatever whitespace it carries.
        dropin = login_section_keys(login_active_lines(
            login_path("etc/sddm.conf.d/zz-snow-qa-autologin.conf")), "Autologin")
        if dropin.get("User") != LOGIN_USER:
            return False
        main = login_path("etc/sddm.conf")
        if not (main.exists() or main.is_symlink()):
            return True
        # SDDM reads /etc/sddm.conf after /etc/sddm.conf.d, so an active
        # [Autologin] User, Session or Relogin key there wins over the drop-in:
        # autologin is then not the configuration this probe wrote. A file that
        # cannot be read may hold such a key: fail closed.
        lines = login_config_lines(main)
        if lines is None:
            return False
        return not any(key in login_section_keys(lines, "Autologin")
                       for key in LOGIN_SDDM_AUTOLOGIN_KEYS)


    def login_account():
        """The QA account's passwd entry, or None when no account exists."""
        try:
            return pwd.getpwnam(LOGIN_USER)
        except KeyError:
            return None


    def login_home(account):
        """The account's home directory, bounded and absolute, or None.

        An unusable home is treated as no account home: the probe then reads no
        user folder and records both markers false.
        """
        home = getattr(account, "pw_dir", None) if account is not None else None
        if type(home) is not str or ".." in home.split("/"):
            return None
        return home if full(r"/[A-Za-z0-9._/-]{1,128}", home) else None


    def login_exists(path):
        """True for a regular file below LOGIN_ROOT, never for a link."""
        target = login_path(path)
        return target.is_file() and not target.is_symlink()


    def login_entries(home):
        """Sorted absolute autostart entries whose file name names a first run."""
        folders = [login_path(name) for name in LOGIN_AUTOSTART_DIRS]
        if home is not None:
            folders.append(login_path(home.rstrip("/") + "/.config/autostart"))
        found = set()
        for folder in folders:
            names = []
            try:
                for entry in folder.iterdir():
                    # A bounded scan: an autostart directory holds a few dozen
                    # files, and the record keeps at most 16 entries.
                    require(len(names) < 1024, "login_entries")
                    names.append(entry.name)
            except OSError:
                continue
            for name in names:
                path = folder / name
                if not name.endswith(".desktop") or LOGIN_ENTRY_NAME.search(name) is None:
                    continue
                # One odd file name is skipped, never a GateError: a name the
                # record cannot carry must not turn the whole probe into an error.
                if not (path.is_absolute() and full(r"[A-Za-z0-9._/@+-]{1,160}", str(path))):
                    continue
                found.add(str(path))
        require(len(found) <= 16, "login_entries")
        return sorted(found)


    def login_apps():
        """Which known first-login apps have their autostart entry and their binary."""
        return {app: {"entry": login_exists(LOGIN_ENTRIES[app]), "binary": login_exists(LOGIN_BINARIES[app])}
                for app in LOGIN_APPS}


    def login_session_state(identifier):
        """The session's type, class, state and desktop, or None while it is not ready."""
        rc, out = login_run(["loginctl", "show-session", identifier,
                             "-p", "Type", "-p", "Class", "-p", "State", "-p", "Desktop"], 60)
        if rc != 0:
            return None
        values = {}
        for line in out.decode("utf-8", "replace").splitlines()[:64]:
            key, separator, value = line.partition("=")
            if separator and key in ("Type", "Class", "State", "Desktop") and key not in values:
                values[key] = sanitize(value, 64)
        session = {"type": values.get("Type", ""), "class": values.get("Class", ""),
                   "state": values.get("State", ""), "desktop": values.get("Desktop", "")}
        # A session that is not yet the user's graphical session is not evidence
        # that nobody logged in: keep waiting for the rest of the window.
        ready = (session["type"] in ("wayland", "x11") and session["class"] == "user"
                 and session["state"] in ("active", "online"))
        return session if ready else None


    def login_session(session_wait):
        """Wait, bounded, for the QA user's active desktop session."""
        end = time.monotonic() + session_wait
        while True:
            rc, out = login_run(["loginctl", "show-user", LOGIN_USER, "-p", "Display", "--value"], 60)
            identifier = out.strip().decode("utf-8", "replace") if rc == 0 else ""
            if full(r"[A-Za-z0-9._-]{1,64}", identifier):
                session = login_session_state(identifier)
                if session is not None:
                    return session
            if time.monotonic() >= end:
                return None
            time.sleep(LOGIN_POLL)


    def login_processes(uid):
        """Every running process of one real uid: pid -> argument parts."""
        found = {}
        entries = []
        try:
            for entry in (LOGIN_ROOT / "proc").iterdir():
                # Bounded: a process table larger than this is not read at all.
                require(len(entries) < 65536, "login_processes")
                entries.append(entry)
        except OSError:
            return found
        for entry in entries:
            if not entry.name.isdigit():
                continue
            status = login_read(entry / "status")
            if status is None:
                continue
            real = None
            for line in status.splitlines():
                if line.startswith(b"Uid:"):
                    fields = line.split()
                    if len(fields) > 1 and fields[1].isdigit():
                        real = int(fields[1])
                    break
            if real != uid:
                continue
            raw = login_read(entry / "cmdline")
            if raw is None:
                continue
            found[entry.name] = [part.decode("utf-8", "replace") for part in raw.split(b"\0") if part]
        return found


    def login_app_names(argv):
        """The first-setup process evidence one argument list carries.

        chairlift is never counted from a process: only its own journal line is
        evidence that it presented a window (see login_observe).
        """
        names = set()
        base = [os.path.basename(part) for part in argv]
        if "snow-first-setup" in base:
            names.add("first-setup")
        return names


    def login_presented(uid):
        """True when this boot's user journal shows a chairlift first-run window."""
        rc, out = login_run(["journalctl", "-b", "-q", "--no-pager", "-o", "cat",
                             "_UID=" + str(uid), "-n", "2000"], 120)
        return rc == 0 and LOGIN_PRESENTED in out


    def login_observe(uid, app_wait):
        """Which known apps ran during the full window, and how long it watched."""
        start = time.monotonic()
        end = start + app_wait
        started, previous = set(), set()
        while True:
            current = {(pid, app) for pid, argv in login_processes(uid).items()
                       for app in login_app_names(argv)}
            # A first-run gate that starts and exits at once must not count as a
            # started app: the same pid has to show it in two consecutive polls.
            started.update({app for _, app in current & previous})
            previous = current
            # Both login boots watch the whole window: a second app can start
            # long after the first, and mark-done runs only after the window.
            if time.monotonic() >= end:
                break
            time.sleep(LOGIN_POLL)
        if login_presented(uid):
            started.add("chairlift")
        return sorted(started), int(time.monotonic() - start)


    def login_mark_done(app, uid, home):
        """Mark one started app done as the QA user; its status is evidence only."""
        environment = ["env", "-i", "HOME=" + home, "USER=" + LOGIN_USER,
                       "LOGNAME=" + LOGIN_USER, "PATH=/usr/bin:/bin",
                       "XDG_RUNTIME_DIR=/run/user/" + str(uid)]
        rc, _ = login_run(["runuser", "-u", LOGIN_USER, "--"] + environment + LOGIN_MARK_DONE[app], 60)
        return rc


    def login(credentials):
        """One first-login record: display manager, session, apps, markers."""
        creds = Path(credentials)

        def credential(name):
            value = (creds / name).read_text().strip()
            require(len(value) <= 256, "credential")
            return value

        phase, nonce = credential("phase"), credential("nonce")
        require(phase in LOGIN_PHASES and nonce_valid(nonce), "credential")
        m = load(GUEST_MANIFEST, frozen=True)
        require("first_login_probe" in m, "login_manifest")
        probe = m["first_login_probe"]
        for key in ("image_n", "image_n_plus_1", "target_ref"):
            require(credential(key) == m[key], "credential")
        boot_id = GUEST_PATHS["boot_id"].read_text().strip()
        require(boot_id_valid(boot_id), "boot_identity")
        # status_fields validates the bootc status shape; only the booted digest is
        # recorded here, and the host compares it with image_n.
        _, _, booted_digest, _, _, _ = status_fields(guest_status())
        display_manager = login_display_manager()
        account = login_account()
        # The account's own home: an unusable one is no account home, and then no
        # user folder is scanned and both markers are false.
        home = login_home(account)
        session, started, waited, mark_done = None, [], 0, []
        if display_manager is not None and account is not None:
            session = login_session(probe["session_wait"])
            if session is not None:
                started, waited = login_observe(account.pw_uid, probe["app_wait"])
                if phase == "login-1" and home is not None:
                    # Only login-1 marks an app done: login-2 must see the app's
                    # own second first-run behavior, not a marker this probe wrote.
                    mark_done = [{"app": app, "rc": login_mark_done(app, account.pw_uid, home)}
                                 for app in started]
        # The markers are read after the mark-done commands, so a false marker is
        # the app's own state and not a missing write of this probe.
        record = dict(phase=phase, nonce=nonce, boot_id=boot_id, booted_digest=booted_digest,
                      display_manager=display_manager,
                      autologin=login_autologin(display_manager) if display_manager else False,
                      session=session, entries=login_entries(home), apps=login_apps(),
                      started=started, mark_done=mark_done,
                      markers={app: home is not None and login_exists(home.rstrip("/") + LOGIN_MARKERS[app])
                               for app in LOGIN_APPS},
                      waited=waited)
        require(set(record) == LOGIN_RECORD_FIELDS, "record_fields")
        encoded = base64.urlsafe_b64encode(canonical(record).strip()).decode().rstrip("=")
        require(len(encoded) <= LOGIN_TOKEN_MAX, "record_size")
        return "SNOW_LOGIN_V1 " + encoded


    # The problems probe (plan T857 phase 1): it proves on a real installed VM that
    # the snosi-health collector (snosi ADR-0029) records 4 local problems and that
    # systemd-coredump feeds it a crash. It writes 1 test-only unit into the
    # installed /etc, blocks the network for 1 stager run, kills 1 child and sends 1
    # journal datagram. Every value is evidence only: no field fails the run.
    def problems_path(path):
        return PROBLEMS_ROOT / str(path).lstrip("/")


    def problems_read(path, limit=65536):
        try:
            target = problems_path(path)
            require(not target.is_symlink(), "problems_read")
            with target.open("rb") as stream:
                return stream.read(limit)
        except (OSError, GateError):
            return None


    def problems_run(args, timeout=120):
        try:
            result = subprocess.run(args, capture_output=True, timeout=timeout, check=False)
        except (OSError, subprocess.SubprocessError):
            return -1, b""
        return result.returncode, (result.stdout or b"")[:PROBLEMS_OUTPUT_MAX]


    def problems_show(args, timeout=60):
        return problems_run(args, timeout)[1].decode("utf-8", "replace")


    def problems_token(text):
        text = text.strip()
        return text if full(r"[a-z0-9_.-]{1,32}", text) else "other"


    def problems_ms(out):
        values = {}
        for line in out.splitlines()[:32]:
            key, separator, value = line.partition("=")
            if separator and value.isdigit():
                values[key] = int(value)
        return values


    def problems_boot():
        target = problems_show(["systemctl", "get-default"]).strip()
        if not full(r"[A-Za-z0-9@._-]{1,64}", target):
            return None
        end = time.monotonic() + 180
        while problems_show(["systemctl", "is-active", target]).strip() != "active":
            if time.monotonic() >= end:
                return None
            time.sleep(5)
        try:
            # The 4 manager stamps and the target's own active-enter stamp are 2
            # different objects: `systemctl show <unit>` reports the unit's.
            values = problems_ms(problems_show(
                ["systemctl", "show", "-p", "FirmwareTimestampMonotonic", "-p", "LoaderTimestampMonotonic",
                 "-p", "InitRDTimestampMonotonic", "-p", "UserspaceTimestampMonotonic"]))
            t = problems_ms(problems_show(
                ["systemctl", "show", "-p", "ActiveEnterTimestampMonotonic", target]))["ActiveEnterTimestampMonotonic"]
            n, i, u = (values["LoaderTimestampMonotonic"], values.get("InitRDTimestampMonotonic", 0),
                       values["UserspaceTimestampMonotonic"])
            boot = {"target": target, "firmware_ms": max(0, values.get("FirmwareTimestampMonotonic", 0) - n) // 1000,
                    "loader_ms": n // 1000, "kernel_ms": (i or u) // 1000,
                    "initrd_ms": (u - i) // 1000 if i else 0, "userspace_ms": (t - u) // 1000,
                    "target_ms": t // 1000}
        except (KeyError, ValueError, TypeError):
            return None
        return boot if all(0 <= boot[key] <= 3600000 for key in boot if key != "target") else None


    def problems_journal(query, end):
        while True:
            rc, out = problems_run(["journalctl", "--system", "-q", "-o", "json"] + query, 120)
            if rc == 0 and out.strip():
                return True
            if time.monotonic() >= end:
                return False
            time.sleep(3)


    def problems_crash():
        try:
            child = subprocess.Popen(["/usr/bin/sleep", "600"],
                                     preexec_fn=lambda: resource.setrlimit(resource.RLIMIT_CORE, (-1, -1)))
            time.sleep(1)
            os.kill(child.pid, signal.SIGSEGV)
            child.wait(timeout=60)
        except (OSError, subprocess.SubprocessError):
            return False
        return problems_journal(["MESSAGE_ID=" + PROBLEMS_CRASH_ID, "COREDUMP_PID=%d" % child.pid],
                                time.monotonic() + 90)


    def problems_app():
        fields = dict(PROBLEMS_APP_FIELDS, MESSAGE="snow-qa: injected app problem (T857 t7)",
                      PRIORITY="3", MESSAGE_ID=PROBLEMS_APP_ID)
        try:
            with socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM) as stream:
                stream.connect("/run/systemd/journal/socket")
                stream.send("".join("%s=%s\n" % item for item in fields.items()).encode())
        except OSError:
            return False
        return problems_journal(["MESSAGE_ID=" + PROBLEMS_APP_ID,
                                 "FROSTYARD_CODE=" + PROBLEMS_APP_FIELDS["FROSTYARD_CODE"]], time.monotonic() + 30)


    def problems_inject():
        """The 4 local injections: a unit, a blocked stager run, a crash, an app problem."""
        unit = problems_path("etc/systemd/system/" + PROBLEMS_UNIT)
        try:
            unit.parent.mkdir(parents=True, exist_ok=True)
            unit.write_text(PROBLEMS_UNIT_BODY)
            unit.chmod(0o644)
        except OSError:
            pass
        problems_run(["systemctl", "daemon-reload"], 120)
        # A failed start is this unit's expected result.
        problems_run(["systemctl", "start", PROBLEMS_UNIT], 120)
        injected = {"unit": problems_show(["systemctl", "is-failed", PROBLEMS_UNIT]).strip() == "failed"}
        # A new network namespace with no route blocks the network for this command only.
        problems_run(["unshare", "--net", "--", "/usr/libexec/bootc-update-stage"], 300)
        check = (problems_read("run/snosi/update-check", 4096) or b"").decode("utf-8", "replace")
        found = dict(line.partition("=")[::2] for line in check.splitlines()[:16])
        injected["stage"] = {"outcome": problems_token(found.get("outcome", "")),
                             "error_class": problems_token(found["error_class"]) if "error_class" in found else None}
        injected["crash"] = problems_crash()
        injected["app"] = problems_app()
        return injected


    def problems_doc(raw):
        # None: too large to judge (a cut read included); "invalid": not JSON.
        if len(raw) > 65536:
            return None
        try:
            data = json.loads(raw, object_pairs_hook=pairs,
                              parse_constant=lambda _: (_ for _ in ()).throw(GateError("json_value")))
            # A JSON null is content, not a size verdict.
            return "invalid" if data is None else data if len(canonical(data)) <= 6500 else None
        except (ValueError, UnicodeError, GateError):
            return "invalid"


    def problems_local(raw):
        try:
            records = json.loads(raw, object_pairs_hook=pairs)["problems"]
            for ident in sorted(records)[:200]:
                entry = records[ident]
                extra = entry.get("extra") if type(entry) is dict else None
                units = extra.get("units") if type(extra) is dict else None
                if type(units) is list and PROBLEMS_UNIT in units and full(r"[0-9a-f]{16}", ident):
                    return ident
        except (ValueError, UnicodeError, KeyError, TypeError, AttributeError, GateError):
            return None
        return None


    def problems_files():
        found = [None, None]
        for index, name in enumerate(("problems", "details")):
            target = problems_path("var/lib/snosi-health/" + name + ".json")
            if not (target.is_file() and not target.is_symlink()):
                continue
            try:
                info = target.stat()
                with target.open("rb") as stream:
                    raw = stream.read(65537)
            except OSError:
                continue
            entry = {"mode": format(info.st_mode & 0o7777, "04o"), "uid": info.st_uid}
            if name == "problems":
                entry.update(gid=info.st_gid, size=info.st_size, doc=problems_doc(raw),
                             leak=b"snow-qa-problem-local" in raw)
            else:
                try:
                    entry["group"] = problems_token(grp.getgrgid(info.st_gid).gr_name)
                except KeyError:
                    entry["group"] = "other"
                entry["local_unit_id"] = problems_local(raw)
            found[index] = entry
        return found[0], found[1]


    def problems(credentials):
        """One problems-probe record: the injected problems and what the collector kept."""
        creds = Path(credentials)

        def credential(name):
            value = (creds / name).read_text().strip()
            require(len(value) <= 256, "credential")
            return value

        phase, nonce = credential("phase"), credential("nonce")
        require(phase in PROBLEMS_PHASES and nonce_valid(nonce), "credential")
        m = load(GUEST_MANIFEST, frozen=True)
        require("problems_probe" in m, "problems_manifest")
        for key in ("image_n", "image_n_plus_1", "target_ref"):
            require(credential(key) == m[key], "credential")
        boot_id = GUEST_PATHS["boot_id"].read_text().strip()
        require(boot_id_valid(boot_id), "boot_identity")
        # status_fields validates the bootc status shape; the host compares the booted
        # digest with the image of the probed path.
        _, _, booted_digest, _, _, _ = status_fields(guest_status())
        boot = problems_boot()
        collector = problems_read("usr/bin/snosi-health", 1) is not None
        journal = problems_path("var/log/journal")
        pattern = problems_read("proc/sys/kernel/core_pattern", 256)
        coredump = any(entry.pw_name == "systemd-coredump" for entry in pwd.getpwall())
        timer = {name: problems_token(problems_show(["systemctl", "is-" + name, "snosi-health.timer"]))
                 for name in ("enabled", "active")}
        preset = problems_show(["systemctl", "show", "-p", "Result", "preset-reconcile.service"])
        injected = runs = document = details = listing = None
        if collector:
            # Two collector runs, one after the other: the timer can start one during
            # the injections, and the second start is always a full run after them.
            injected = problems_inject()
            runs = [problems_run(["systemctl", "start", "snosi-health.service"], 400)[0] for _ in (1, 2)]
            document, details = problems_files()
            # `--list` as an unprivileged user: each expected summary line is evidence.
            rc, out = problems_run(["runuser", "-u", "nobody", "--", "/usr/bin/snosi-health", "--list"], 60)
            text = out.decode("utf-8", "replace")
            listing = dict({"rc": rc}, **{name: line in text for name, line in PROBLEMS_LISTINGS.items()})
        record = dict(phase=phase, nonce=nonce, boot_id=boot_id, booted_digest=booted_digest,
                      path=m["problems_probe"]["path"], boot=boot, collector=collector, timer=timer,
                      preset_reconcile=problems_token(preset.partition("=")[2]),
                      coredump_user=coredump, journal_dir=journal.is_dir() and not journal.is_symlink(),
                      core_pattern=pattern is not None and pattern.startswith(PROBLEMS_CORE_PATTERNS),
                      injected=injected, collector_runs=runs, problems=document, details=details,
                      listing=listing)
        require(set(record) == PROBLEMS_RECORD_FIELDS, "record_fields")
        encoded = base64.urlsafe_b64encode(canonical(record).strip()).decode().rstrip("=")
        require(len(encoded) <= PROBLEMS_TOKEN_MAX, "record_size")
        return "SNOW_PROBLEMS_V1 " + encoded


    # On Snow, Snowfield and Sundog, /dev/console is tty0 (graphical); Snowfield
    # uses the GNOME desktop with the linux-surface kernel. On Floe (headless, no graphical
    # stack) it can be ttyS0 itself, so the guest then writes the same line twice
    # to ttyS0 and the host, which treats identical copies as one record, is
    # unaffected. The host reads ttyS0 and joins kmsg records under ADR-0014
    # (run-snow-bootc-lifecycle-2tnjh: the installed N booted, but its record
    # never reached the serial log). serial-getty@ttyS0 runs vhangup and may
    # flush output during its TTY setup, so the line is written to a fresh
    # ttyS0 handle now and again once agetty runs (as the Firn lane does,
    # frostyard/snosi#1123). The host treats identical copies as one line.
    GUEST_CONSOLES = ("/dev/ttyS0", "/dev/console")
    # lab#177: a stalled ttyS0 blocked the unbounded write, so the unit never
    # reached its poweroff and the host waited out the whole phase window. Now
    # every target write is a bounded child, and a target that had to be killed
    # is skipped for the rest of this process (ADR-0014).
    TTY_WRITE_TIMEOUT = 5
    TTY_KILL_GRACE = 2
    STALLED_TARGETS = set()
    # A kernel-log copy of the record (ADR-0013) needs bounded chunk lines: one
    # kmsg record holds about 1 KiB and a record can reach 8 KiB (12 KiB for
    # sysext), so the line travels as numbered chunks that the host joins.
    GUEST_KMSG = "/dev/kmsg"
    KMSG_CHUNK = 384
    KMSG_MAX_CHUNKS = 64


    def kmsg_lines(line):
        """The kernel-log chunk lines of one marker line."""
        # The id binds the whole line, so chunks of 2 different lines never join.
        raw = line.encode()
        ident = hashlib.sha256(raw).hexdigest()[:16]
        # base64url, no padding: no chunk line may contain a marker name, or the
        # runner's "$needle" greps would match a half-received record before the
        # host can join it (lab#177).
        encoded = base64.urlsafe_b64encode(raw).decode().rstrip("=")
        chunks = [encoded[index:index + KMSG_CHUNK] for index in range(0, len(encoded), KMSG_CHUNK)]
        # A line over the bound keeps its id but cannot join: fail closed.
        chunks = chunks[:KMSG_MAX_CHUNKS] or [""]
        return ["SNOW_QA_KMSG1 %s %d/%d %s %s" %
                (ident, index, len(chunks), hashlib.sha256(chunk.encode()).hexdigest()[:8], chunk)
                for index, chunk in enumerate(chunks, 1)]


    def emit_kmsg(line):
        # A fresh open per line: devkmsg rate-limits per open (ADR-0013).
        for chunk in kmsg_lines(line):
            try:
                handle = os.open(GUEST_KMSG, os.O_WRONLY | os.O_APPEND)
            except OSError:
                continue
            try:
                os.write(handle, b"<4>" + chunk.encode() + b"\n")
            except OSError:
                pass
            finally:
                try:
                    os.close(handle)
                except OSError:
                    pass


    def emit(line, deadline=None):
        # The kernel-log copy comes first: it survives a stalled ttyS0.
        emit_kmsg(line)
        for target in GUEST_CONSOLES:
            if target in STALLED_TARGETS:
                continue
            limit = TTY_WRITE_TIMEOUT
            if deadline is not None:
                # Keep the whole child, write and kill grace, inside the
                # deadline: a slow write may not push the replay past it.
                limit = min(TTY_WRITE_TIMEOUT, int(deadline - time.monotonic()) - TTY_KILL_GRACE)
                if limit < 1:
                    continue   # out of time: skip, but do not condemn the target
            try:
                # Start on a new line: the getty prompt has no trailing newline.
                result = subprocess.run(
                    ["timeout", "-k", str(TTY_KILL_GRACE), str(limit), "/bin/sh", "-c",
                     'printf "\\n%s\\n" "$1" >> "$2"', "sh", line, target],
                    stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                    check=False)
            except OSError:
                continue
            if result.returncode in (124, 137):
                STALLED_TARGETS.add(target)


    def serial_getty_ready(timeout=10):
        try:
            pid = subprocess.run(["systemctl", "show", "-p", "MainPID", "--value", "serial-getty@ttyS0.service"],
                                 capture_output=True, timeout=timeout, check=False).stdout.strip()
            return pid.isdigit() and pid != b"0" and Path("/proc", pid.decode(), "comm").read_text().strip() == "agetty"
        except (OSError, subprocess.SubprocessError, ValueError):
            return False


    # The whole replay runs against 1 deadline inside PUBLISH_MARGIN: the wait,
    # the hold, and every console write, which is cut short or skipped rather
    # than allowed to cross it. PUBLISH_RESERVE is left for the last getty
    # query and the poweroff request. The guest unit's TimeoutStartSec adds
    # PUBLISH_MARGIN seconds beyond the phase budget, so the replay never eats
    # the probes' own margin: PUBLISH_WAIT + PUBLISH_HOLD + PUBLISH_RESERVE <=
    # PUBLISH_MARGIN.
    PUBLISH_WAIT = 80
    # Incus keeps console output only when the host reads it (every 5 s); a
    # VM that powers off right after its record loses it
    # (run-snow-bootc-lifecycle-5g2w5: guest-shutdown 1 s after the record).
    # Hold the line, repeated, for several host polls before returning.
    PUBLISH_HOLD = 30
    PUBLISH_MARGIN = 150
    PUBLISH_RESERVE = 20


    def publish(line, wait=None, hold=None):
        start = time.monotonic()
        final = start + PUBLISH_MARGIN - PUBLISH_RESERVE
        wait = PUBLISH_WAIT if wait is None else wait
        hold = PUBLISH_HOLD if hold is None else hold
        emit(line, deadline=final)
        deadline = min(start + wait, final)
        while True:
            remaining = deadline - time.monotonic()
            if remaining <= 0 or serial_getty_ready(timeout=max(1, min(10, remaining))):
                break
            time.sleep(max(0, min(2, deadline - time.monotonic())))
        emit(line, deadline=final)
        held = min(time.monotonic() + hold, final)
        while time.monotonic() < held:
            time.sleep(max(0, min(10, held - time.monotonic())))
            emit(line, deadline=final)


    def main(argv):
        try:
            require(len(argv) in (2, 3, 4, 7, 8), "usage")
            if argv[0] == "validate" and len(argv) == 3:
                m = load(argv[1])
                save(argv[2], m)
                print(sha(canonical(m)))
            elif argv[0] == "preflight" and len(argv) == 3:
                preflight(load(argv[1], frozen=True), argv[2])
            elif argv[0] == "tag" and len(argv) == 4:
                tag(load(argv[1], frozen=True), argv[2], argv[3])
            elif argv[0] == "phase" and len(argv) == 7:
                attested = phase_attest(load(argv[1], frozen=True), argv[2], argv[3], argv[4], argv[5], argv[6])
                print(attested["boot_id"])
                print("fsverity_errors=" + str(attested["fsverity_errors"]))
                print("kernel=" + attested["kernel"])
                print("lockdown=%s cmdline_lockdown=%s" %
                      (attested["lockdown_mode"],
                       attested["cmdline_lockdown"] if attested["cmdline_lockdown"] is not None else "absent"))
                print("cmdline=" + " ".join(attested["cmdline"]))
                # lab#174: the kept lines follow as plain text, for the runner's
                # fsverity.txt. They are not part of the record's verdict.
                for index, entry in enumerate(attested["fsverity_lines"], 1):
                    print("seq=%d device=%s inode=%d pos=%d level=%d" % (index, *entry))
            elif argv[0] == "guest" and len(argv) == 2:
                # The one-line record is emitted only after all probes and actions succeed.
                publish(guest(argv[1]))
            elif argv[0] == "sysext" and len(argv) == 2:
                # Failures travel inside the record; only a fatal gate error
                # uses the sysext error marker.
                publish(sysext(argv[1]))
            elif argv[0] == "sysext-phase" and len(argv) in (7, 8):
                sysext_phase_attest(load(argv[1], frozen=True), argv[2], argv[3], argv[4],
                                    argv[5], argv[6], argv[7] if len(argv) == 8 else None)
            elif argv[0] == "login" and len(argv) == 2:
                # Failures travel inside the record; only a fatal gate error uses
                # the login error marker.
                publish(login(argv[1]))
            elif argv[0] == "login-phase" and len(argv) == 7:
                login_phase_attest(load(argv[1], frozen=True), argv[2], argv[3], argv[4],
                                   argv[5], argv[6])
            elif argv[0] == "login-report" and len(argv) in (3, 4):
                login_report(load(argv[1], frozen=True), argv[2], argv[3] if len(argv) == 4 else None)
            elif argv[0] == "problems" and len(argv) == 2:
                # Failures travel inside the record; only a fatal gate error uses the
                # problems error marker.
                publish(problems(argv[1]))
            elif argv[0] == "report" and len(argv) == 2:
                # The report guest code is too large for this file: it travels in its
                # own credential and runs here with this module as its `qa`. A missing
                # or corrupt credential is a bounded gate error, never a traceback.
                scope = {"__name__": "snow_report", "qa": sys.modules[__name__]}
                try:
                    code = compile(lzma.decompress(Path(REPORT_CODE).read_bytes()), "report-guest.py", "exec")
                except (OSError, ValueError, EOFError, lzma.LZMAError) as exc:
                    raise GateError("report_code") from exc
                exec(code, scope)
                return scope["main"](argv[1])
            elif argv[0] == "kmsg-join" and len(argv) == 2:
                # lab#177: after the serial slice is written, before any parser.
                kmsg_join(argv[1])
            else:
                raise GateError("usage")
            return 0
        except (GateError, OSError, TypeError, KeyError, ValueError) as exc:
            code = str(exc) if isinstance(exc, GateError) and full(r"[a-z_]{1,40}", str(exc)) else "io_error"
            error_markers = {"guest": "SNOW_QA_ERR ", "sysext": "SNOW_SYSEXT_ERR ", "login": "SNOW_LOGIN_ERR ",
                             "problems": "SNOW_PROBLEMS_ERR ", "report": "SNOW_REPORT_ERR "}
            if argv[:1] in (["guest"], ["sysext"], ["login"], ["problems"], ["report"]) and isinstance(exc, GateError) and code != "io_error":
                # An observed fixed-code failure is distinct from an absent
                # channel. Never print arbitrary tool stderr or credentials.
                publish(error_markers[argv[0]] + code)
            print("qa_failed:" + code, file=sys.stderr)
            return 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:]))
