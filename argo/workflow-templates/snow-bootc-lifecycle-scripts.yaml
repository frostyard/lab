    import sys
    from pathlib import Path

    path = Path(sys.argv[1])
    raw = path.read_bytes()
    if len(raw) > 65536:
        sys.exit(1)
    kept, inside = [], False
    for line in raw.decode("utf-8", "replace").splitlines():
        text = line.strip()
        if text.startswith("[") and text.endswith("]"):
