        fail problems_report
      fi
      problems_line=$(sed -n '1p' "$WORK/problems-report")
      problems_summary=${problems_line#problems=}
      [[ "$problems_line" == "problems=$problems_summary" && "$problems_summary" =~ ^[a-z0-9+-]{1,96}$ ]] || fail problems_report
      cp -- "$WORK/problems-report" "$OUT/problems.txt" || fail problems_report
      persist "$OUT/problems.txt" "$EVIDENCE/problems.txt" || fail evidence_write
      printf 'problems=%s\n' "$problems_summary" >> "$OUT/checks.txt"
      persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
