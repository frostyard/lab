        if inside and text and not text.startswith("#") and separator \
                and key.strip() in ("User", "Session", "Relogin"):
            kept.append("# snow-qa: " + line)
            continue
        kept.append(line)
    path.write_bytes(("\n".join(kept) + "\n").encode())
    PY
        fi
        ;;
    esac

    install -d -m 0700 "$root/var/lib/snow-qa"
    {
      printf 'dm=%s\n' "$kind"
      printf 'user=%s\n' "$user"
      printf 'session=%s\n' "$session"
    } > "$state"
