      if [[ -s "$WORK/login-2.json" ]]; then login_records+=("$WORK/login-2.json"); fi
      if ! python3 /opt/snow-qa/qa.py login-report "$WORK/normalized.json" "${login_records[@]}" > "$WORK/first-login" 2>/dev/null; then
        fail login_report
      fi
      login_line=$(sed -n '1p' "$WORK/first-login")
      login_summary=${login_line#first_login=}
      [[ "$login_line" == "first_login=$login_summary" && "$login_summary" =~ ^[a-z0-9+-]{1,64}$ ]] || fail login_report
      cp -- "$WORK/first-login" "$OUT/first-login.txt" || fail login_report
      persist "$OUT/first-login.txt" "$EVIDENCE/first-login.txt" || fail evidence_write
      printf 'first_login=%s\n' "$login_summary" >> "$OUT/checks.txt"
      persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
