    """Guest side of the report probe (plan T857 phase 2, Floe).

    It proves on a real installed Floe VM that the snosi problem-report sender
    (snosi ADR-0030) sends nothing while reporting is off and, when it is on, sends
    the injected problem and 1 weekly count to a lab intake. qa.py starts this
    program from its own credential and publishes the one record it returns.
    """
    import base64
    import json
    import re
    import sys
    import time
    import urllib.error
    import urllib.request
    from pathlib import Path

    # The record this probe publishes: fixed keys, every value bounded by report.py.
    REPORT_RECORD_FIELDS = set("phase nonce boot_id booted_digest sender intake injected off consent timer sent dry production".split())
    SENDER = "/usr/libexec/snosi-health-report"
    CONF_DIR = "/etc/snosi-health"
    CONF = "/etc/snosi-health/reporting.conf"
    SENT = "/var/lib/snosi-health/sent.jsonl"
    # The 1 document of the production path, written for curl's --data-binary.
    BODY = "/run/snow-report.json"
    INTAKE_CREDENTIAL = "/run/credentials/@system/snow-intake"
    # The lab intake is reachable only on its container's own address, never a name.
    INTAKE_URL = re.compile(r"http://[0-9]{1,3}(?:\.[0-9]{1,3}){3}:8787")
    PRODUCTION_URL = "https://report.frostyard.org/v1/report"
    HEALTH_URL = "/usr/bin/snosi-health"
    REPORT_UNIT = "snosi-health-report.service"
    REPORT_TIMER = "snosi-health-report.timer"
    # Bounds: the record travels as 1 marker line, so every list and string is small.
    SENT_MAX = 32
    DRY_MAX = 32
    STATUS_MAX = 160
    SENT_FILE_MAX = 256 * 1024
    DOCUMENT_MAX = 64
    TRIGGER_TIMEOUT = 300
    TRIGGER_POLL = 5
    OFF = "problem reporting is off"
    TOKEN = re.compile(r"[a-z0-9_.-]{1,32}")
    UUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}")


    def token(value):
        """One bounded lowercase token from text the guest read."""
        text = value.strip() if type(value) is str else ""
        return text if TOKEN.fullmatch(text) else "other"


    def read(path, limit=65536):
        """The bytes of one guest file, or None."""
        try:
            target = Path(path)
            if target.is_symlink():
                return None
            with target.open("rb") as stream:
                return stream.read(limit)
        except OSError:
            return None


    def text(path, limit=65536):
        raw = read(path, limit)
        return None if raw is None else raw.decode("utf-8", "replace")


    def post(url, timeout=30):
        """(status, body) of one POST; 0 when the request could not be made."""
        request = urllib.request.Request(url, data=b"", method="POST")
        try:
            with urllib.request.urlopen(request, timeout=timeout) as response:
                return response.status, response.read(65536)
        except urllib.error.HTTPError as exc:
            return exc.code, b""
        except (urllib.error.URLError, OSError, ValueError):
            return 0, b""


    def mark(url, name):
        """One lab mark; its status, or 0 when the intake could not be reached."""
        return post(url + "/lab/mark/" + name, timeout=10)[0]


    def intake_url():
        """The intake URL of this run's credential; refuted shapes never travel on."""
        value = Path(INTAKE_CREDENTIAL).read_text().strip()
        qa.require(len(value) <= 64 and INTAKE_URL.fullmatch(value) is not None,
                   "intake_credential")
        return value


    def dry_run():
        """The kinds of the documents `snosi-health send --dry-run` would send."""
        rc, out = qa.problems_run([HEALTH_URL, "send", "--dry-run"], 120)
        kinds = []
        for line in out.decode("utf-8", "replace").splitlines()[:DRY_MAX]:
            try:
                document = json.loads(line)
            except (ValueError, UnicodeError):
                continue
            kind = document.get("kind") if type(document) is dict else None
            kinds.append(token(kind))
        return rc, kinds


    def sent_entries():
        """The sender's own log: 1 bounded entry per report it tried to send."""
        raw = read(SENT, SENT_FILE_MAX + 1)
        if raw is None or len(raw) > SENT_FILE_MAX:
            # A missing log is no report; a cut read is never parsed into one.
            return []
        entries = []
        for line in raw.decode("utf-8", "replace").splitlines()[:SENT_MAX]:
            try:
                entry = json.loads(line)
            except (ValueError, UnicodeError):
                continue
            if type(entry) is not dict:
                continue
            report = entry.get("report")
            report = report if type(report) is dict else {}
            status = entry.get("http_status")
            problem = entry.get("problem_id")
            report_id = report.get("report_id")
            entries.append({"status": token(entry.get("status")),
                            "http_status": status if type(status) is int and 0 <= status <= 599 else 0,
                            "problem_id": problem if type(problem) is str and re.fullmatch(r"[0-9a-f]{16}", problem) else None,
                            "kind": token(report.get("kind")),
                            "report_id": report_id if type(report_id) is str and UUID.fullmatch(report_id) else None})
        return entries


    def append_endpoint(endpoint):
        """The administrator's edit: the endpoint is a key of the reporting file."""
        try:
            with Path(CONF).open("a", encoding="utf-8") as stream:
                stream.write("endpoint=" + endpoint + "\n")
            return True
        except OSError:
            return False


    def reporting_file():
        body = text(CONF) or ""
        lines = [line.strip() for line in body.splitlines()]
        endpoints = [line.split("=", 1)[1].strip() for line in lines
                     if line.startswith("endpoint=") and "=" in line]
        return lines, endpoints


    def off_checks(endpoint):
        """The checks of the off state, in the order the probe makes them."""
