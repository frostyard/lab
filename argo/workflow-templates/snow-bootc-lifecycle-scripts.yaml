apiVersion: v1
kind: ConfigMap
metadata:
  name: snow-bootc-lifecycle-scripts
  namespace: argo
data:
  run.sh: |
    #!/bin/bash
    # Advisory only. Persist bounded redacted diagnostics and optional VM cleanup
    # instructions; never raw serial, recovery material or NVRAM. Host evidence must be private.
    set -Eeuo pipefail
    umask 077
    ROOT=/var/lib/snosi-lab/snow-bootc-evidence
    OUT=/tmp/results
    VM=""
    INITIALIZED=0
    INSTALLER_ATTACHED=0
    STATE=FAILED
    REASON=setup
    mkdir -p "$OUT"
    # Atomically replace and sync both file and containing directory.
    persist() {
      local source="$1" dest="$2"
      python3 - "$source" "$dest" <<'PY'
    import os, sys, tempfile
    from pathlib import Path
    source, dest = Path(sys.argv[1]), Path(sys.argv[2])
    with tempfile.NamedTemporaryFile(dir=dest.parent, prefix='.snow-', delete=False) as stream:
        temp = stream.name
        try:
            stream.write(source.read_bytes()); stream.flush(); os.fsync(stream.fileno())
            os.fchmod(stream.fileno(), 0o600)
        except BaseException:
            os.unlink(temp); raise
    os.replace(temp, dest)
    fd = os.open(dest.parent, os.O_RDONLY | os.O_DIRECTORY)
    try: os.fsync(fd)
    finally: os.close(fd)
    PY
    }
    finish() {
      local rc=$?
      local vm_kept_suffix=""
      local teardown_failed=0 failure_suffix=""
      trap - EXIT
      cleanup_error() {
        rc=1
        if [[ "$STATE" == PASS ]]; then
          STATE=FAILED; REASON="$1"
        elif [[ "$STATE" == BLOCKED ]]; then
          REASON="cleanup_after_blocked:${REASON};$1"; STATE=FAILED
        elif [[ "$REASON" != *";$1"* ]]; then
          STATE=FAILED; REASON="${REASON};$1"
        fi
      }
      local summary_source="$OUT/result-summary.txt" serial_copy="" before_teardown
      # Establish the verdict while the VM is still available to keep on failure.
      if [[ "$INITIALIZED" == 1 ]]; then
        # Capture final console lines before deleting the instance; preserve the
        # previous snapshot if this best-effort read fails.
        if [[ -n "${WORK:-}" ]]; then capture_serial || true; fi
      fi
      if [[ $rc -eq 0 && "$STATE" != PASS ]]; then rc=1; fi
      if [[ $rc -ne 0 && "$STATE" == PASS ]]; then STATE=FAILED; REASON=cleanup; fi
      if ! printf '%s: %s\n' "$STATE" "$REASON" > "$summary_source"; then
        rc=1; STATE=FAILED; REASON=output_write
        summary_source=$(mktemp "${WORK:-/tmp}/snow-final.XXXXXXXX" 2>/dev/null) || summary_source=""
        if [[ -n "$summary_source" ]]; then printf 'FAILED: output_write\n' > "$summary_source" || true; fi
      fi
      if [[ -n "${EVIDENCE:-}" ]]; then
        persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || { rc=1; STATE=FAILED; REASON=evidence_write; }
        if [[ -n "$summary_source" ]]; then
          printf '%s: %s\n' "$STATE" "$REASON" > "$summary_source" || true
          persist "$summary_source" "$EVIDENCE/result-summary.txt" || { rc=1; STATE=FAILED; REASON=evidence_write; }
        fi
      fi
      if [[ -n "$summary_source" ]]; then printf '%s: %s\n' "$STATE" "$REASON" > "$summary_source" || true; fi
      if [[ -n "$summary_source" && "$summary_source" != "$OUT/result-summary.txt" ]]; then
        printf '%s: %s\n' "$STATE" "$REASON" > "$OUT/result-summary.txt" 2>/dev/null || true
      fi
      before_teardown="$STATE:$REASON"
      if [[ "$INITIALIZED" == 1 ]]; then
        if [[ "${KEEP_VM_ON_FAILURE:-false}" == true && "$STATE" != PASS ]]; then
          # A retained VM must not reference the ISO that is removed below.
          if [[ "$INSTALLER_ATTACHED" == 0 ]] || timeout 60 incus config device remove "$VM" installer >/dev/null 2>&1; then
            if { printf 'vm=%s\ncleanup: incus delete --force %s (owner: the run submitter)\n' "$VM" "$VM" > "$WORK/kept-vm.txt"; } 2>/dev/null; then
              persist "$WORK/kept-vm.txt" "$EVIDENCE/kept-vm.txt" || true
            fi
            vm_kept_suffix=";vm_kept=${VM}"
          else
            # Do not retain a VM whose installer device points at a removed ISO.
            timeout 90 incus delete --force "$VM" >/dev/null 2>&1 || { teardown_failed=1; cleanup_error teardown_failed; }
            vm_kept_suffix=";vm_kept_failed"
          fi
          REASON="${REASON}${vm_kept_suffix}"
        else
          timeout 90 incus delete --force "$VM" >/dev/null 2>&1 || { teardown_failed=1; cleanup_error teardown_failed; }
        fi
      fi
      if [[ "$teardown_failed" == 1 ]]; then
        # A VM left behind may still reference this ISO; keep both for manual cleanup.
        REASON="${REASON};vm_left=${VM}"
        failure_suffix=";teardown_failed${vm_kept_suffix};vm_left=${VM}"
      else
        failure_suffix="$vm_kept_suffix"
        if [[ -n "${ISO_HOST:-}" ]]; then
          rm -f -- "$ISO_HOST" || { cleanup_error cleanup_failed; failure_suffix=";cleanup_failed${failure_suffix}"; }
        fi
      fi
      # Later failures cannot un-delete a VM. Converge the summaries on the
      # verdict we actually have, including teardown and cleanup outcomes.
      if [[ "$before_teardown" != "$STATE:$REASON" ]]; then
        if [[ -n "$summary_source" ]]; then printf '%s: %s\n' "$STATE" "$REASON" > "$summary_source" || true; fi
        if [[ -n "${EVIDENCE:-}" && -n "$summary_source" ]]; then
          persist "$summary_source" "$EVIDENCE/result-summary.txt" || {
            rc=1; STATE=FAILED; REASON="evidence_write${failure_suffix}"
            printf 'FAILED: %s\n' "$REASON" > "$summary_source" || true
            persist "$summary_source" "$EVIDENCE/result-summary.txt" || true
          }
        fi
        if [[ -n "$summary_source" && "$summary_source" != "$OUT/result-summary.txt" ]]; then
          printf '%s: %s\n' "$STATE" "$REASON" > "$OUT/result-summary.txt" 2>/dev/null || true
        fi
      fi
      if [[ "$STATE" != PASS && -n "${WORK:-}" && -f "$WORK/serial-full" && -n "${EVIDENCE:-}" ]]; then
        if redact_serial; then
          persist "$WORK/serial-redacted.log" "$EVIDENCE/serial-redacted.log" || true
        fi
      fi
      # For a late PASS -> FAILED cleanup error, stage only redacted bytes outside WORK.
      if [[ "$STATE" == PASS && -n "${WORK:-}" && -f "$WORK/serial-full" && -n "${EVIDENCE:-}" ]]; then
        if redact_serial; then
          serial_copy=$(mktemp "$OUT/.snow-serial.XXXXXXXX") || true
          if [[ -n "$serial_copy" ]]; then cp -- "$WORK/serial-redacted.log" "$serial_copy" || { rm -f -- "$serial_copy" || true; serial_copy=""; }; fi
        fi
      fi
      if [[ -n "${WORK:-}" ]]; then
        if ! rm -rf -- "$WORK"; then
          cleanup_error cleanup_failed
          if [[ -n "$summary_source" ]]; then printf '%s: %s\n' "$STATE" "$REASON" > "$summary_source" || true; fi
          if [[ -n "${EVIDENCE:-}" && -n "$summary_source" ]]; then persist "$summary_source" "$EVIDENCE/result-summary.txt" || true; fi
          if [[ -n "$summary_source" && "$summary_source" != "$OUT/result-summary.txt" ]]; then
            printf '%s: %s\n' "$STATE" "$REASON" > "$OUT/result-summary.txt" 2>/dev/null || true
          fi
          if [[ -n "$serial_copy" && -n "${EVIDENCE:-}" ]]; then
            persist "$serial_copy" "$EVIDENCE/serial-redacted.log" || true
          fi
        fi
      fi
      if [[ -n "$serial_copy" ]]; then rm -f -- "$serial_copy" || true; fi
      if [[ -n "$summary_source" && "$summary_source" != "$OUT/result-summary.txt" ]]; then rm -f -- "$summary_source" || true; fi
      exit "$rc"
    }
    trap finish EXIT
    trap 'REASON=interrupted; exit 1' INT TERM HUP
    fail() { REASON="$1"; exit 1; }
    blocked() { STATE=BLOCKED; fail "$1"; }
    # Only the bounded GateError token may enter a summary; never expose stderr.
    qa_code() {
      python3 - "$1" <<'PY'
    import re, sys
    from pathlib import Path
    raw = Path(sys.argv[1]).open('rb').read(52)
    match = re.fullmatch(rb'qa_failed:([a-z_]{1,40})\n?', raw)
    print(match[1].decode('ascii') if match else 'unparsed')
    PY
    }
    # Reject arbitrary workflow names before using one as a path or VM name.
    [[ "${WORKFLOW_NAME:-}" =~ ^[a-z0-9][a-z0-9-]{0,50}$ ]] || fail workflow_name
    WORK=$(mktemp -d /tmp/snow-lifecycle.XXXXXXXX) || fail work_directory
    printf '%s\n' 'status=not-verified' > "$OUT/checks.txt"
    install -d -m 0700 "$ROOT" || fail evidence_directory
    [[ ! -L "$ROOT" && -d "$ROOT" ]] || fail evidence_directory
    chmod 0700 "$ROOT" || fail evidence_directory
    EVIDENCE="$ROOT/$WORKFLOW_NAME"
    [[ ! -e "$EVIDENCE" && ! -L "$EVIDENCE" ]] || fail evidence_exists
    install -d -m 0700 "$EVIDENCE" || fail evidence_directory
    VM="snow-qa-${WORKFLOW_NAME:0:39}"
    # Disposable Debian runner, never the host or extracted Firn binary.
    # Tools come from the distro-managed apt repository trust, not from
    # installer artifacts or an unpinned PyPI download. This is not proof of
    # tool provenance beyond the configured apt trust.
    # Bound provisioning independently; discard package-manager output because
    # untrusted repositories and URLs can embed arbitrary data in errors.
    export DEBIAN_FRONTEND=noninteractive
    timeout 900 apt-get update -qq >/dev/null 2>&1 || blocked packages_unavailable
    timeout 900 apt-get install -y -qq --no-install-recommends \
      ca-certificates python3 python3-virt-firmware \
      curl gnupg gpgv skopeo cosign mtools zstd cpio openssl \
      >/dev/null 2>&1 || blocked packages_unavailable
    # Extracted Firn is hashed in preflight; it runs only inside the installer VM.
    for tool in python3 curl gpg gpgv skopeo cosign mcopy zstd cpio incus \
                timeout base64 openssl virt-fw-vars sha256sum; do
      command -v "$tool" >/dev/null 2>&1 || blocked "tool_unavailable:$tool"
    done
    printf '%s' "${MANIFEST_JSON:-}" > "$WORK/input.json"
    unset MANIFEST_JSON
    if ! python3 /opt/snow-qa/qa.py validate "$WORK/input.json" "$WORK/normalized.json" > "$WORK/hash" 2> "$WORK/validate-error"; then
      code=$(qa_code "$WORK/validate-error") || code=unparsed
      fail "manifest_invalid:$code"
    fi
    persist "$WORK/hash" "$EVIDENCE/manifest-sha256.txt" || fail evidence_write
    if ! python3 /opt/snow-qa/qa.py preflight "$WORK/normalized.json" "$WORK/checks.json" > /dev/null 2> "$WORK/preflight-error"; then
      code=$(qa_code "$WORK/preflight-error") || code=unparsed
      case "$code" in
        trust_material_missing|download|iso_download|registry_inspect)
          blocked "publication_unavailable:$code";;
        firn_sandbox) blocked "environment_unavailable:$code";;
        *) fail "preflight_mismatch:$code";;
      esac
    fi
    persist "$WORK/checks.json" "$EVIDENCE/preflight.json" || fail evidence_write
    printf 'manifest_sha256=%s\n' "$(<"$WORK/hash")" > "$OUT/checks.txt"
    # Preflight's temporary authenticated ISO is intentionally removed there;
    # download this exact URL again and verify against the signed index hash.
    iso_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["iso_url"])' "$WORK/normalized.json") || fail manifest_read
    iso_hash=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["iso_sha256"])' "$WORK/normalized.json") || fail manifest_read
    install_timeout=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["timeouts"]["install"])' "$WORK/normalized.json") || fail manifest_read
    iso_candidate="/var/lib/snosi-lab/iso/snow-qa-${WORKFLOW_NAME}.iso"
    [[ ! -e "$iso_candidate" && ! -L "$iso_candidate" ]] || fail iso_path_exists
    ISO_HOST="$iso_candidate"
    timeout "$install_timeout" curl -fsSL --max-time "$install_timeout" -o "$ISO_HOST" "$iso_url" >/dev/null 2>&1 || blocked iso_unavailable
    chmod 0600 "$ISO_HOST" || fail iso_permissions
    iso_actual=$(sha256sum "$ISO_HOST") || fail iso_hash_read
    [[ "$iso_actual" == "$iso_hash "* ]] || fail iso_changed
    tag() {
      if ! python3 /opt/snow-qa/qa.py tag "$WORK/normalized.json" "$1" "$WORK/checks.json" >/dev/null 2> "$WORK/tag-error"; then
        local code
        code=$(qa_code "$WORK/tag-error") || code=unparsed
        fail "tag_mismatch:$code"
      fi
      persist "$WORK/checks.json" "$EVIDENCE/checks.json" || fail evidence_write
      python3 - "$WORK/checks.json" "$1" >> "$OUT/checks.txt" <<'PY' || fail checks_write
    import json, sys
    data = json.load(open(sys.argv[1]))
    print('tag=' + sys.argv[2] + ' timestamp=' + data['tags'][sys.argv[2]])
    PY
      persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
    }
    capture_serial() {
      # Byte-exact child file-size limit matches qa.py's <=1 MiB parser gate.
      # No unbounded console output is kept, persisted, or sent to pod logs.
      python3 - "$VM" "$WORK/serial-full" 2>/dev/null <<'PY'
    import os, resource, subprocess, sys
    from pathlib import Path
    target = Path(sys.argv[2])
    candidate = target.with_name('serial-candidate')
    try:
        def limit():
            resource.setrlimit(resource.RLIMIT_FSIZE, (1048576, 1048576))
        with candidate.open('wb') as snapshot:
            result = subprocess.run(['incus', 'console', sys.argv[1], '--show-log'],
                                    stdout=snapshot, stderr=subprocess.DEVNULL,
                                    timeout=30, check=False, preexec_fn=limit)
        if result.returncode or candidate.stat().st_size > 1048576:
            sys.exit(1)
        os.replace(candidate, target)
    except (OSError, subprocess.SubprocessError):
        sys.exit(1)
    finally:
        candidate.unlink(missing_ok=True)
    PY
    }
    redact_serial() {
      python3 - "$WORK/serial-full" "$WORK/serial-redacted.log" 2>/dev/null <<'PY'
    import os, re, sys
    from pathlib import Path
    raw = Path(sys.argv[1]).read_bytes()
    if len(raw) > 1048576:
        sys.exit(1)
    # Firn output never goes to the console; its only derived guest channel is
    # SNOW_INSTALL_DIAG. Elide that payload entirely, not merely its decoded
    # text: even a non-pattern recovery key must not survive as base64 here.
    raw = re.sub(rb'SNOW_INSTALL_DIAG [^\n]*', b'SNOW_INSTALL_DIAG [see install-diagnostic.txt]', raw)
    # Match the host install-diagnostic decoder's secret patterns. Strip CSI,
    # OSC and single-character ANSI escapes before removing residual controls.
    raw = re.sub(rb'\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)|[@-_])', b'', raw)
    raw = re.sub(rb'\r+\n|\r', b'\n', raw)
    raw = re.sub(rb'[\x00-\x08\x0b-\x1f\x7f-\x9f]', b'', raw)
    raw = re.sub(rb'SNOW_INSTALL_DIAG [^\n]*', b'SNOW_INSTALL_DIAG [see install-diagnostic.txt]', raw)
    raw = re.sub(rb'[0-9a-fA-F]{32,}|(?:[cbdefghijklnrtuv]{8}-){7}[cbdefghijklnrtuv]{8}', b'[REDACTED]', raw)
    if len(raw) > 1048576:
        sys.exit(1)
    with open(sys.argv[2], 'wb', opener=lambda path, flags: os.open(path, flags, 0o600)) as output:
        output.write(raw)
    PY
    }
    serial() {
      capture_serial || blocked serial_capture
      # The instance may retain prior boots' console lines. Compare the entire
      # bounded snapshot byte-for-byte with the pre-start baseline, and hand
      # only the newly appended region to the marker search and phase verifier.
      # A reset/truncation/changed prefix cannot establish boot lineage.
      python3 - "$WORK/serial-baseline" "$WORK/serial-full" "$WORK/serial" <<'PY' || blocked channel_lineage
    import sys
    from pathlib import Path
    baseline = Path(sys.argv[1]).read_bytes()
    snapshot = Path(sys.argv[2]).read_bytes()
    if not snapshot.startswith(baseline):
        sys.exit(1)
    Path(sys.argv[3]).write_bytes(snapshot[len(baseline):])
    PY
    }
    await() {
      local needle="$1" observed_failure="${3:-}" end=$((SECONDS + $2))
      while (( SECONDS < end )); do
        serial
        if [[ "$needle" == SNOW_QA_V1 ]] && grep -qF 'SNOW_QA_ERR' "$WORK/serial"; then
          # Console ONLCR may append one CR. Reject extra, malformed or
          # conflicting markers rather than choosing a convenient code.
          code=$(python3 - "$WORK/serial" <<'PY'
    import re, sys
    from pathlib import Path
    lines = Path(sys.argv[1]).read_bytes().split(b'\n')
    errors = [line for line in lines if b'SNOW_QA_ERR' in line]
    if len(errors) != 1 or any(b'SNOW_QA_V1' in line for line in lines):
        sys.exit(1)
    match = re.fullmatch(rb'SNOW_QA_ERR ([a-z_]{1,40})\r?', errors[0])
    if match is None:
        sys.exit(1)
    print(match[1].decode('ascii'))
    PY
          ) || fail phase_mismatch
          case "$code" in
            updater|rollback_action) fail guest_action_failed;;
            *) blocked guest_probe_error_observed;;
          esac
        fi
        if [[ -n "$observed_failure" ]] && grep -qF "$observed_failure" "$WORK/serial"; then
          if [[ "$observed_failure" == SNOW_INSTALL_FAILED ]]; then
            code=$(python3 - "$WORK/serial" <<'PY'
    import re, sys
    from pathlib import Path
    lines = Path(sys.argv[1]).read_bytes().split(b'\n')
    matches = [re.fullmatch(rb'SNOW_INSTALL_FAILED (firn_v1|firn_v2|firn_hash|disk_detect|disk_byid|firn_validate:[a-z-]{1,20}|firn_install:[a-z0-9_-]{1,40}:[a-z_]{1,40})\r?', line)
                for line in lines if b'SNOW_INSTALL_FAILED' in line]
    allowed = {'image_verification_failed', 'step_failed', 'cleanup_failed',
               'flatpak_unreachable', 'group_missing', 'no_core_set', 'no_tpm',
               'store_cleanup_failed', 'store_umount_failed', 'stream_truncated',
               'empty_stream', 'unlisted', 'unparsed'}
    validate_allowed = set('bad-version required enum family-scope mutex secret-file file disk hostname locale timezone keyboard username fullname group release product origin ssh-key password-hash passphrase mok tpm subvolumes unclassified'.split())
    if len(matches) == 1 and matches[0] is not None:
        token = matches[0][1].decode('ascii')
        if token.startswith('firn_validate:'):
            print(token if token.split(':', 1)[1] in validate_allowed else 'unparsed')
        elif not token.startswith('firn_install:') or token.rsplit(':', 1)[-1] in allowed:
            print(token)
        else:
            print('unparsed')
    elif any(b'SNOW_INSTALL_FAILED' in line for line in lines):
        print('unparsed')
    PY
            ) || fail install_failed
            python3 - "$WORK/serial" "$WORK/install-diagnostic.txt" <<'PY'
    import base64, os, re, sys
    from pathlib import Path
    lines = Path(sys.argv[1]).read_bytes().split(b'\n')
    candidates = [line for line in lines if b'SNOW_INSTALL_DIAG' in line]
    data = b'unparsed'
    if len(candidates) == 1:
        match = re.fullmatch(rb'SNOW_INSTALL_DIAG ([A-Za-z0-9+/=]{1,6000}|unavailable)\r*', candidates[0])
        if match:
            if match[1] == b'unavailable':
                data = b'unavailable'
            else:
                try:
                    decoded = base64.b64decode(match[1], validate=True)
                    if len(decoded) <= 4096:
                        decoded = re.sub(rb'\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)|[@-_])', b'', decoded)
                        decoded = re.sub(rb'\r+\n|\r', b'\n', decoded)
                        decoded = re.sub(rb'[\x00-\x08\x0b-\x1f\x7f-\x9f]', b'', decoded)
                        decoded = re.sub(rb'[0-9a-fA-F]{32,}|(?:[cbdefghijklnrtuv]{8}-){7}[cbdefghijklnrtuv]{8}', b'[REDACTED]', decoded)
                        data = decoded[-4096:]
                except ValueError:
                    pass
    with open(sys.argv[2], 'wb', opener=lambda path, flags: os.open(path, flags, 0o600)) as output:
        output.write(data)
    PY
            # Diagnostic persistence is best effort: retain the original install_failed code.
            persist "$WORK/install-diagnostic.txt" "$EVIDENCE/install-diagnostic.txt" || true
            [[ -z "$code" ]] || fail "install_failed:$code"
          fi
          fail install_failed
        fi
        if grep -qF "$needle" "$WORK/serial"; then return 0; fi
        sleep 5
      done
      blocked phase_timeout
    }
    # All injected strings are fixed or canonical manifest fields encoded as
    # data. No manifest text is evaluated as a shell program on the host.
    n=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_n"])' "$WORK/normalized.json") || fail manifest_read
    target=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_ref"])' "$WORK/normalized.json") || fail manifest_read
    next=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_n_plus_1"])' "$WORK/normalized.json") || fail manifest_read
    manifest_b64=$(base64 -w0 "$WORK/normalized.json") || fail manifest_read
    # Compress the trusted ConfigMap payload to keep the SMBIOS value below
    # firmware's 64 KiB string bound; the guest decompresses using Python.
    python3 -c 'import pathlib,zlib,sys; pathlib.Path(sys.argv[2]).write_bytes(zlib.compress(pathlib.Path(sys.argv[1]).read_bytes(),9))' /opt/snow-qa/qa.py "$WORK/qa.z" || fail qa_payload
    qa_b64=$(base64 -w0 "$WORK/qa.z") || fail qa_payload
    # The ISO boot runs only after validation, authenticated preflight and a
    # persistent manifest hash. A single root disk and a read-only ISO.
    tag before-install
    firn_sha256=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["firn_sha256"])' "$WORK/checks.json") || fail checks_read
    [[ "$firn_sha256" =~ ^[0-9a-f]{64}$ ]] || fail checks_read
    : > "$WORK/serial-baseline" # Empty log for the newly initialized VM.
    timeout 120 incus init "$VM" --empty --vm -c security.secureboot=true \
      -c limits.cpu=4 -c limits.memory=8GiB -d root,size=40GiB >/dev/null 2>&1 || fail vm_init
    INITIALIZED=1
    timeout 60 incus config device add "$VM" vtpm tpm >/dev/null 2>&1 || fail vm_tpm
    # A timed-out add may have attached the ISO despite reporting failure.
    INSTALLER_ATTACHED=1
    timeout 60 incus config device add "$VM" installer disk source="$ISO_HOST" boot.priority=10 readonly=true >/dev/null 2>&1 || fail vm_iso
    # Installer logic is a fixed program with encoded validated data. The
    # recipe and passwords are ephemeral guest-only files; no trace to serial.
    cat > "$WORK/install.sh" <<'GUEST'
    #!/bin/bash
    set -Eeuo pipefail
    umask 077
    printf 'SNOW_INSTALL_BEGIN\n' > /dev/ttyS0
    if [[ $(sha256sum /usr/bin/firn 2>/dev/null) != "@FIRN_SHA256@  /usr/bin/firn" ]]; then
      printf 'SNOW_INSTALL_FAILED firn_hash\n' > /dev/ttyS0
      exit 1
    fi
    cat > /run/snow-firn-v1.toml <<'VALIDATOR'
    version = 1
    [image]
    family = "bootc"
    ref = "ghcr.io/frostyard/snow@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    target_ref = "ghcr.io/frostyard/snow:qa-controlled"
    cosign_pub_key = "/usr/lib/snosi/cosign.pub"
    [target]
    disk = "/dev/example-disk"
    filesystem = "ext4"
    bootloader = "systemd"
    [security]
    encryption = "none"
    [system]
    hostname = "snow-qa"
    VALIDATOR
    if ! (ulimit -f 1024; firn validate --secure-boot off --tpm off /run/snow-firn-v1.toml >/run/snow-firn-v1.log 2>&1); then
      printf 'SNOW_INSTALL_FAILED firn_v1\n' > /dev/ttyS0
      exit 1
