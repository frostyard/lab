          printf 'phase=%s boot_id=%s sysext_failures=%s\n' "$phase" "$prior" "$sysext_state" >> "$OUT/checks.txt"
          persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
          # lab#177: which channel carried the record. Best effort: this file
          # never shapes checks.txt, the judge or the reason.
          printf 'phase=%s %s\n' "$phase" "$(cat "$WORK/serial-channel" 2>/dev/null)" >> "$OUT/serial-channel.txt" || true
          persist "$OUT/serial-channel.txt" "$EVIDENCE/serial-channel.txt" || true
          # Both sysext boots always run, so one record never hides the other.
          if [[ "$sysext_state" != none ]]; then
            sysext_failures+="${sysext_failures:+,}$sysext_state"
          fi
          ;;
        login-1|login-2)
          await SNOW_LOGIN_V1 "$((budget + 300))" SNOW_LOGIN_ERR
          python3 /opt/snow-qa/qa.py login-phase "$WORK/normalized.json" "$phase" "$nonce" "$prior" "$WORK/serial" "$WORK/$phase.json" > "$WORK/login-id" 2>/dev/null || fail phase_mismatch
          [[ -s "$WORK/$phase.json" && -s "$WORK/login-id" ]] || fail phase_mismatch
          prior=$(sed -n '1p' "$WORK/login-id")
          # Lines 2 and 3 are the apps that started and the session type, for
          # checks.txt; the record itself keeps every field of the probe.
          login_started=$(sed -n '2s/^started=//p' "$WORK/login-id")
          login_session=$(sed -n '3s/^session=//p' "$WORK/login-id")
          [[ -n "$prior" && -n "$login_started" && -n "$login_session" ]] || fail phase_mismatch
          [[ "$seen_boot_ids" != *":$prior:"* ]] || fail reused_boot_id
          seen_boot_ids+="$prior:"
          persist "$WORK/$phase.json" "$EVIDENCE/$phase.json" || fail evidence_write
          printf 'phase=%s boot_id=%s session=%s started=%s\n' "$phase" "$prior" "$login_session" "$login_started" >> "$OUT/checks.txt"
          persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
          # lab#177: which channel carried the record. Best effort: this file
          # never shapes checks.txt, the judge or the reason.
          printf 'phase=%s %s\n' "$phase" "$(cat "$WORK/serial-channel" 2>/dev/null)" >> "$OUT/serial-channel.txt" || true
          persist "$OUT/serial-channel.txt" "$EVIDENCE/serial-channel.txt" || true
          ;;
        problems)
          await SNOW_PROBLEMS_V1 "$((budget + 300))" SNOW_PROBLEMS_ERR
          python3 /opt/snow-qa/problems.py phase "$WORK/normalized.json" "$phase" "$nonce" "$prior" "$WORK/serial" "$WORK/problems.json" > "$WORK/problems-id" 2>/dev/null || fail phase_mismatch
          [[ -s "$WORK/problems.json" && -s "$WORK/problems-id" ]] || fail phase_mismatch
          prior=$(sed -n '1p' "$WORK/problems-id")
          [[ -n "$prior" ]] || fail phase_mismatch
          [[ "$seen_boot_ids" != *":$prior:"* ]] || fail reused_boot_id
          seen_boot_ids+="$prior:"
          persist "$WORK/problems.json" "$EVIDENCE/problems.json" || fail evidence_write
          printf 'phase=%s boot_id=%s\n' "$phase" "$prior" >> "$OUT/checks.txt"
          persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
          # lab#177: which channel carried the record. Best effort: this file
          # never shapes checks.txt, the judge or the reason.
          printf 'phase=%s %s\n' "$phase" "$(cat "$WORK/serial-channel" 2>/dev/null)" >> "$OUT/serial-channel.txt" || true
          persist "$OUT/serial-channel.txt" "$EVIDENCE/serial-channel.txt" || true
          ;;
        report)
          await SNOW_REPORT_V1 "$((budget + 300))" SNOW_REPORT_ERR
          python3 /opt/snow-qa/report.py phase "$WORK/normalized.json" "$phase" "$nonce" "$prior" "$WORK/serial" "$WORK/report.json" > "$WORK/report-id" 2>/dev/null || fail phase_mismatch
          [[ -s "$WORK/report.json" && -s "$WORK/report-id" ]] || fail phase_mismatch
          prior=$(sed -n '1p' "$WORK/report-id")
          [[ -n "$prior" ]] || fail phase_mismatch
          [[ "$seen_boot_ids" != *":$prior:"* ]] || fail reused_boot_id
          seen_boot_ids+="$prior:"
          persist "$WORK/report.json" "$EVIDENCE/report.json" || fail evidence_write
          # The lab intake's own logs are the evidence of what reached it. This is
          # pulled before the container goes away, and a missing or oversized log
          # is a probe defect, never a product finding.
          if [[ "$report_intake" == lab ]]; then
            for intake_log in requests glitchtip; do
              timeout 60 incus file pull "$INTAKE/var/lib/intake/$intake_log.jsonl" "$WORK/intake-$intake_log.jsonl" >/dev/null 2>&1 || fail report_logs
              intake_size=$(wc -c < "$WORK/intake-$intake_log.jsonl") || fail report_logs
              (( intake_size <= 1048576 )) || fail report_logs
              persist "$WORK/intake-$intake_log.jsonl" "$EVIDENCE/intake-$intake_log.jsonl" || fail evidence_write
            done
          fi
          printf 'phase=%s boot_id=%s\n' "$phase" "$prior" >> "$OUT/checks.txt"
          persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
          # lab#177: which channel carried the record. Best effort: this file
          # never shapes checks.txt, the judge or the reason.
          printf 'phase=%s %s\n' "$phase" "$(cat "$WORK/serial-channel" 2>/dev/null)" >> "$OUT/serial-channel.txt" || true
          persist "$OUT/serial-channel.txt" "$EVIDENCE/serial-channel.txt" || true
          ;;
        *)
          await SNOW_QA_V1 "$((budget + 300))"
          python3 /opt/snow-qa/qa.py phase "$WORK/normalized.json" "$phase" "$nonce" "$prior" "$WORK/serial" "$WORK/checks.json" > "$WORK/boot-id" 2>/dev/null || fail phase_mismatch
          [[ -s "$WORK/boot-id" ]] || fail phase_mismatch
          prior=$(head -n 1 "$WORK/boot-id")
