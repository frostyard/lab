      # The lab intake's logs are inputs of the judgement, not of the boot.
      report_logs=()
      if [[ "$report_intake" == lab ]]; then
        report_logs=("$WORK/intake-requests.jsonl" "$WORK/intake-glitchtip.jsonl")
      fi
      if ! python3 /opt/snow-qa/report.py report "$WORK/normalized.json" "$WORK/report.json" ${report_logs[@]+"${report_logs[@]}"} > "$WORK/report-report" 2>/dev/null; then
        fail report_report
      fi
      report_line=$(sed -n '1p' "$WORK/report-report")
      report_summary=${report_line#report=}
      [[ "$report_line" == "report=$report_summary" && "$report_summary" =~ ^[a-z0-9+-]{1,96}$ ]] || fail report_report
      cp -- "$WORK/report-report" "$OUT/report.txt" || fail report_report
      persist "$OUT/report.txt" "$EVIDENCE/report.txt" || fail evidence_write
      printf 'report=%s\n' "$report_summary" >> "$OUT/checks.txt"
      persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
      if [[ "$report_summary" == unproven-* ]]; then
        # ADR-0003: an image without the sender, or a guest that never reached
        # the lab intake, is unproven, never failed.
        blocked "report_$report_summary"
      fi
    fi
    STATE=PASS
    if [[ "$sysext_mode" == 1 ]]; then
      REASON=verified_sysext_probe${fsverity_known:+;fsverity_known_defect=${fsverity_known// /,}}
    elif [[ "$login_mode" == 1 ]]; then
      REASON="verified_first_login_probe;first_login=$login_summary${fsverity_known:+;fsverity_known_defect=${fsverity_known// /,}}"
    elif [[ "$problems_mode" == 1 ]]; then
      REASON="verified_problems_probe;problems=$problems_summary${fsverity_known:+;fsverity_known_defect=${fsverity_known// /,}}"
    elif [[ "$report_mode" == 1 ]]; then
      REASON="verified_report_probe;report=$report_summary${fsverity_known:+;fsverity_known_defect=${fsverity_known// /,}}"
    else
      REASON=verified_five_fresh_boots${fsverity_known:+;fsverity_known_defect=${fsverity_known// /,}}
    fi
  guest.sh: |
