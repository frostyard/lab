    """Host-side gates and report for the report-only report probe (plan T857 phase 2).

    This file never travels to the guest: the guest runs report-guest.py, carried in
    its own credential and started by qa.py `report`. It reads the one
    `SNOW_REPORT_V1` record of the probed boot and the lab intake's own request and
    GlitchTip logs, and it reports what the probe proved. The gates come from the one
    ConfigMap copy of qa.py beside it.
    """
    import base64
    import json
    import os
    import re
    import sys
    from pathlib import Path

    sys.path.insert(0, str(Path(__file__).resolve().parent))
    from qa import (REPORT_TOKEN_MAX, SERIAL_MAX, GateError, boot_id_valid, canonical,  # noqa: E402
                    full, load, marker_token, nonce_valid, pairs, require)
    from problems import SCHEMA, validate  # noqa: E402

    # The record the guest publishes, and the bounds of every field in it.
    RECORD_FIELDS = set("phase nonce boot_id booted_digest sender intake injected off consent timer sent dry production".split())
    OFF_FIELDS = set("conf_absent service_rc condition send_rc send_off status_rc endpoint again_rc again_result sent_absent dry_rc".split())
    CONSENT_FIELDS = set("on_rc enabled endpoint status".split())
    TIMER_FIELDS = set("triggered result waited enabled".split())
    SENT_FIELDS = set("status http_status problem_id kind report_id".split())
    PRODUCTION_FIELDS = set("http_status report_id".split())
    INJECTED_FIELDS = {"app", "crash"}
    MARKS = ("off-begin", "on-begin", "on-end")
    # The check names of the summary, in a fixed order: missing- plus all 10 is 65
    # characters, well inside the summary bound.
    CHECKS = ("off", "timer", "consent", "count", "app", "crash", "schema", "ip", "forward", "match")
    INJECTED_CODE = "lab.injected_t857"
    # The headers a Cloudflare edge adds; the intake strips them for GlitchTip.
    EDGE = ("cf-connecting-ip", "x-forwarded-for", "true-client-ip")
    REQUESTS_MAX = 1048576
    ENVELOPES_MAX = 1048576
    TOKEN = r"[a-z0-9_.-]{1,32}"
    UUID = r"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"
    UUID_RE = re.compile(UUID)
    HEX16 = r"[0-9a-f]{16}"
    PRINTABLE = r"[ -~]{0,160}"
    SUMMARY = re.compile(r"[a-z0-9+-]{1,96}")


    # ------------------------------------------------------------- the record

    def record_shape(record):
        """Strict shape of one report record: exact keys, types and bounds."""
        require(type(record) is dict and set(record) == RECORD_FIELDS, "record_fields")
        require(record["phase"] == "report" and nonce_valid(record["nonce"]), "record_identity")
        require(record["intake"] in ("lab", "production"), "record_fields")
        require(full(r"[0-9a-f]{64}", record["booted_digest"]), "record_fields")
        require(boot_id_valid(record["boot_id"]), "boot_identity")
        require(type(record["sender"]) is bool, "record_fields")
        injected = record["injected"]
        if injected is not None:
            require(type(injected) is dict and set(injected) == INJECTED_FIELDS, "record_injected")
            require(all(type(injected[key]) is bool for key in ("app", "crash")), "record_injected")
        off = record["off"]
        if off is not None:
            require(type(off) is dict and set(off) == OFF_FIELDS, "record_off")
            require(all(type(off[key]) is bool
                        for key in ("conf_absent", "send_off", "endpoint", "sent_absent")), "record_off")
            require(all(type(off[key]) is int and -128 <= off[key] <= 255
                        for key in ("service_rc", "send_rc", "status_rc", "again_rc", "dry_rc")), "record_off")
            require(all(full(TOKEN, off[key]) for key in ("condition", "again_result")), "record_off")
        consent = record["consent"]
        if consent is not None:
            require(type(consent) is dict and set(consent) == CONSENT_FIELDS, "record_consent")
            require(type(consent["on_rc"]) is int and -128 <= consent["on_rc"] <= 255, "record_consent")
            require(all(type(consent[key]) is bool for key in ("enabled", "endpoint")), "record_consent")
            require(full(PRINTABLE, consent["status"]), "record_consent")
        timer = record["timer"]
        if timer is not None:
            require(type(timer) is dict and set(timer) == TIMER_FIELDS, "record_timer")
            require(type(timer["triggered"]) is bool and full(TOKEN, timer["result"]), "record_timer")
            require(full(TOKEN, timer["enabled"]), "record_timer")
            require(type(timer["waited"]) is int and 0 <= timer["waited"] <= 300, "record_timer")
        sent = record["sent"]
        if sent is not None:
            require(type(sent) is list and len(sent) <= 32, "record_sent")
            for entry in sent:
                require(type(entry) is dict and set(entry) == SENT_FIELDS, "record_sent")
                require(full(TOKEN, entry["status"]) and full(TOKEN, entry["kind"]), "record_sent")
                require(type(entry["http_status"]) is int and 0 <= entry["http_status"] <= 599, "record_sent")
                require(entry["problem_id"] is None or full(HEX16, entry["problem_id"]), "record_sent")
                require(entry["report_id"] is None or full(UUID, entry["report_id"]), "record_sent")
        dry = record["dry"]
        if dry is not None:
            require(type(dry) is list and len(dry) <= 32 and all(full(TOKEN, kind) for kind in dry), "record_dry")
        production = record["production"]
        if production is not None:
            require(type(production) is dict and set(production) == PRODUCTION_FIELDS, "record_production")
            require(type(production["http_status"]) is int and 0 <= production["http_status"] <= 599, "record_production")
            require(production["report_id"] is None or full(UUID, production["report_id"]), "record_production")
        if record["intake"] == "production":
            # The production path makes no mark and changes no consent.
            require(all(record[name] is None for name in ("off", "consent", "timer", "sent", "dry", "injected")), "record_fields")
        else:
            require(record["production"] is None, "record_fields")
        if not record["sender"]:
            require(all(record[name] is None for name in ("off", "consent", "timer", "sent", "dry", "injected", "production")), "record_fields")


    def record_count(raw):
        """The one report record the serial slice carries, by the SNOW_QA_V1 rules."""
        require(len(raw) <= SERIAL_MAX, "serial_size")
        lines = [line for line in raw.split(b"\n") if b"SNOW_QA_KMSG1" not in line]
        tail = rb"([A-Za-z0-9_-]{1,%d})" % (REPORT_TOKEN_MAX + 64)
        # Identical copies collapse into one token; only a complete one is a record.
        tokens = {marker_token(line, b"SNOW_REPORT_V1") for line in lines if b"SNOW_REPORT_V1" in line}
        markers = {token for token in tokens if re.fullmatch(b"SNOW_REPORT_V1 " + tail, token) is not None}
        require(markers or not tokens, "record_encoding")
        require(len(markers) == 1, "record_count")
        match = re.fullmatch(b"SNOW_REPORT_V1 " + tail, sorted(markers)[0])
        require(match is not None, "record_encoding")
        encoded = match[1]
        try:
            decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
            require(base64.urlsafe_b64encode(decoded).rstrip(b"=") == encoded, "record_encoding")
            require(len(decoded) <= REPORT_TOKEN_MAX, "record_size")
            record = json.loads(decoded, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(GateError("record_encoding")))
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_encoding") from exc
        return record


    def record_file(path):
        """One written report record, read back and shape-checked."""
        try:
            raw = Path(path).read_bytes()
            require(len(raw) <= 65536, "record_size")
            data = json.loads(raw, object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_fields") from exc
        record_shape(data)
        return data


    def phase(m, name, nonce, prior, serial, destination):
        """The record of one probed boot: its identity and image, then evidence."""
        require("report_probe" in m and name == "report" and nonce_valid(nonce)
                and (prior == "none" or boot_id_valid(prior)), "phase_arguments")
        record = record_count(Path(serial).read_bytes())
        record_shape(record)
        require(record["phase"] == name and record["nonce"] == nonce, "record_identity")
        require(record["boot_id"] != prior, "boot_identity")
        require(record["intake"] == m["report_probe"]["intake"], "probed_intake")
        # The report boot is the installed N: nothing is staged and nothing is booted twice.
        require(record["booted_digest"] == m["image_n"].rsplit(":", 1)[-1], "booted_image")
        with open(destination, "wb", opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
            stream.write(canonical(record))
        print(record["boot_id"])


    # --------------------------------------------------------------- the logs

    def log_entries(path, limit):
        """Every JSON line of one intake log; a cut or broken log is refused."""
        raw = Path(path).read_bytes()
        require(len(raw) <= limit, "report_logs")
        entries = []
        for line in raw.splitlines():
            if not line.strip():
                continue
            try:
                entry = json.loads(line, object_pairs_hook=pairs)
            except (ValueError, UnicodeError) as exc:
                raise GateError("report_logs") from exc
            require(type(entry) is dict, "report_logs")
            entries.append(entry)
        return entries


    def marks(requests):
        """The sequence number of each mark the guest made, None when it is not there."""
        found = {}
        for name in MARKS:
            seqs = [entry.get("seq") for entry in requests
                    if entry.get("type") == "mark" and entry.get("name") == name]
            found[name] = seqs[0] if len(seqs) == 1 and type(seqs[0]) is int else None
        return found


    def posted(requests):
        """Every POST /v1/report the proxy forwarded, in log order."""
        return [entry for entry in requests
                if entry.get("type") == "request" and entry.get("method") == "POST"
                and entry.get("path") == "/v1/report"]


    def document_of(entry):
        """The report document of one forwarded request, or None."""
        body = entry.get("body")
        if type(body) is not str:
            return None
        try:
            document = json.loads(body)
        except (ValueError, UnicodeError):
            return None
        return document if type(document) is dict else None


    def report_id_of(document):
        value = document.get("report_id") if type(document) is dict else None
        return value if type(value) is str and UUID_RE.fullmatch(value) else None


    def accepted(requests):
        """(entry, document) of each report the intake answered with 202."""
        found = []
        for entry in posted(requests):
            document = document_of(entry)
            if entry.get("status") == 202 and document is not None:
                found.append((entry, document))
        return found


    def of_kind(entries, kind):
        return [(entry, document) for entry, document in entries if document.get("kind") == kind]


    def envelope_parts(entry):
        """(event_id, event) of one GlitchTip envelope: its header, then its payload."""
        body = entry.get("body")
        lines = body.splitlines() if type(body) is str else []
        header = event = None
        for index, line in enumerate(lines[:8]):
            try:
                value = json.loads(line)
            except (ValueError, UnicodeError):
                continue
            if type(value) is not dict:
                continue
            if index == 0:
                header = value
            event = value
        event_id = header.get("event_id") if type(header) is dict else None
        return (event_id if type(event_id) is str else None), event


    # --------------------------------------------------------------- the checks

    def off_clean(off):
        """The guest's off state: the sender never ran, and it says why."""
        return (type(off) is dict and off["conf_absent"] is True and off["condition"] == "no"
                and off["send_off"] is True and off["status_rc"] == 0
                and off["endpoint"] is True and off["sent_absent"] is True)


    def schema_clean(requests, root):
        """Every forwarded document is frostyard.problem/1, and the intake said 202."""
        for entry in posted(requests):
            document = document_of(entry)
            if document is None or entry.get("status") != 202:
                return False
            try:
                validate(root, document, root)
            except GateError:
                return False
        return True


    def ip_clean(requests, envelopes):
        """No client IP reaches GlitchTip: not in a header, not in an event."""
        peers = [entry.get("peer") for entry in requests if type(entry.get("peer")) is str and entry["peer"]]
        for entry in envelopes:
            blob = json.dumps(entry, sort_keys=True)
            if any(peer in blob for peer in peers):
                return False
            headers = entry.get("headers")
            if type(headers) is dict and any(name.lower() in EDGE for name in headers):
                return False
            _, event = envelope_parts(entry)
            user = event.get("user") if type(event) is dict else None
            if type(user) is dict and user.get("ip_address") is not None:
                return False
        return True


    def forward_clean(entries, envelopes):
        """Every accepted report is exactly 1 authenticated envelope, and no count is."""
        if any(entry.get("bearer_ok") is not True for entry in envelopes):
            return False
        seen = []
        for entry in envelopes:
            event_id, _ = envelope_parts(entry)
            if event_id is None or not full(r"[0-9a-fA-F]{32}", event_id):
                return False
            seen.append(event_id.lower())
        if len(seen) != len(set(seen)):
            return False
        wanted = set()
        for entry, document in entries:
            report_id = report_id_of(document)
            if report_id is None or document.get("kind") == "count":
                # A count travels as its own report, never as a GlitchTip event.
                continue
            wanted.add(report_id.replace("-", ""))
        return wanted == set(seen)


    def match_clean(record, entries):
        """The sender's own log names the same accepted reports the intake saw."""
        guest = {entry["report_id"] for entry in record["sent"] or []
                 if entry["status"] == "accepted" and entry["report_id"] is not None}
        host = {report_id_of(document) for entry, document in entries} - {None}
        return bool(guest) and guest == host


    def yes(value):
        return "yes" if value else "no"


    def first_id(entries):
        for entry, document in entries:
            report_id = report_id_of(document)
            if report_id is not None:
                return report_id
        return "none"


    def lab_summary(record, root, requests, envelopes):
        """ok, unproven-intake, or missing- plus every failed check of the lab path."""
        found = marks(requests)
        if any(found[name] is None for name in MARKS) or not (found["off-begin"] < found["on-begin"] < found["on-end"]):
            # Without the marks the guest never reached the intake: nothing to judge.
            return "unproven-intake"
        forwarded = accepted(requests)
        app = [document for entry, document in of_kind(forwarded, "app_problem")
               if type(document.get("detail")) is dict
               and document["detail"].get("code") == INJECTED_CODE]
        timer, consent = record["timer"] or {}, record["consent"] or {}
        checks = {
            "off": off_clean(record["off"]) and not any(
                type(entry.get("seq")) is int and entry["seq"] < found["on-begin"] for entry in posted(requests)),
            "timer": timer.get("triggered") is True and timer.get("result") == "success",
            "consent": consent.get("on_rc") == 0 and consent.get("enabled") is True
                       and consent.get("endpoint") is True,
            "count": len(of_kind(forwarded, "count")) == 1,
            "app": bool(app),
            # A crash must never be sent, also not while reporting is on.
            "crash": not any((document_of(entry) or {}).get("kind") == "crash" for entry in posted(requests)),
            "schema": schema_clean(requests, root),
            "ip": ip_clean(requests, envelopes),
            "forward": forward_clean(forwarded, envelopes),
            "match": match_clean(record, forwarded),
        }
        failed = [name for name in CHECKS if not checks[name]]
        return "ok" if not failed else "missing-" + "+".join(failed)


    def production_summary(record):
        production = record["production"]
        if production is not None and production["http_status"] == 202 and production["report_id"] is not None:
            return "production-accepted"
        return "missing-production"


    # --------------------------------------------------------------- the report

    def detail(record, requests, accepted_posts, envelopes):
        """The fixed detail lines: what the probe saw, bounded and printable."""
        print("intake=%s sender=%s" % (record["intake"], yes(record["sender"])))
        if record["intake"] == "production":
            production = record["production"] or {}
            print("report_id=%s kind=app_problem" % (production.get("report_id") or "none"))
            print("http_status=%s" % production.get("http_status", "none"))
            return
        found = marks(requests)
        print("marks off-begin=%s on-begin=%s on-end=%s" % tuple(
            yes(found[name] is not None) for name in MARKS))
        whole = posted(requests)
        print("posted total=%d accepted=%d app_problem=%d count=%d crash=%d" % (
            len(whole), len(accepted_posts), len(of_kind(accepted_posts, "app_problem")),
            len(of_kind(accepted_posts, "count")),
            sum(1 for entry in whole if (document_of(entry) or {}).get("kind") == "crash")))
        print("report_ids app_problem=%s count=%s" % (first_id(of_kind(accepted_posts, "app_problem")),
                                                      first_id(of_kind(accepted_posts, "count"))))
        print("envelopes=%d bearer_ok=%s" % (
            len(envelopes), yes(all(entry.get("bearer_ok") is True for entry in envelopes))))
        off = record["off"] or {}
        print("off conf_absent=%s condition=%s send_off=%s sent_absent=%s dry=%d" % (
            yes(off.get("conf_absent")), off.get("condition", "none"), yes(off.get("send_off")),
            yes(off.get("sent_absent")), len(record["dry"] or [])))
        consent = record["consent"] or {}
        print("consent on_rc=%s enabled=%s endpoint=%s" % (
            consent.get("on_rc", "none"), yes(consent.get("enabled")), yes(consent.get("endpoint"))))
        timer = record["timer"] or {}
        print("timer triggered=%s result=%s waited=%s enabled=%s" % (
            yes(timer.get("triggered")), timer.get("result", "none"), timer.get("waited", "none"),
            timer.get("enabled", "none")))
        print("sent accepted=%d of %d" % (
            sum(1 for entry in record["sent"] or [] if entry["status"] == "accepted"),
            len(record["sent"] or [])))


    def report(m, path, requests_path=None, glitchtip_path=None):
        """The one summary line, then the fixed detail lines; never a product failure."""
        record = record_file(path)
        if record["intake"] == "lab":
            require(requests_path is not None and glitchtip_path is not None, "usage")
            requests = log_entries(requests_path, REQUESTS_MAX)
            envelopes = log_entries(glitchtip_path, ENVELOPES_MAX)
        else:
            require(requests_path is None and glitchtip_path is None, "usage")
            requests, envelopes = [], []
        root = json.loads(SCHEMA.read_bytes())
        if not record["sender"]:
            summary = "unproven-no-sender"
        elif record["intake"] == "lab":
            summary = lab_summary(record, root, requests, envelopes)
        else:
            summary = production_summary(record)
        # The summary reaches checks.txt and the run reason: one grammar, one bound.
        require(SUMMARY.fullmatch(summary) is not None, "record_fields")
        print("report=" + summary)
        detail(record, requests, accepted(requests), envelopes)


    def main(argv):
        try:
            require(len(argv) in (3, 5, 7), "usage")
            if argv[0] == "phase" and len(argv) == 7:
                phase(load(argv[1], frozen=True), argv[2], argv[3], argv[4], argv[5], argv[6])
            elif argv[0] == "report" and len(argv) == 3:
                report(load(argv[1], frozen=True), argv[2])
            elif argv[0] == "report" and len(argv) == 5:
                report(load(argv[1], frozen=True), argv[2], argv[3], argv[4])
            else:
                raise GateError("usage")
            return 0
        except (GateError, OSError, TypeError, KeyError, ValueError) as exc:
            code = str(exc) if isinstance(exc, GateError) and full(r"[a-z_]{1,40}", str(exc)) else "io_error"
            print("qa_failed:" + code, file=sys.stderr)
            return 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:]))
