    #!/bin/bash
    # Setup of the lab intake container of the report probe (plan T857 phase 2).
    #
    # It runs inside a throwaway Incus container, as root, with INTAKE_COMMIT,
    # NODE_VERSION and NODE_SHA256 from the runner. It builds the real
    # frostyard/problem-intake Worker under `wrangler dev`, starts the proxy and mock
    # GlitchTip beside it, and waits, bounded, until the proxy answers. The intake
    # bearer and the GlitchTip DSN key are random per run and stay in this container;
    # nothing here is written to the pod log or to the evidence.
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    umask 077
    : "${INTAKE_COMMIT:?}" "${NODE_VERSION:?}" "${NODE_SHA256:?}"
    [[ "$INTAKE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "bad INTAKE_COMMIT" >&2; exit 2; }
    [[ "$NODE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad NODE_VERSION" >&2; exit 2; }
    [[ "$NODE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "bad NODE_SHA256" >&2; exit 2; }

    apt-get update -qq
    apt-get install -y -qq --no-install-recommends \
      ca-certificates curl git xz-utils openssl python3 >/dev/null

    # Trixie ships Node 20; wrangler 4.157.0 needs Node 22 or newer.
    install -d -m 0755 /opt/node /opt/intake /opt/intake/tls /var/lib/intake
    tarball=/opt/node.tar.xz
    curl -fsSL --max-time 300 -o "$tarball" \
      "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
    printf '%s  %s\n' "$NODE_SHA256" "$tarball" | sha256sum -c - >/dev/null
    tar -xJf "$tarball" -C /opt/node --strip-components=1
    rm -f "$tarball"
    export PATH="/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    git clone --quiet https://github.com/frostyard/problem-intake /opt/intake/src
    git -C /opt/intake/src checkout --quiet --detach "$INTAKE_COMMIT"
    [[ "$(git -C /opt/intake/src rev-parse HEAD)" == "$INTAKE_COMMIT" ]] || {
      echo "intake pin mismatch" >&2; exit 3; }
    # There is no mise in this container: the Worker installs from package-lock alone.
    rm -f /opt/intake/src/mise.toml /opt/intake/src/mise.lock
    (cd /opt/intake/src && npm ci --no-audit --no-fund >/dev/null)

    # A self-signed P-256 certificate for the mock GlitchTip on the loopback address;
    # workerd trusts it through NODE_EXTRA_CA_CERTS (set by the runner).
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
      -keyout /opt/intake/tls/key.pem -out /opt/intake/tls/cert.pem \
      -subj /CN=127.0.0.1 -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
    chmod 0600 /opt/intake/tls/key.pem

    bearer=$(openssl rand -hex 24)
    dsn_key=$(openssl rand -hex 16)
    printf 'INTAKE_BEARER=%s\nGLITCHTIP_DSNS={"system":"https://%s@127.0.0.1:8443/1"}\nAE_READ_TOKEN=lab\nCF_ACCOUNT_ID=lab\n' \
      "$bearer" "$dsn_key" > /opt/intake/src/.dev.vars
    chmod 0600 /opt/intake/src/.dev.vars
    printf '%s\n' "$bearer" > /opt/intake/bearer
    printf '%s\n' "$dsn_key" > /opt/intake/dsn-key
    chmod 0600 /opt/intake/bearer /opt/intake/dsn-key

    systemd-run --quiet --unit=intake-lab --property=Type=simple --property=Restart=no \
      python3 /opt/intake/lab.py
    systemd-run --quiet --unit=intake-wrangler --working-directory=/opt/intake/src \
      --property=Type=simple --property=Restart=no \
      --setenv=NODE_EXTRA_CA_CERTS=/opt/intake/tls/cert.pem \
      --setenv=PATH=/opt/node/bin:/usr/local/bin:/usr/bin:/bin \
      --setenv=CI=1 --setenv=WRANGLER_SEND_METRICS=false \
      /opt/node/bin/npx wrangler dev --local --ip 127.0.0.1 --port 8788

    end=$((SECONDS + 180))
    until curl -fsS --max-time 5 http://127.0.0.1:8787/v1/health >/dev/null 2>&1; do
      (( SECONDS < end )) || { echo "intake did not answer" >&2; exit 4; }
      sleep 3
    done
