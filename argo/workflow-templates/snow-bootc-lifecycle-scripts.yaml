          # release (frostyard/snosi#1130). Line 4 records lockdown evidence.
          fsverity=$(sed -n '2s/^fsverity_errors=\([0-9]\{1,10\}\)$/\1/p' "$WORK/boot-id")
          [[ -n "$fsverity" ]] || fail phase_mismatch
          kernel=$(sed -n '3s/^kernel=\([0-9A-Za-z._+~-]\{1,64\}\)$/\1/p' "$WORK/boot-id")
          [[ -n "$kernel" ]] || fail phase_mismatch
          lockdown=$(sed -n '4s/^lockdown=\(integrity\|confidentiality\|unavailable\) cmdline_lockdown=\(absent\|[a-z]\{1,16\}\)$/\1/p' "$WORK/boot-id")
          cmdline_lockdown=$(sed -n '4s/^lockdown=\(integrity\|confidentiality\|unavailable\) cmdline_lockdown=\(absent\|[a-z]\{1,16\}\)$/\2/p' "$WORK/boot-id")
          [[ -n "$lockdown" && -n "$cmdline_lockdown" ]] || fail phase_mismatch
          [[ "$seen_boot_ids" != *":$prior:"* ]] || fail reused_boot_id
          seen_boot_ids+="$prior:"
          printf 'phase=%s boot_id=%s kernel=%s fsverity_errors=%s lockdown=%s cmdline_lockdown=%s\n' "$phase" "$prior" "$kernel" "$fsverity" "$lockdown" "$cmdline_lockdown" >> "$OUT/checks.txt"
          # lab#174: the kept lines of this phase, one per line, bounded at 32.
          # The command line is separate best-effort evidence; it never shapes checks.txt.
          sed -n '6,$p' "$WORK/boot-id" \
            | grep -E '^seq=([1-9]|[12][0-9]|3[0-2]) device=[A-Za-z0-9._-]{1,32} inode=[0-9]{1,20} pos=[0-9]{1,20} level=-?[0-9]{1,2}$' \
            | head -n 32 | sed "s/^/phase=$phase /" >> "$OUT/fsverity.txt" || true
          persist "$OUT/fsverity.txt" "$EVIDENCE/fsverity.txt" || true
          cmdline=$(sed -n '5s/^cmdline=\(.*\)$/\1/p' "$WORK/boot-id") || cmdline=""
          if [[ ${#cmdline} -ge 1 && ${#cmdline} -le 4096 ]] \
             && [[ "$cmdline" =~ ^[[:print:][:blank:]]+$ ]] \
             && [[ "$cmdline" != *$'\t'* && "$cmdline" != *$'\r'* ]]; then
            prefix="phase=$phase cmdline="
            max=$((4096 - ${#prefix}))
            if (( max > 0 )) && printf -v truncated '%.*s' "$max" "$cmdline"; then
              printf '%s%s\n' "$prefix" "$truncated" >> "$OUT/cmdline.txt" || true
            fi
          fi
          persist "$OUT/cmdline.txt" "$EVIDENCE/cmdline.txt" || true
          if (( 10#$fsverity > 0 )); then
            if [[ " $known_defect_kernels " == *" $kernel "* ]]; then
              [[ " $fsverity_known " == *" $kernel "* ]] || fsverity_known+="${fsverity_known:+ }$kernel"
            else
              fsverity_bad=1
            fi
          fi
          persist "$OUT/checks.txt" "$EVIDENCE/checks.txt" || fail evidence_write
          # lab#177: which channel carried the record. Best effort: this file
          # never shapes checks.txt, the judge or the reason.
          printf 'phase=%s %s\n' "$phase" "$(cat "$WORK/serial-channel" 2>/dev/null)" >> "$OUT/serial-channel.txt" || true
          persist "$OUT/serial-channel.txt" "$EVIDENCE/serial-channel.txt" || true
          ;;
      esac
      case "$phase" in stage|boot-n-plus-1|rollback) tag after-"$phase";; esac
      # The guest unit powers off after its record so bootc finalizes the staged
      # deployment at shutdown (a forced stop would skip it). Wait, bounded, for
      # the VM to stop; never force-stop between phases.
      shutdown_budget=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["timeouts"]["reboot"])' "$WORK/normalized.json") || fail manifest_read
      # The guest replays its record (qa.py PUBLISH_WAIT, inside its
      # PUBLISH_MARGIN of 150 s) before it requests poweroff: that margin comes
      # on top of the manifest shutdown allowance.
      shutdown_end=$((SECONDS + shutdown_budget + 150))
      until vm_stopped; do
        (( SECONDS < shutdown_end )) || fail guest_shutdown
        sleep 5
      done
    done
    # snosi#1189 evidence: every probed unit's load state and the target's Upholds, pass or fail.
    if [[ "$sysext_mode" == 1 ]]; then
      python3 - "$WORK/normalized.json" "$WORK/sysext-enable.json" "$WORK/sysext-reboot.json" >&2 <<'PY' || true
    import json, re, sys
    from pathlib import Path
    def clean(value, limit=240, space='_'):
        if not isinstance(value, str):
            return '-'
        value = re.sub(r'[\x00-\x1f\x7f-\x9f\u2028\u2029\s]+', space, value[:4096])
        value = re.sub(r'[0-9a-fA-F]{32,}', '[REDACTED]', value)
        return value[:limit] or '-'
    manifest = json.loads(Path(sys.argv[1]).read_bytes()[:16384])
    probe = manifest['sysext_probe']
    for phase, name in zip(('sysext-enable', 'sysext-reboot'), sys.argv[2:]):
        try:
            data = json.loads(Path(name).read_bytes()[:1048576])
        except (OSError, ValueError):
            continue
        if not isinstance(data, dict):
            continue
        entries = data.get('units')
        for unit in probe['units']:
            entry = entries.get(unit) if isinstance(entries, dict) else None
            entry = entry if isinstance(entry, dict) else {}
            print('sysext_state phase=%s unit=%s ActiveState=%s LoadState=%s NeedDaemonReload=%s' % (
                phase, unit, clean(entry.get('ActiveState')), clean(entry.get('LoadState')),
                clean(entry.get('NeedDaemonReload'))))
        target = data.get('target')
        target = target if isinstance(target, dict) else {}
        print('sysext_target phase=%s LoadState=%s NeedDaemonReload=%s Upholds=%s' % (
            phase, clean(target.get('LoadState')), clean(target.get('NeedDaemonReload')),
            clean(target.get('Upholds'), 1024, ' ')))
    PY
    fi
