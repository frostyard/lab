    #!/bin/bash
    # Test-only first-login setup for the lab first-login probe: it writes a lab-only
    # autologin configuration into the INSTALLED /etc, never into an image, and it
    # never writes below /usr. The probe is report-only: a system whose display
    # manager cannot be named ends as dm=none and gets no account.
    set -Eeuo pipefail
    # 022, not 077: the greeter and the session user must be able to read the
    # configuration this script writes. /var/lib/snow-qa is made 0700 below.
    umask 022
    # Every path below is prefixed with this root; the offline tests point it at a
    # temporary tree instead of /.
    root="${SNOW_QA_ROOT:-}"
    user=snowqa
    state="$root/var/lib/snow-qa/login-setup"
    session=none

    dm=""
    if command -v systemctl >/dev/null 2>&1; then
      # The active display manager unit; an absent or unrelated one names no manager.
      dm=$(systemctl show --value -p Id display-manager.service 2>/dev/null || true)
    fi

    # gdm3 is Debian's unit name for GDM; sddm has one unit name.
    case "$dm" in
      gdm.service|gdm3.service) kind=gdm ;;
      sddm.service) kind=sddm ;;
      *)
        install -d -m 0700 "$root/var/lib/snow-qa"
        printf 'dm=none\n' > "$state"
        exit 0
        ;;
    esac

    # The account exists in the installed system only, and only for this probe.
    if ! id -u "$user" >/dev/null 2>&1; then
      useradd --create-home --user-group --shell /bin/bash --comment 'Snow QA' "$user"
    fi

    case "$kind" in
      gdm)
        # The image's own autologin setting must never win over the probe's one, so
        # every active autologin line goes first, whatever its case.
        # An existing /etc/gdm3 keeps its own mode (install -d would change it),
        # because the greeter and the session user must still read it.
        [[ -d "$root/etc/gdm3" ]] || install -d -m 0755 "$root/etc/gdm3"
        conf="$root/etc/gdm3/daemon.conf"
        # 0644 so the greeter can read it; an existing file keeps its own mode.
        [[ -e "$conf" ]] || install -m 0644 /dev/null "$conf"
        python3 - "$conf" "$user" <<'PY'
    import sys
    from pathlib import Path

    path, user = Path(sys.argv[1]), sys.argv[2]
    raw = path.read_bytes()
    if len(raw) > 65536:
        sys.exit(1)
    block = ["# snow-qa: test-only autologin for the lab first-login probe, never in an image",
             "AutomaticLoginEnable=true",
             "AutomaticLogin=" + user]


    def remove(line):
        """An active autologin key, whitespace around '=' allowed (GKeyFile)."""
        stripped = line.strip()
        if not stripped or stripped.startswith("#"):
            return False
        key, separator, _ = stripped.partition("=")
        return bool(separator) and key.strip().lower().startswith(("automaticlogin", "timedlogin"))


    kept = [line for line in raw.decode("utf-8", "replace").splitlines() if not remove(line)]
    index = next((number for number, line in enumerate(kept) if line.strip() == "[daemon]"), None)
    if index is None:
        kept = kept + ["[daemon]"] + block
    else:
        kept = kept[:index + 1] + block + kept[index + 1:]
    path.write_bytes(("\n".join(kept) + "\n").encode())
    PY
        ;;
      sddm)
        # A session the image ships: wayland Plasma first, then X11 Plasma.
        for candidate in /usr/share/wayland-sessions/plasma.desktop \
          /usr/share/xsessions/plasmax11.desktop \
          /usr/share/xsessions/plasma.desktop; do
          if [[ -f "$root$candidate" ]]; then
            session="${candidate##*/}"
            break
          fi
        done
        # An existing /etc/sddm.conf.d keeps its own mode, for the same reason.
        [[ -d "$root/etc/sddm.conf.d" ]] || install -d -m 0755 "$root/etc/sddm.conf.d"
        # SDDM reads every file of /etc/sddm.conf.d in alphabetical order and the
        # last one wins, so zz- sorts after a drop-in such as 10-sundog.conf.
        {
          printf '# snow-qa: test-only autologin for the lab first-login probe, never in an image\n'
          printf '[Autologin]\n'
          printf 'User=%s\n' "$user"
          if [[ "$session" != none ]]; then
            printf 'Session=%s\n' "$session"
          fi
        } > "$root/etc/sddm.conf.d/zz-snow-qa-autologin.conf"
        chmod 0644 "$root/etc/sddm.conf.d/zz-snow-qa-autologin.conf"
        # SDDM reads /etc/sddm.conf after /etc/sddm.conf.d, so an [Autologin]
        # section there would win over the drop-in. Comment out its active User,
        # Session and Relogin keys; the file is never created and keeps its mode.
        if [[ -f "$root/etc/sddm.conf" ]]; then
