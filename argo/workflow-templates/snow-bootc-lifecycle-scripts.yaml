    """The lab intake of the report probe (plan T857 phase 2): the real intake Worker
    under `wrangler dev`, behind a small proxy, with a mocked GlitchTip.

    Both servers run inside the throwaway Incus container the run creates. The proxy
    listens on the container's own address and adds the 3 headers a Cloudflare edge
    adds, so the Worker sees a request shaped like a real one. Every request and every
    GlitchTip envelope is appended to a JSON line log; nothing is kept in memory only.
    Stdlib only: the container has no pip packages.
    """
    import json
    import os
    import re
    import ssl
    import threading
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    STATE = Path("/var/lib/intake")
    REQUESTS = STATE / "requests.jsonl"
    GLITCHTIP = STATE / "glitchtip.jsonl"
    CERT = Path("/opt/intake/tls/cert.pem")
    KEY = Path("/opt/intake/tls/key.pem")
    # The intake bearer and the GlitchTip DSN key, both random per run and 0600.
    SECRET_FILES = (Path("/opt/intake/bearer"), Path("/opt/intake/dsn-key"))
    UPSTREAM = "http://127.0.0.1:8788"
    PROXY_PORT = 8787
    MOCK_PORT = 8443
    BODY_MAX = 16384
    ENVELOPE_MAX = 65536
    READ_MAX = 65536
    MARK = re.compile(r"/lab/mark/([a-z-]{1,16})")
    ENVELOPE_PATH = re.compile(r"/api/[0-9]+/envelope/")
    # The only request headers the Worker sees; the edge adds the 3 below. A header
    # name is case-insensitive, so this set holds lower case names.
    FORWARD = {"content-type"}
    EDGE = ("CF-Connecting-IP", "X-Forwarded-For", "True-Client-IP")
    # One sequence number for both logs, so an envelope and a request never share one.
    LOCK = threading.Lock()
    SEQUENCE = [0]


    def secrets():
        """The 2 lab credentials of this run, the bearer first; never logged, never returned."""
        found = []
        for path in SECRET_FILES:
            try:
                value = path.read_text().strip()
            except OSError:
                continue
            if len(value) >= 16:
                found.append(value)
        return found


    SECRETS = secrets()


    def append(path, entry):
        """Append 1 JSON line, numbered and fsynced, under the one lock."""
        with LOCK:
            SEQUENCE[0] += 1
            body = json.dumps(dict(entry, seq=SEQUENCE[0]), sort_keys=True) + "\n"
            with path.open("a", encoding="utf-8") as stream:
                stream.write(body)
                stream.flush()
                os.fsync(stream.fileno())


    def bearer_ok(headers):
        """True only for exactly `Authorization: Bearer <this run's bearer>`.

        The Worker always sends its DSN key in X-Sentry-Auth, so that key proves
        nothing about the bearer that caddy checks; only the bearer counts here.
        """
        bearer = SECRETS[0] if SECRETS else ""
        values = [value for name, value in headers.items() if name.lower() == "authorization"]
        return bool(bearer) and values == ["Bearer " + bearer]


    def redacted(name, value):
        """A header value for the log: no lab secret is ever written to it."""
        if name.lower() == "authorization":
            return "bearer_ok: true" if bearer_ok({name: value}) else "bearer_ok: false"
        for secret in SECRETS:
            value = value.replace(secret, "<redacted>")
        return value


    def event_id(text):
        """The event id of a GlitchTip envelope, or the mock's fixed placeholder."""
        first = text.splitlines()[0] if text.splitlines() else ""
        try:
            header = json.loads(first)
        except (ValueError, UnicodeError):
            return "x"
        if type(header) is dict and type(header.get("event_id")) is str:
            return header["event_id"]
        return "x"


    class Handler(BaseHTTPRequestHandler):
        """The line and the bounds every request of either server shares."""

        protocol_version = "HTTP/1.1"

        def log_message(self, *args):
            pass   # the pod log is not the evidence: the JSON line logs are

        def payload(self, limit):
            length = self.headers.get("Content-Length")
            if length is None or not length.isdigit():
                return b""
            return self.rfile.read(min(int(length), limit))

        def answer(self, status, body=b"", content_type="application/json"):
            # 1 request per connection: a body cut at BODY_MAX must not leave bytes
            # that the next request on a kept-alive connection would read.
            self.close_connection = True
            self.send_response(status)
            if body:
                self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if body:
                self.wfile.write(body)


    class Proxy(Handler):
        """What a Cloudflare edge does: add the client's IP, forward, log the request."""

        server_version = "intake-lab"
        sys_version = ""

        def forward(self, method, data):
            peer = self.client_address[0]
            headers = {name: value for name, value in self.headers.items()
                       if name.lower() in FORWARD}
            for name in EDGE:
                # The guest's own headers never reach the Worker; these 3 do, as a
                # real edge sends them, so the mock proves the Worker strips them.
                headers[name] = peer
            request = urllib.request.Request(UPSTREAM + self.path, data=data or None,
                                             headers=headers, method=method)
            body = b""
            try:
                with urllib.request.urlopen(request, timeout=60) as response:
                    status, body = response.status, response.read(READ_MAX)
            except urllib.error.HTTPError as exc:
                status = exc.code
            except (urllib.error.URLError, OSError, ValueError):
                status = 502
            append(REQUESTS, {"type": "request", "method": method, "path": self.path, "peer": peer,
                              "status": status, "name": None,
                              "body": data[:BODY_MAX].decode("utf-8", "replace")})
            self.answer(status, body)

        def do_GET(self):
            if self.path == "/v1/health":
                return self.forward("GET", b"")
            return self.answer(404, b'{"error":"not found"}')

        def do_POST(self):
            data = self.payload(BODY_MAX)
            if self.path == "/v1/report":
                return self.forward("POST", data)
            match = MARK.fullmatch(self.path)
            if match:
                append(REQUESTS, {"type": "mark", "method": "POST", "path": self.path,
                                  "peer": self.client_address[0], "status": 204,
                                  "name": match[1], "body": ""})
                return self.answer(204)
            return self.answer(404, b'{"error":"not found"}')


    class Mock(Handler):
        """A GlitchTip intake: it keeps the envelope and answers like the real one."""

        server_version = "glitchtip-mock"
        sys_version = ""

        def do_POST(self):
            data = self.payload(ENVELOPE_MAX)
            ok = bearer_ok(self.headers)
            if ENVELOPE_PATH.fullmatch(self.path) is None:
                return self.answer(404, b'{"error":"not found"}')
            body = data.decode("utf-8", "replace")
            headers = {name: redacted(name, value) for name, value in self.headers.items()}
            append(GLITCHTIP, {"path": self.path, "headers": headers, "bearer_ok": ok, "body": body})
            if not ok:
                return self.answer(404, b'{"error":"not found"}')
            return self.answer(200, json.dumps({"id": event_id(body)}).encode())


    def server(handler, address, tls=True):
        """One server; the mock gets TLS with the certificate this run made."""
        listener = ThreadingHTTPServer(address, handler)
        if tls and CERT.is_file() and KEY.is_file():
            context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
            context.load_cert_chain(str(CERT), str(KEY))
            listener.socket = context.wrap_socket(listener.socket, server_side=True)
        return listener


    def serve():
        STATE.mkdir(parents=True, exist_ok=True)
        mock = server(Mock, ("127.0.0.1", MOCK_PORT))
        proxy = server(Proxy, ("0.0.0.0", PROXY_PORT), tls=False)
        threading.Thread(target=mock.serve_forever, daemon=True).start()
        proxy.serve_forever()


    if __name__ == "__main__":
        serve()
