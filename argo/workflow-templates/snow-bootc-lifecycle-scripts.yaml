    # (frostyard/snosi#1130). A count above 0 on a known-defect kernel is the
    # upstream defect (rare on uncompressed objects, almost every extent on
    # compressed ones): recorded, not failed. Any other kernel with errors fails,
    # so a human checks whether that kernel has the fix. A compressed install
    # (an ISO that predates frostyard/firn#119) makes this near certain on 7.2.11.
    # A sysext failure keeps both probe records: report the failing units' journal
    # lines in the pod log, then judge after every boot of the plan.
    if [[ -n "$sysext_failures" ]]; then
      python3 - "$WORK/normalized.json" "$WORK/sysext-enable.json" "$WORK/sysext-reboot.json" >&2 <<'PY' || true
    import json, re, sys
    from pathlib import Path
    want = ('unit_inactive', 'unit_restarted', 'first_start_missing', 'first_start_not_run',
            'first_start_rerun', 'first_start_changed')
    def clean(value):
        # Guest text: never trust the guest's own sanitizer at this host boundary.
        if not isinstance(value, str):
            return None
        value = re.sub(r'[\x00-\x1f\x7f-\x9f\u2028\u2029]', '', value[:4096])
        value = re.sub(r'[0-9a-fA-F]{32,}', '[REDACTED]', value)
        return value[:240]
    manifest = json.loads(Path(sys.argv[1]).read_bytes()[:16384])
    probe = manifest['sysext_probe']
    known = set(probe['units']) | {entry['unit'] for entry in probe['first_start']}
    total = 0
    for name in sys.argv[2:]:
        try:
            data = json.loads(Path(name).read_bytes()[:1048576])
        except (OSError, ValueError):
            continue
        if not isinstance(data, dict):
            continue
        codes = data.get('failures')
        if not isinstance(codes, list):
            continue
        host = data.get('host_failures')
        codes = codes + (host if isinstance(host, list) else [])
        units = {code.split(':', 1)[1] for code in codes
                 if isinstance(code, str) and code.split(':', 1)[0] in want}
        for section in ('units', 'first_start'):
            entries = data.get(section)
            for unit, entry in (entries if isinstance(entries, dict) else {}).items():
                if not isinstance(entry, dict) or unit not in units or unit not in known:
                    continue
                # A failing unit's head comes first: the first cause of the
                # failure is its oldest line, not the tail (lab#165).
                for label, lines, limit in (('sysext_journal_head', entry.get('journal_head'), 40),
                                            ('sysext_journal', entry.get('journal'), 20)):
                    if not isinstance(lines, list):
                        continue
                    for line in lines[:limit]:
