    """Host-side gates and report for the report-only problems probe (plan T857 phase 1).

    This file never travels to the guest: the guest runs qa.py `problems`. It reads
    the one `SNOW_PROBLEMS_V1` record of the probed boot, validates it against the
    frozen collector contract of snosi ADR-0029, and reports what the probe saw. The
    gates come from the one ConfigMap copy of qa.py beside it.
    """
    import base64
    import json
    import os
    import re
    import sys
    from pathlib import Path

    sys.path.insert(0, str(Path(__file__).resolve().parent))
    from qa import (PROBLEMS_TOKEN_MAX, SERIAL_MAX, GateError, boot_id_valid, canonical,  # noqa: E402
                    full, load, marker_token, nonce_valid, pairs, require)

    # The record the guest publishes, and the bounds of every field in it.
    RECORD_FIELDS = set("phase nonce boot_id booted_digest path boot collector timer preset_reconcile coredump_user journal_dir core_pattern injected collector_runs problems details listing".split())
    BOOT_FIELDS = set("target firmware_ms loader_ms kernel_ms initrd_ms userspace_ms target_ms".split())
    BOOT_MS = BOOT_FIELDS - {"target"}
    DOC_KEYS = set("format schema generated image secure client problems".split())
    PROBLEM_KEYS = set("id kind detail week first_seen last_seen occurrences reportable".split())
    TOKEN = r"[a-z0-9_.-]{1,32}"
    NAME = r"[A-Za-z0-9@._-]{1,64}"
    MODE = r"0[0-7]{3}"
    UTC = r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z"
    HEX16 = r"[0-9a-f]{16}"
    # missing- plus all 11 check names is 76 characters: the bound leaves room.
    SUMMARY = re.compile(r"[a-z0-9+-]{1,96}")
    # The frozen copy of core's problem-report schema v1 (sha256 pinned in the tests).
    SCHEMA = Path(__file__).with_name("problem-report-v1.json")
    # The keyword subset of the v1 schema: anything else is refused, never guessed.
    KEYWORDS = set("$schema $id title description $defs type const enum pattern required properties additionalProperties "
                   "$ref allOf if then items minItems maxItems maxLength minimum maximum".split())
    TYPES = {"object": lambda v: type(v) is dict, "array": lambda v: type(v) is list,
             "string": lambda v: type(v) is str, "boolean": lambda v: type(v) is bool,
             "integer": lambda v: type(v) is int,
             "number": lambda v: type(v) is int or type(v) is float}


    # --------------------------------------------------------------- the validator

    def ecma(pattern):
        """ECMA-262 `$` matches only at the very end; Python's also matches before a newline."""
        out, index, inside = [], 0, False
        while index < len(pattern):
            char = pattern[index]
            if char == "\\" and index + 1 < len(pattern):
                out.append(pattern[index:index + 2])
                index += 2
                continue
            if char == "[":
                inside = True
            elif char == "]":
                inside = False
            elif char == "$" and not inside:
                char = "\\Z"
            out.append(char)
            index += 1
        return "".join(out)


    def validate(schema, value, root):
        """Validate a value against the v1 keyword subset; refuse an unknown keyword."""
        if schema is True:
            return
        require(schema is not False and type(schema) is dict, "schema_invalid")
        require(not set(schema) - KEYWORDS, "schema_keyword")
        if "$ref" in schema:
            name = schema["$ref"]
            require(type(name) is str and name.startswith("#/$defs/") and name[8:] in root["$defs"], "schema_ref")
            validate(root["$defs"][name[8:]], value, root)
        if "type" in schema:
            require(schema["type"] in TYPES and TYPES[schema["type"]](value), "schema_type")
        if "const" in schema:
            require(value == schema["const"] and type(value) is type(schema["const"]), "schema_const")
        if "enum" in schema:
            require(any(value == item and type(value) is type(item) for item in schema["enum"]), "schema_enum")
        if "pattern" in schema:
            require(type(value) is str and re.search(ecma(schema["pattern"]), value) is not None, "schema_pattern")
        if "maxLength" in schema:
            require(type(value) is str and len(value) <= schema["maxLength"], "schema_length")
        if "minimum" in schema:
            require(type(value) is int and value >= schema["minimum"], "schema_minimum")
        if "maximum" in schema:
            require(type(value) is int and value <= schema["maximum"], "schema_maximum")
        if type(value) is dict:
            for name in schema.get("required", []):
                require(name in value, "schema_required")
            properties = schema.get("properties", {})
            for name, item in value.items():
                if name in properties:
                    validate(properties[name], item, root)
                else:
                    validate(schema.get("additionalProperties", True), item, root)
        if type(value) is list:
            require(len(value) >= schema.get("minItems", 0), "schema_items")
            require(len(value) <= schema.get("maxItems", len(value)), "schema_items")
            if "items" in schema:
                for item in value:
                    validate(schema["items"], item, root)
        for part in schema.get("allOf", []):
            validate(part, value, root)
        if "if" in schema:
            try:
                validate(schema["if"], value, root)
            except GateError:
                return
            if "then" in schema:
                validate(schema["then"], value, root)


    # ------------------------------------------------------------- the record

    def record_shape(record):
        """Strict shape of one problems record: exact keys, types and bounds."""
        require(type(record) is dict and set(record) == RECORD_FIELDS, "record_fields")
        require(record["phase"] == "problems" and nonce_valid(record["nonce"]), "record_identity")
        require(record["path"] in ("fresh", "update") and full(r"[0-9a-f]{64}", record["booted_digest"]), "record_fields")
        require(boot_id_valid(record["boot_id"]), "boot_identity")
        boot = record["boot"]
        if boot is not None:
            require(type(boot) is dict and set(boot) == BOOT_FIELDS and full(NAME, boot["target"]), "record_boot")
            require(all(type(boot[key]) is int and 0 <= boot[key] <= 3600000 for key in BOOT_MS), "record_boot")
        require(type(record["collector"]) is bool, "record_fields")
        timer = record["timer"]
        require(type(timer) is dict and set(timer) == {"enabled", "active"}, "record_timer")
        require(all(full(TOKEN, value) for value in timer.values()), "record_timer")
        require(full(TOKEN, record["preset_reconcile"]), "record_fields")
        require(all(type(record[key]) is bool for key in ("coredump_user", "journal_dir", "core_pattern")), "record_fields")
        injected = record["injected"]
        if injected is not None:
            require(type(injected) is dict and set(injected) == {"unit", "stage", "crash", "app"}, "record_injected")
            require(all(type(injected[key]) is bool for key in ("unit", "crash", "app")), "record_injected")
            stage = injected["stage"]
            require(type(stage) is dict and set(stage) == {"outcome", "error_class"}, "record_injected")
            require(full(TOKEN, stage["outcome"]), "record_injected")
            require(stage["error_class"] is None or full(TOKEN, stage["error_class"]), "record_injected")
        runs = record["collector_runs"]
        if runs is not None:
            require(type(runs) is list and len(runs) == 2, "record_runs")
            require(all(type(code) is int and -128 <= code <= 255 for code in runs), "record_runs")
        document = record["problems"]
        if document is not None:
            require(type(document) is dict and set(document) == {"mode", "uid", "gid", "size", "doc", "leak"}, "record_problems")
            require(full(MODE, document["mode"]) and type(document["leak"]) is bool, "record_problems")
            require(all(type(document[key]) is int and 0 <= document[key] <= 2 ** 31 for key in ("uid", "gid", "size")), "record_problems")
            # Any JSON value: a collector document of the wrong type is a schema
            # finding of the report, never a refused record.
        details = record["details"]
        if details is not None:
            require(type(details) is dict and set(details) == {"mode", "uid", "group", "local_unit_id"}, "record_details")
            require(full(MODE, details["mode"]) and type(details["uid"]) is int and 0 <= details["uid"] <= 2 ** 31, "record_details")
            require(full(TOKEN, details["group"]), "record_details")
            require(details["local_unit_id"] is None or full(HEX16, details["local_unit_id"]), "record_details")
        listing = record["listing"]
        if listing is not None:
            require(type(listing) is dict and set(listing) == {"rc", "unit", "stage", "crash", "app"}, "record_listing")
            require(type(listing["rc"]) is int and -128 <= listing["rc"] <= 255, "record_listing")
            require(all(type(listing[key]) is bool for key in ("unit", "stage", "crash", "app")), "record_listing")


    def record_count(raw):
        """The one problems record the serial slice carries, by the SNOW_QA_V1 rules."""
        require(len(raw) <= SERIAL_MAX, "serial_size")
        lines = [line for line in raw.split(b"\n") if b"SNOW_QA_KMSG1" not in line]
        tail = rb"([A-Za-z0-9_-]{1,%d})" % (PROBLEMS_TOKEN_MAX + 64)
        # Identical copies collapse into one token; only a complete one is a record.
        tokens = {marker_token(line, b"SNOW_PROBLEMS_V1") for line in lines if b"SNOW_PROBLEMS_V1" in line}
        markers = {token for token in tokens if re.fullmatch(b"SNOW_PROBLEMS_V1 " + tail, token) is not None}
        require(markers or not tokens, "record_encoding")
        require(len(markers) == 1, "record_count")
        match = re.fullmatch(b"SNOW_PROBLEMS_V1 " + tail, sorted(markers)[0])
        require(match is not None, "record_encoding")
        encoded = match[1]
        try:
            decoded = base64.b64decode(encoded + b"=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
            require(base64.urlsafe_b64encode(decoded).rstrip(b"=") == encoded, "record_encoding")
            require(len(decoded) <= PROBLEMS_TOKEN_MAX, "record_size")
            record = json.loads(decoded, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(GateError("record_encoding")))
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_encoding") from exc
        return record


    def record_file(path):
        """One written problems record, read back and shape-checked."""
        try:
            raw = Path(path).read_bytes()
            require(len(raw) <= 65536, "record_size")
            data = json.loads(raw, object_pairs_hook=pairs)
        except (ValueError, UnicodeError) as exc:
            raise GateError("record_fields") from exc
        record_shape(data)
        return data


    def phase(m, name, nonce, prior, serial, destination):
        """The record of one probed boot: its identity, image and path, then evidence."""
        require("problems_probe" in m and name == "problems" and nonce_valid(nonce)
                and (prior == "none" or boot_id_valid(prior)), "phase_arguments")
        record = record_count(Path(serial).read_bytes())
        record_shape(record)
        require(record["phase"] == name and record["nonce"] == nonce, "record_identity")
        require(record["boot_id"] != prior, "boot_identity")
        require(record["path"] == m["problems_probe"]["path"], "probed_path")
        # fresh proves the installed N; update proves the first boot of N+1.
        image = m["image_n_plus_1"] if record["path"] == "update" else m["image_n"]
        require(record["booted_digest"] == image.rsplit(":", 1)[-1], "booted_image")
        with open(destination, "wb", opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
            stream.write(canonical(record))
        print(record["boot_id"])


    # --------------------------------------------------------------- the report

    def problem_ok(entry, root, document):
        """One problems.json record: its keys, its week, and its v1 envelope."""
        require(type(entry) is dict and set(entry) == PROBLEM_KEYS, "record_fields")
        require(full(HEX16, entry["id"]), "record_id")
        validate(root["properties"]["week"], entry["week"], root)
        require(all(full(UTC, entry[name]) for name in ("first_seen", "last_seen")), "record_time")
        require(type(entry["occurrences"]) is int and 1 <= entry["occurrences"] <= 2 ** 31, "record_occurrences")
        require(type(entry["reportable"]) is bool, "record_reportable")
        kind = entry["kind"]
        require(kind != "count", "record_kind")
        validate(root["properties"]["kind"], kind, root)
        # A detail holds only the properties of its kind, each valid in v1.
        known = root["$defs"][kind]["properties"]
        require(type(entry["detail"]) is dict and not set(entry["detail"]) - set(known), "record_detail")
        for name, value in entry["detail"].items():
            validate(known[name], value, root)
        if entry["reportable"]:
            # What snosi would send: the record in the report envelope of snosi ADR-0029.
            validate(root, {"schema": "frostyard.problem/1", "report_id": "00000000-0000-4000-8000-000000000000",
                            "week": entry["week"], "image": document["image"], "secure": document["secure"],
                            "client": document["client"], "kind": kind, "detail": entry["detail"]}, root)


    def document_ok(document, root):
        """The collector's problems.json against the frozen v1 contract."""
        try:
            require(type(document) is dict and set(document) == DOC_KEYS, "doc_fields")
            require(type(document["format"]) is int and document["format"] == 1, "doc_fields")
            require(document["schema"] == root["properties"]["schema"]["const"], "doc_fields")
            require(full(UTC, document["generated"]) and type(document["secure"]) is bool, "doc_fields")
            image = document["image"]
            require(type(image) is dict and set(image) == {"id", "version"}, "doc_image")
            if image["id"] is not None:
                validate(root["properties"]["image"]["properties"]["id"], image["id"], root)
            if image["version"] is not None:
                validate(root["$defs"]["image_version"], image["version"], root)
            if document["client"] is not None:
                validate(root["properties"]["client"], document["client"], root)
            require(type(document["problems"]) is list and len(document["problems"]) <= 200, "doc_problems")
            for entry in document["problems"]:
                problem_ok(entry, root, document)
        except GateError:
            return False
        return True


    def yes(value):
        return "yes" if value else "no"


    def report(m, path):
        """The one summary line, then the fixed detail lines; never a product failure."""
        record = record_file(path)
        root = json.loads(SCHEMA.read_bytes())
        problems, details, listing = record["problems"], record["details"], record["listing"]
        document = problems["doc"] if problems is not None else None
        listed = document.get("problems") if type(document) is dict else None
        entries = [entry for entry in listed if type(entry) is dict] if type(listed) is list else []
        injected = record["injected"]

        def recorded(kind, **fields):
            """True when 1 record has this kind and these detail values."""
            return any(entry.get("kind") == kind and type(entry.get("detail")) is dict
                       and all(entry["detail"].get(key) == value for key, value in fields.items())
                       for entry in entries)

        local = next((entry for entry in entries
                      if details is not None and entry.get("id") == details["local_unit_id"]), None)
        checks = {
            "file": problems is not None and problems["mode"] == "0644" and problems["uid"] == 0 and problems["gid"] == 0,
            "schema": document is not None and document_ok(document, root),
            "timer": record["timer"]["enabled"] == "enabled" and record["timer"]["active"] == "active",
            "coredump": record["coredump_user"] and record["core_pattern"],
            "journal": record["journal_dir"],
            "details": details is not None and details["mode"] == "0640" and details["uid"] == 0 and details["group"] == "sudo",
            # A local unit is never reportable, and its name is only in details.json.
            "unit": local is not None and local.get("kind") == "unit_failed"
                    and local.get("detail") == {"result": "exit-code"} and local.get("reportable") is False
                    and problems is not None and not problems["leak"],
            "stage": recorded("update_stage_failed", error_class="network"),
            "crash": recorded("crash", exe="sleep", signal="SIGSEGV"),
            "app": any(entry.get("kind") == "app_problem" and entry.get("reportable") is True
                       and type(entry.get("detail")) is dict
                       and (entry["detail"].get("app_id"), entry["detail"].get("app_version"), entry["detail"].get("code"))
                       == ("org.frostyard.nsl", "0.0.0-rc.857", "lab.injected_t857") for entry in entries),
        }
        if m["product"] == "floe":
            # Floe is the headless product; its listing is part of the proof there.
            checks["list"] = listing is not None and listing["rc"] == 0 and all(
                listing[key] for key in ("unit", "stage", "crash", "app"))
        if not record["collector"]:
            summary = "unproven-no-collector"
        elif problems is not None and document is None:
            summary = "unproven-too-large"
        else:
            failed = [name for name, passed in checks.items() if not passed]
            summary = "ok" if not failed else "missing-" + "+".join(failed)
        # The summary reaches checks.txt and the run reason: one grammar, one bound.
        require(SUMMARY.fullmatch(summary) is not None, "record_fields")
        print("problems=" + summary)
        print("path=%s collector=%s timer=%s/%s preset_reconcile=%s coredump_user=%s core_pattern=%s journal_dir=%s" % (
            record["path"], yes(record["collector"]), record["timer"]["enabled"], record["timer"]["active"],
            record["preset_reconcile"], yes(record["coredump_user"]), yes(record["core_pattern"]),
            yes(record["journal_dir"])))
        print("file=%s owner=%s schema=%s records=%d reportable=%d details=%s group=%s" % (
            problems["mode"] if problems is not None else "none",
            "%d:%d" % (problems["uid"], problems["gid"]) if problems is not None else "none",
            "none" if document is None else ("valid" if checks["schema"] else "invalid"),
            len(entries), sum(1 for entry in entries if entry.get("reportable") is True),
            details["mode"] if details is not None else "none",
            details["group"] if details is not None else "none"))
        print("injected unit=%s stage=%s crash=%s app=%s collector_runs=%s" % (
            yes(record["collector"] and injected["unit"]) if injected is not None else "no",
            "%s/%s" % (injected["stage"]["outcome"], injected["stage"]["error_class"] or "none")
            if injected is not None else "none/none",
            yes(injected["crash"]) if injected is not None else "no",
            yes(injected["app"]) if injected is not None else "no",
            ",".join(str(code) for code in record["collector_runs"])
            if record["collector_runs"] is not None else "none"))
        print("recorded unit=%s stage=%s crash=%s app=%s leak=%s" % (
            yes(checks["unit"]), yes(checks["stage"]), yes(checks["crash"]), yes(checks["app"]),
            yes(problems["leak"] if problems is not None else False)))
        print("list rc=%s unit=%s stage=%s crash=%s app=%s" % (
            listing["rc"] if listing is not None else "none",
            *(yes(listing[key]) if listing is not None else "no" for key in ("unit", "stage", "crash", "app"))))
        boot = record["boot"]
        if boot is None:
            print("boot target=none")
        else:
            print("boot target=%s firmware_ms=%d loader_ms=%d kernel_ms=%d initrd_ms=%d userspace_ms=%d target_ms=%d" % (
                boot["target"], boot["firmware_ms"], boot["loader_ms"], boot["kernel_ms"],
                boot["initrd_ms"], boot["userspace_ms"], boot["target_ms"]))


    def main(argv):
        try:
            require(len(argv) in (3, 7), "usage")
            if argv[0] == "phase" and len(argv) == 7:
                phase(load(argv[1], frozen=True), argv[2], argv[3], argv[4], argv[5], argv[6])
            elif argv[0] == "report" and len(argv) == 3:
                report(load(argv[1], frozen=True), argv[2])
            else:
                raise GateError("usage")
            return 0
        except (GateError, OSError, TypeError, KeyError, ValueError) as exc:
            code = str(exc) if isinstance(exc, GateError) and full(r"[a-z_]{1,40}", str(exc)) else "io_error"
            print("qa_failed:" + code, file=sys.stderr)
            return 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:]))
