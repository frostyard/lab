apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-incus-bootc-install-tests
  namespace: argo
  annotations:
    description: |
      Installs a published snosi bootc image to disk with `bootc install
      to-disk`, from the bootc live ISO, then boots the result and asserts it
      came up as a bootc host.

      snosi ships two install paths and both need coverage: the native A/B
      installer (run-incus-install-tests) and this one. They fail differently —
      native A/B is a signed sysupdate image with dm-verity, while bootc
      installs the OCI image itself and owns its own deployment layout — so
      neither lane substitutes for the other.

      Like the native lane, the guest is driven entirely through systemd
      credentials over SMBIOS type 11: the live ISO has no incus agent and no
      provisioned SSH key.
  labels:
    app.kubernetes.io/component: vm-test-runner
    app.kubernetes.io/part-of: snosi-test-suite
spec:
  templates:
  - name: run-incus-bootc-install-tests
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    activeDeadlineSeconds: 7200
    synchronization:
      semaphores:
      - configMapKeyRef:
          name: workflow-semaphores
          key: snosi-vm-qa
    inputs:
      parameters:
      - name: iso-url
        value: "https://repository.frostyard.org/isos/snow-live-latest.iso"
      # The MECHANICS image, not :latest. `bootc install to-disk` is the
      # mechanics tier and the guard below refuses anything
      # secureboot-capable=true, which :latest always is. snosi publishes
      # mechanics builds nightly under :mechanics for exactly this lane
      # (build-mechanics.yml); they carry no security evidence and are not for
      # installation. The secure install path is the firn install matrix
      # (run-firn-install-tests).
      - name: image
        value: "ghcr.io/frostyard/snow:mechanics"
      - name: variant
        value: "snow"
      # bootc installs the OCI image's own signed UKI/kernel; the same MOK
      # enrollment gap as the native lane applies, so Secure Boot is off here
      # too. See the README section on Secure Boot.
      - name: secureboot
        value: "false"
      - name: vm-cpus
        value: "4"
      # 8GiB. The bootc live ISO boots a full GNOME session — gnome-remote-desktop,
      # flatpak-portal, xdg-desktop-portal — and `bootc install` pulls a multi-GB
      # image alongside it. At 6GiB the guest OOM-killed session processes mid-pull.
      # The install survived, but a machine that tight is one unlucky allocation
      # from losing the install itself.
      - name: vm-memory
        value: "8GiB"
      - name: target-disk-size
        value: "40GiB"
      # Scratch block device for podman storage in the guest. Must stay smaller
      # than the target: the guest tells the two apart by size.
      # 60GiB of headroom. Sizes no longer discriminate target from scratch —
      # those are identified by incus device name — so this can be generous,
      # and the pool is sparse so it costs only what is used.
      - name: scratch-disk-size
        value: "60GiB"
      - name: iso-boot-timeout-seconds
        value: "600"
      - name: install-timeout-seconds
        value: "2400"
      # 900s: a bootc first boot does deployment finalization before reaching
      # multi-user, and 600s was marginal.
      - name: installed-boot-timeout-seconds
        value: "900"
      # Leave the guest running when the lane fails, instead of deleting it.
      # Pod logs are not a reliable diagnostic surface here: a failing run emits
      # a full kernel console plus a `set -x` install trace, and kubelet's log
      # rotation has already truncated the failure dump mid-write more than
      # once. A surviving guest can be attached to directly. Off by default so
      # scheduled runs cannot strand VMs holding host memory.
      - name: keep-on-failure
        value: "false"
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/results/result-summary.txt
          default: "No results generated"
      - name: checks
        valueFrom:
          path: /tmp/results/checks.txt
          default: "no checks recorded"
    script:
      image: docker.io/library/debian:trixie-slim
      securityContext:
        runAsUser: 0
      resources:
        requests: { cpu: "1", memory: 1Gi }
        limits: { cpu: "4", memory: 4Gi }
      env:
      - { name: PATH, value: "/usr/incus/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
      - { name: LD_LIBRARY_PATH, value: "/usr/incus/lib" }
      - { name: ISO_URL,   value: "{{inputs.parameters.iso-url}}" }
      - { name: IMAGE,     value: "{{inputs.parameters.image}}" }
      - { name: VARIANT,   value: "{{inputs.parameters.variant}}" }
      - { name: SECUREBOOT, value: "{{inputs.parameters.secureboot}}" }
      - { name: VM_CPUS,   value: "{{inputs.parameters.vm-cpus}}" }
      - { name: VM_MEMORY, value: "{{inputs.parameters.vm-memory}}" }
      - { name: TARGET_DISK_SIZE, value: "{{inputs.parameters.target-disk-size}}" }
      - { name: SCRATCH_DISK_SIZE, value: "{{inputs.parameters.scratch-disk-size}}" }
      - { name: ISO_BOOT_TIMEOUT, value: "{{inputs.parameters.iso-boot-timeout-seconds}}" }
      - { name: INSTALL_TIMEOUT,  value: "{{inputs.parameters.install-timeout-seconds}}" }
      - { name: INSTALLED_BOOT_TIMEOUT, value: "{{inputs.parameters.installed-boot-timeout-seconds}}" }
      - { name: KEEP_ON_FAILURE, value: "{{inputs.parameters.keep-on-failure}}" }
      - { name: DEBIAN_FRONTEND, value: noninteractive }
      volumeMounts:
      - { name: incus-bin,  mountPath: /usr/incus, readOnly: true }
      - { name: incus-sock, mountPath: /var/lib/incus/unix.socket }
      - { name: iso-cache,  mountPath: /var/lib/snosi-lab/iso }
      - { name: results,    mountPath: /tmp/results }
      command: [bash]
      source: |
        set -euo pipefail
        mkdir -p /tmp/results /var/lib/snosi-lab/iso
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl skopeo >/dev/null

        # ── image tier guard ─────────────────────────────────────────────────
        # `bootc install to-disk` is snosi's LEGACY MECHANICS tier. snosi's own
        # CI refuses to run it against a secure-assembly image — see
        # .github/workflows/test-install.yml, which hard-fails unless
        # io.snosi.bootc.secureboot-capable == false.
        #
        # A secureboot-capable=true image is installed by firn from its ISO
        # (run-firn-install-tests, driven by a recipe), never by this command. Installing one this way "succeeds" and then boots to
        # emergency mode. Verified directly: the resulting deployment's UKI
        # carries only `rw composefs=?<digest>`, so root discovery falls through
        # to gpt-auto, which never produces /dev/gpt-auto-root, so sysroot.mount
        # and bootc-root-setup.service both fail.
        #
        # Without this guard the lane burns ~20 minutes reaching that failure and
        # then reports it as a defect in snosi. It is not one — it is the wrong
        # install path for this image tier.
        CAPABILITY="$(skopeo inspect "docker://${IMAGE}" --format '{{ index .Labels "io.snosi.bootc.secureboot-capable" }}' 2>/dev/null || echo unknown)"
        echo "io.snosi.bootc.secureboot-capable=${CAPABILITY} for ${IMAGE}" >&2
        if [[ "${CAPABILITY}" != "false" ]]; then
          printf '%s' "NOT APPLICABLE: ${IMAGE} is secureboot-capable=${CAPABILITY}. bootc install to-disk is the mechanics tier and requires secureboot-capable=false; this image is installed by firn (run-firn-install-tests). See docs/roadmap.md." > /tmp/results/result-summary.txt
          cat /tmp/results/result-summary.txt >&2
          exit 1
        fi

        VM="qa-$(echo '{{workflow.name}}' | tail -c 40 | tr -cd 'a-z0-9-' | sed 's/^-*//')"
        SCRATCH_VOL="${VM}-scratch"
        cleanup() {
          rc=$?
          echo "--- teardown ---" >&2
          if [[ "${rc}" -ne 0 && "${KEEP_ON_FAILURE}" == "true" ]]; then
            echo "KEEP_ON_FAILURE: leaving guest ${VM} for inspection." >&2
            echo "  incus console ${VM} --show-log" >&2
            echo "  incus exec ${VM} -- bash" >&2
            echo "Delete it when done: incus delete --force ${VM} && incus storage volume delete lab ${SCRATCH_VOL}" >&2
            exit "${rc}"
          fi
          incus delete --force "${VM}" >/dev/null 2>&1 || true
          # Custom volumes outlive the instance they were attached to, so this
          # must be explicit or every run leaks its scratch disk.
          incus storage volume delete lab "${SCRATCH_VOL}" >/dev/null 2>&1 || true
          exit "${rc}"
        }
        trap cleanup EXIT

        M_BEGIN="SNOSI_QA__BOOTC_BEGIN"
        M_OK="SNOSI_QA__BOOTC_OK"
        M_FAIL="SNOSI_QA__BOOTC_FAIL"
        M_CHECK="SNOSI_QA__CHECK"
        M_DONE="SNOSI_QA__CHECKS_DONE"

        console_log() { incus console "${VM}" --show-log 2>/dev/null || true; }
        wait_for() {  # marker budget label [failmarker]
          local marker="$1" budget="$2" label="$3" deadline=$(( SECONDS + $2 ))
          while (( SECONDS < deadline )); do
            console_log | grep -qaF "${marker}" && { echo "  [${label}] saw ${marker}" >&2; return 0; }
            if [[ -n "${4:-}" ]] && console_log | grep -qaF "$4"; then
              echo "  [${label}] saw failure marker $4" >&2; return 1
            fi
            sleep 10
          done
          echo "  [${label}] timed out after ${budget}s waiting for ${marker}" >&2
          return 1
        }

        # ── ISO (moving name, so validate against the origin fingerprint) ────
        RESOLVED="$(curl -sSLI -o /dev/null -w '%{url_effective}' --max-time 60 "${ISO_URL}")"
        ISO_NAME="$(basename "${RESOLVED%%\?*}")"
        ISO_PATH="/var/lib/snosi-lab/iso/${ISO_NAME}"
        hdrs="$(curl -sSLI --max-time 60 "${RESOLVED}" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
        _etag="$(grep -m1 '^etag:' <<<"${hdrs}" | sed 's/^etag: *//' || true)"
        _len="$(grep -m1 '^content-length:' <<<"${hdrs}" | sed 's/^content-length: *//' || true)"
        if [[ -n "${_etag}" ]]; then fp="etag:${_etag}"; elif [[ -n "${_len}" ]]; then fp="len:${_len}"; else fp="unknown"; fi
        if [[ -s "${ISO_PATH}" && "$(cat "${ISO_PATH}.fingerprint" 2>/dev/null)" == "${fp}" && "${fp}" != unknown ]]; then
          echo "ISO cache hit: ${ISO_NAME}" >&2
        else
          echo "Downloading ${ISO_NAME}..." >&2
          curl -fSL --max-time 3600 -o "${ISO_PATH}.part" "${RESOLVED}"
          mv "${ISO_PATH}.part" "${ISO_PATH}"
          printf '%s' "${fp}" > "${ISO_PATH}.fingerprint"
        fi

        # ── the install unit ─────────────────────────────────────────────────
        # `bootc install to-disk` is run from a privileged container of the
        # image being installed — that is bootc's own documented flow, and it
        # means the image installs itself rather than the ISO installing it.
        # The heredoc delimiter is QUOTED. Unquoted, everything inside is
        # expanded by the POD shell before it ever reaches the guest — which
        # means a backtick in a *comment* is a command substitution that runs
        # here, as root, with the incus socket mounted. That was live: a
        # comment mentioning `bootc install --wipe` executed `bootc` in the
        # pod on every run ("bootc: command not found"). Quoting the delimiter
        # makes the body literal; the four values the guest genuinely needs
        # are seeded as assignments above it instead.
        INSTALL_SH="#!/bin/bash
        IMAGE='${IMAGE}'
        M_BEGIN='${M_BEGIN}'
        M_OK='${M_OK}'
        M_FAIL='${M_FAIL}'
        $(cat <<'SCRIPT'
        # -e matters here: without it a failed mkfs or mount passes silently and
        # the failure surfaces much later as an unrelated "no space" error.
        set -eux
        exec > >(tee /dev/console) 2>&1
        echo "${M_BEGIN}"
        for i in $(seq 1 30); do ip route get 1.1.1.1 >/dev/null 2>&1 && break; sleep 5; done
        # Two disks are attached, and neither is the ISO (type rom). The larger
        # is the install target; the smaller is scratch for container storage.
        # Identify disks by the incus device name embedded in their serial, not
        # by size. The size heuristic silently inverted target and scratch —
        # the run wiped the scratch disk and pointed podman at the install
        # target — because the root disk did not end up the larger of the two.
        ls -l /dev/disk/by-id/ || true
        DISK="$(readlink -f /dev/disk/by-id/*incus_root* 2>/dev/null | head -1)"
        SCRATCH="$(readlink -f /dev/disk/by-id/*incus_scratch* 2>/dev/null | head -1)"
        if [ -z "${DISK}" ] || [ -z "${SCRATCH}" ] || [ "${DISK}" = "${SCRATCH}" ]; then
          echo "${M_FAIL} could not identify disks by id (root=${DISK:-none} scratch=${SCRATCH:-none})"
          lsblk -o NAME,TYPE,SIZE,SERIAL; ls -l /dev/disk/by-id/ 2>/dev/null
          exit 1
        fi
        echo "target disk: ${DISK}"
        echo "scratch disk: ${SCRATCH}"

        # The live ISO's /var/lib/containers is RAM-backed, so pulling a
        # multi-GB bootc image there dies with "no space left on device" partway
        # through writing a layer. Give podman real storage on the scratch disk.
        # The target disk cannot serve: bootc install --wipe destroys it.
        # Mount the scratch disk AT /var/lib/containers, the same path bootc's
        # documented invocation binds into the container. The storage database
        # records absolute paths, so the store must appear at an identical path
        # inside and outside or nested podman fails with "database
        # configuration mismatch" (exit 125, surfacing as bootc's opaque
        # ExitStatus(32000) while "gathering source info").
        #
        # An earlier attempt moved this to a neutral path after the mount
        # appeared to vanish mid-run. That vanishing was a different bug: disk
        # selection had inverted target and scratch, so `bootc install --wipe`
        # was destroying the very disk holding the mount. With disks now
        # identified by incus device name, mounting here is correct.
        mkfs.ext4 -F -q "${SCRATCH}"
        mkdir -p /var/lib/containers
        mount "${SCRATCH}" /var/lib/containers
        findmnt -n /var/lib/containers || { echo "${M_FAIL} scratch did not mount"; lsblk; exit 1; }
        mkdir -p /var/lib/containers/storage /var/lib/containers/runroot
        df -h /var/lib/containers

        # Re-verify immediately before the pull: this is the exact window where
        # the mount was disappearing, so a failure here names the real cause
        # instead of surfacing as a space error minutes later.
        findmnt -n /var/lib/containers || { echo "${M_FAIL} scratch vanished before pull"; df -h; exit 1; }

        # --storage-driver overlay is load-bearing. Left to itself podman picked
        # vfs in this environment, which materializes a full copy of the tree
        # for every layer: a 6.5G image across 129 layers filled a 30G disk to
        # 100% and failed with "no space left on device". overlay shares layers
        # and needs roughly the image size.
        # Every podman invocation against this store must pass the SAME
        # root/runroot/driver triple. This probe originally omitted --runroot,
        # which recorded the default in the storage database and made the real
        # run fail with "database configuration mismatch".
        PODMAN_STORE=(--root /var/lib/containers/storage --runroot /var/lib/containers/runroot --storage-driver overlay)
        echo "storage driver: $(podman "${PODMAN_STORE[@]}" info --format '{{.Store.GraphDriverName}}' 2>/dev/null || echo unknown)"

        # Flags mirror snosi's own reference invocation in test/lib/vm.sh
        # (install_to_disk), which is the only supported shape for these images.
        # Deviating from it produces a system that installs cleanly and then
        # fails to boot, which reads like an image defect but is not one:
        #
        #   --composefs-backend  snosi's bootc images are composefs deployments.
        #                        Without this bootc lays down an ostree-style
        #                        deployment the image's own UKI cannot mount, and
        #                        the guest lands in emergency mode with no
        #                        /dev/gpt-auto-root. This single flag is what an
        #                        earlier version of this lane was missing.
        #   --filesystem btrfs   what snosi installs and validates against; the
        #                        composefs backend is exercised on btrfs only.
        #   --generic-image      no host-specific kargs/firmware assumptions,
        #                        correct for a VM target.
        #
        # --karg is deliberately NOT passed, even though snosi's reference
        # invocation carries `--karg console=ttyS0`. These images boot a
        # Type #2 UKI, whose kernel command line is baked in and signed, and
        # bootc refuses the combination outright:
        #
        #   Setting up UKI boot: Cannot use externally specified kernel
        #   arguments with UKI
        #
        # snosi's own Task 2 notes record the same constraint — "requires no
        # CLI kargs for a Type #2 UKI". Dropping it costs the serial console
        # on the installed system, so the post-install checks come back over
        # the incus agent rather than by scraping the console.
        #
        # --via-loopback is deliberately NOT passed: snosi's harness installs to
        # a raw *file* and needs it, this lane installs to a real block device.
        # Pull under a QA-scoped permissive policy, then run the local image.
        #
        # The live ISO ships /etc/containers/policy.json with a global `reject`
        # and a sigstoreSigned rule whose matchRepository scope covers all of
        # ghcr.io/frostyard/snow. Mechanics images live in that same repository
        # and are deliberately unsigned -- snosi's mechanics publisher is
        # secretless and holds no cosign key -- so the guest's podman refuses
        # the pull and bootc never runs (exit 125).
        #
        # Relaxing the policy for this one pull is the same thing snosi's own
        # test/lib/vm.sh does for fixture images. What it gives up is coverage
        # of the signature-policy path -- which is exactly what the secure lane
        # (run-secure-install-tests) exists to prove, and which the mechanics
        # tier explicitly does not claim. The host's own policy file is never
        # modified.
        cat > /run/qa-policy.json <<'POLICY'
        {"default":[{"type":"insecureAcceptAnything"}]}
        POLICY
        echo "pulling ${IMAGE} under a QA-scoped permissive policy" 
        podman "${PODMAN_STORE[@]}" pull --signature-policy /run/qa-policy.json "${IMAGE}"

        podman "${PODMAN_STORE[@]}" \
          run --rm --privileged --pid=host \
          --security-opt label=type:unconfined_t \
          -v /dev:/dev \
          -v /var/lib/containers:/var/lib/containers \
          "${IMAGE}" \
          bootc install to-disk \
            --wipe \
            --generic-image \
            --composefs-backend \
            --filesystem btrfs \
            "${DISK}" \
          && echo "${M_OK}" || { rc=$?; echo "df at failure:"; df -h; findmnt -n /var/lib/containers || echo "scratch UNMOUNTED at failure"; echo "${M_FAIL} rc=${rc}"; exit 1; }
        SCRIPT
        )"
        I_B64="$(printf '%s' "${INSTALL_SH}" | base64 -w0)"
        UNIT="[Unit]
        Description=snosi QA bootc install
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        TimeoutStartSec=0
        StandardOutput=journal+console
        StandardError=journal+console
        ExecStart=/bin/bash -c 'echo ${I_B64} | base64 -d > /run/qa-bootc.sh; chmod +x /run/qa-bootc.sh; /run/qa-bootc.sh'"
        DROPIN="[Unit]
        Wants=snosi-qa-bootc.service"
        U_B64="$(printf '%s' "${UNIT}"   | base64 -w0)"
        D_B64="$(printf '%s' "${DROPIN}" | base64 -w0)"

        echo "Creating VM (secureboot=${SECUREBOOT}, target ${TARGET_DISK_SIZE})..." >&2
        incus init "${VM}" --empty --vm \
          -c "security.secureboot=${SECUREBOOT}" \
          -c "limits.cpu=${VM_CPUS}" -c "limits.memory=${VM_MEMORY}" \
          -d "root,size=${TARGET_DISK_SIZE}"
        incus config device add "${VM}" vtpm tpm
        incus config device add "${VM}" installer disk \
          source="${ISO_PATH}" boot.priority=10 readonly=true

        # Scratch block volume for podman storage inside the guest. Deliberately
        # smaller than the target so the guest can tell them apart by size.
        incus storage volume create lab "${SCRATCH_VOL}" --type=block size="${SCRATCH_DISK_SIZE}" >/dev/null
        incus config device add "${VM}" scratch disk pool=lab source="${SCRATCH_VOL}"
        incus config set "${VM}" raw.qemu="-smbios type=11,value=io.systemd.credential.binary:systemd.extra-unit.snosi-qa-bootc.service=${U_B64} -smbios type=11,value=io.systemd.credential.binary:systemd.unit-dropin.multi-user.target=${D_B64}"

        incus start "${VM}"
        if ! wait_for "${M_BEGIN}" "${ISO_BOOT_TIMEOUT}" "iso-boot"; then
          console_log | tail -n 400 >&2
          printf '%s' "FAILED: bootc install never started from the live ISO" > /tmp/results/result-summary.txt
          exit 1
        fi
        if ! wait_for "${M_OK}" "${INSTALL_TIMEOUT}" "bootc-install" "${M_FAIL}"; then
          console_log | tail -n 400 >&2
          printf '%s' "FAILED: bootc install to-disk did not complete for ${IMAGE}" > /tmp/results/result-summary.txt
          exit 1
        fi

        # ── boot the installed system and assert it is a bootc host ──────────
        incus stop "${VM}" --force
        incus config device remove "${VM}" installer

        CHECK_SH=$(cat <<'SCRIPT'
        #!/bin/bash
        exec > >(tee /dev/console) 2>&1
        emit() { echo "SNOSI_QA__CHECK $1=$2"; }
        # A real bootc host reports a non-null booted deployment. On the live
        # ISO this same field is null, so it is what distinguishes an installed
        # system from the installer environment.
        if bootc status --json 2>/dev/null | grep -q '"booted"[[:space:]]*:[[:space:]]*{'; then
          emit booted ok; else emit booted MISSING; fi
        emit image "$(bootc status --json 2>/dev/null | tr ',' '\n' | grep -m1 -o 'ghcr.io/[^"]*' || echo unknown)"
        emit rootfs "$(findmnt -no FSTYPE / 2>/dev/null || echo unknown)"
        # A composefs-backend install has no /sysroot/ostree. Its state lives at
        # state/os/default on the root filesystem — the path snosi's own harness
        # writes into to seed SSH keys (test/lib/vm.sh). Accept either so this
        # reports the backend rather than failing the run on layout alone.
        if   [ -d /sysroot/state/os/default ] || [ -d /state/os/default ]; then emit backend composefs
        elif [ -d /sysroot/ostree ];                                       then emit backend ostree
        else                                                                    emit backend MISSING; fi
        emit osrelease "$(. /etc/os-release; echo "${IMAGE_ID:-?}-${IMAGE_VERSION:-?}")"
        echo "SNOSI_QA__CHECKS_DONE"
        SCRIPT
        )
        C_B64="$(printf '%s' "${CHECK_SH}" | base64 -w0)"
        CUNIT="[Unit]
        Description=snosi QA post-install checks
        After=multi-user.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        StandardOutput=journal+console
        StandardError=journal+console
        ExecStart=/bin/bash -c 'echo ${C_B64} | base64 -d > /run/qa-check.sh; chmod +x /run/qa-check.sh; /run/qa-check.sh'"
        CD="[Unit]
        Wants=snosi-qa-check.service"
        CU_B64="$(printf '%s' "${CUNIT}" | base64 -w0)"
        CD_B64="$(printf '%s' "${CD}"    | base64 -w0)"
        incus config set "${VM}" raw.qemu="-smbios type=11,value=io.systemd.credential.binary:systemd.extra-unit.snosi-qa-check.service=${CU_B64} -smbios type=11,value=io.systemd.credential.binary:systemd.unit-dropin.multi-user.target=${CD_B64}"

        incus start "${VM}"

        # Two channels, because the serial one may not exist. Dropping --karg
        # (see above) means the installed system's /dev/console is whatever the
        # baked-in UKI cmdline says, and for a bootc image that is not ttyS0 —
        # so the console scraping the native lane relies on can come back empty
        # through no fault of the guest. The incus agent is the channel that
        # does not depend on kernel arguments, and these images ship
        # enable-incus-agent.service, so prefer it and keep the console as a
        # fallback for the case where the agent never comes up.
        agent_ok=false
        deadline=$(( SECONDS + INSTALLED_BOOT_TIMEOUT ))
        ticks=0
        while (( SECONDS < deadline )); do
          if incus exec "${VM}" -- true >/dev/null 2>&1; then agent_ok=true; break; fi
          # Console markers still count: if the guest managed to report through
          # the SMBIOS unit, that is a complete answer and there is no reason to
          # keep waiting on the agent.
          if console_log | grep -qaF "${M_DONE}"; then break; fi
          # Say something every minute. A silent fifteen-minute wait that ends
          # in a timeout gives nothing to diagnose; the guest state and console
          # size together show whether it is booting, stuck, or dead.
          if (( ticks % 6 == 0 )); then
            echo "  [installed-boot] ${SECONDS}s state=$(incus list "${VM}" --format csv -c s 2>/dev/null || echo ?) console=$(console_log | wc -c)B" >&2
          fi
          ticks=$(( ticks + 1 ))
          sleep 10
        done

        # Always capture the console, whatever happened. With --karg gone this
        # may legitimately be empty, but "empty" is itself the finding.
        console_log > /tmp/results/console.log 2>/dev/null || true
        echo "--- installed-system console (${?}; $(wc -c < /tmp/results/console.log) bytes) ---" >&2
        tail -n 200 /tmp/results/console.log >&2 || true
        echo "--- guest state: $(incus list "${VM}" --format csv -c s 2>/dev/null || echo UNKNOWN) ---" >&2

        if [[ "${agent_ok}" == true ]]; then
          echo "  [installed-boot] incus agent responded" >&2
          incus exec "${VM}" -- bash -s <<'PROBE' > /tmp/results/agent-checks.txt 2>/dev/null || true
        emit() { echo "$1=$2"; }
        if bootc status --json 2>/dev/null | grep -q '"booted"[[:space:]]*:[[:space:]]*{'; then
          emit booted ok; else emit booted MISSING; fi
        emit image "$(bootc status --json 2>/dev/null | tr ',' '\n' | grep -m1 -o 'ghcr.io/[^"]*' || echo unknown)"
        emit rootfs "$(findmnt -no FSTYPE / 2>/dev/null || echo unknown)"
        if   [ -d /sysroot/state/os/default ] || [ -d /state/os/default ]; then emit backend composefs
        elif [ -d /sysroot/ostree ];                                       then emit backend ostree
        else                                                                    emit backend MISSING; fi
        emit osrelease "$(. /etc/os-release; echo "${IMAGE_ID:-?}-${IMAGE_VERSION:-?}")"
        emit failedunits "$(systemctl list-units --state=failed --no-legend --plain 2>/dev/null | wc -l)"
        PROBE
        fi

        # Union both channels. Whichever answered, the downstream assertions
        # read one file.
        # The trailing `|| true` is load-bearing. When neither channel reported,
        # `grep` matches nothing and exits 1; under `set -o pipefail` that fails
        # the whole pipeline and `set -e` kills the script *before* the
        # diagnostic below can run — so a lane that had nothing to say died
        # silently instead of saying so. Third instance of this shape in this
        # repo; see docs/roadmap.md A5.
        { cat /tmp/results/agent-checks.txt 2>/dev/null || true
          console_log | grep -aoE "${M_CHECK} [a-z]+=[^[:space:]]+" | sed "s/${M_CHECK} //" || true
        } | grep -E '^[a-z]+=' | sort -u > /tmp/results/checks.txt || true

        if [[ ! -s /tmp/results/checks.txt ]]; then
          echo "--- neither the agent nor the console reported; console tail ---" >&2
          console_log | tail -n 400 >&2
          printf '%s' "FAILED: bootc-installed ${VARIANT} did not boot or report checks" > /tmp/results/result-summary.txt
          exit 1
        fi
        echo "--- post-install checks ---" >&2
        cat /tmp/results/checks.txt >&2

        grep -q '^booted=ok$' /tmp/results/checks.txt || {
          printf '%s' "FAILED: installed system does not report a booted bootc deployment" \
            > /tmp/results/result-summary.txt
          exit 1
        }

        printf '%s' "bootc installed and verified: ${IMAGE} (secureboot=${SECUREBOOT})" \
          > /tmp/results/result-summary.txt
        cat /tmp/results/result-summary.txt >&2
    volumes:
    - { name: incus-bin,  hostPath: { path: /usr/incus, type: Directory } }
    - { name: incus-sock, hostPath: { path: /var/lib/incus/unix.socket, type: Socket } }
    - { name: iso-cache,  hostPath: { path: /var/lib/snosi-lab/iso, type: DirectoryOrCreate } }
    - { name: results,    emptyDir: {} }
