apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-firn-install-tests
  namespace: argo
  annotations:
    description: |
      Runs firn unattended in a VM for one bootc cell (image x encryption x
      secure-boot), using an explicitly supplied installer ISO URL and SHA-256
      pin, then boots the result and asserts on what it produced.

      An empty UEFI VM + vTPM boots the verified firn installer ISO. A generated
      recipe TOML drives `firn install` non-interactively, and the installed system
      is booted to prove it came up (for encrypted cells, coming up IS the
      TPM/passphrase-unlock proof). One cell per invocation; the matrix is a
      fan-out in firn-install-test.yaml.

      Driving a guest with no agent and no SSH: systemd reads SMBIOS type-11
      credentials, so the lane injects the install unit + a multi-user.target
      drop-in and the guest installs itself at boot. Progress returns on the
      serial console — the only channel that exists before the disk is written.
  labels:
    app.kubernetes.io/component: vm-test-runner
    app.kubernetes.io/part-of: snosi-test-suite
spec:
  templates:
  - name: run-firn-install-tests
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    activeDeadlineSeconds: 7200
    synchronization:
      semaphores:
      - configMapKeyRef:
          name: workflow-semaphores
          key: snosi-vm-qa
    inputs:
      parameters:
      # Explicit immutable installer ISO and its SHA-256 pin (ADR-0010).
      - name: iso-url
      - name: iso-sha256
      - name: image-digest
      # Install family — only bootc is supported.
      - name: family
        value: "bootc"
      # Bare image name: floe | snow | snowfield; bootc OCI ref.
      - name: image
        value: "floe"
      # recipe [security] encryption: none | luks-passphrase | tpm2-luks |
      # tpm2-luks-passphrase.
      - name: encryption
        value: "none"
      # Secure Boot ON and genuinely enforced (Microsoft KEK/db untouched).
      # mok = "enroll" -- firn stages the shim -> MOK-signed
      # systemd-boot -> MokManager ESP chain and runs mokutil (secure-install
      # schema-1, firn ADR-0014); the lane completes enrollment host-side after
      # install (virt-fw-vars --add-mok + clear MokNew), the MokManager keypress
      # stand-in. NOT a pre-seed masquerade: the boot succeeds only if the staged
      # chain is firn's. Proven end to end 2026-08-12.
      - name: secureboot
        value: "false"
      - name: vm-cpus
        value: "4"
      # 8GiB: bootc pulls the OCI image; firn redirects the podman store to the
      # target disk on the RAM ISO (ADR-0012), but keep headroom for the guest.
      - name: vm-memory
        value: "8GiB"
      # 40GiB: snow bootc + deployment coexist with the transfer store during
      # install (ADR-0012 space note).
      - name: target-disk-size
        value: "40GiB"
      - name: iso-boot-timeout-seconds
        value: "420"
      - name: install-timeout-seconds
        value: "2400"
      # 900: the post-install probe also scans the composefs objects and runs
      # the kernel canary (see the fsverity-probe block).
      - name: installed-boot-timeout-seconds
        value: "900"
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/results/result-summary.txt
          default: "No results generated"
      - name: checks
        valueFrom:
          path: /tmp/results/checks.txt
          default: "no checks recorded"
    script:
      image: docker.io/library/debian:trixie-slim
      securityContext:
        runAsUser: 0
      resources:
        requests: { cpu: "1", memory: 1Gi }
        limits: { cpu: "4", memory: 4Gi }
      env:
      - { name: PATH, value: "/usr/incus/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
      - { name: LD_LIBRARY_PATH, value: "/usr/incus/lib" }
      - { name: ISO_URL,    value: "{{inputs.parameters.iso-url}}" }
      - { name: ISO_SHA256, value: "{{inputs.parameters.iso-sha256}}" }
      - { name: IMAGE_DIGEST, value: "{{inputs.parameters.image-digest}}" }
      - { name: FAMILY,     value: "{{inputs.parameters.family}}" }
      - { name: IMAGE,      value: "{{inputs.parameters.image}}" }
      - { name: ENC,        value: "{{inputs.parameters.encryption}}" }
      - { name: SECUREBOOT, value: "{{inputs.parameters.secureboot}}" }
      - { name: VM_CPUS,    value: "{{inputs.parameters.vm-cpus}}" }
      - { name: VM_MEMORY,  value: "{{inputs.parameters.vm-memory}}" }
      - { name: TARGET_DISK_SIZE, value: "{{inputs.parameters.target-disk-size}}" }
      - { name: ISO_BOOT_TIMEOUT, value: "{{inputs.parameters.iso-boot-timeout-seconds}}" }
      - { name: INSTALL_TIMEOUT,  value: "{{inputs.parameters.install-timeout-seconds}}" }
      - { name: INSTALLED_BOOT_TIMEOUT, value: "{{inputs.parameters.installed-boot-timeout-seconds}}" }
      - { name: DEBIAN_FRONTEND, value: noninteractive }
      volumeMounts:
      - { name: incus-pools, mountPath: /var/lib/incus/storage-pools }
      - { name: incus-bin,  mountPath: /usr/incus, readOnly: true }
      - { name: incus-sock, mountPath: /var/lib/incus/unix.socket }
      - { name: iso-cache,  mountPath: /var/lib/snosi-lab/iso }
      - { name: results,    mountPath: /tmp/results }
      command: [bash]
      source: |
        set -euo pipefail
        mkdir -p /tmp/results /var/lib/snosi-lab/iso
        CELL="${FAMILY}/${IMAGE}/${ENC}/sb=${SECUREBOOT}"
        echo "=== firn install matrix cell: ${CELL} ===" >&2
        VM="fq-$(echo '{{workflow.name}}' | tail -c 40 | tr -cd 'a-z0-9-' | sed 's/^-*//')"
        cleanup() {
          rc=$?
          echo "--- teardown ${VM} ---" >&2
          incus delete --force "${VM}" >/dev/null 2>&1 || true
          exit "${rc}"
        }
        trap cleanup EXIT

        FIRN_VERSION=not_reached   # replaced once the installer boots
        fail() {
          printf '%s' "FAILED: $1:$2 (${CELL}) firn=${FIRN_VERSION}" > /tmp/results/result-summary.txt
          exit 1
        }

        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl python3 >/dev/null
        if [[ "${SECUREBOOT}" == "true" ]]; then
          # virt-fw-vars enrolls the snosi MOK into the guest varstore under
          # Secure Boot AFTER install (mok = "enroll") -- firn stages
          # the MOK-signed ESP chain and mokutil leaves a pending MokNew, which
          # we resolve host-side (the MokManager keypress stand-in, ADR-0014).
          apt-get install -y -qq --no-install-recommends git gcc python3 python3-dev libc6-dev python3-pip >/dev/null \
            || fail mok dependencies
          pip install --quiet --break-system-packages virt-firmware || fail mok virt_firmware_install
          command -v virt-fw-vars >/dev/null || fail mok virt_fw_vars_unavailable
        fi

        M_BEGIN="FIRN_QA__INSTALL_BEGIN"
        M_OK="FIRN_QA__INSTALL_OK"
        M_FAIL="FIRN_QA__INSTALL_FAIL"
        M_CHECK="FIRN_QA__CHECK"
        M_DONE="FIRN_QA__CHECKS_DONE"

        console_log() { incus console "${VM}" --show-log 2>/dev/null || true; }
        wait_for() {  # marker, timeout, label, [failure-marker]
          local marker="$1" budget="$2" label="$3" deadline=$(( SECONDS + $2 ))
          while (( SECONDS < deadline )); do
            if console_log | grep -qaF "${marker}"; then
              echo "  [${label}] saw ${marker}" >&2; return 0
            fi
            if [[ -n "${4:-}" ]] && console_log | grep -qaF "$4"; then
              echo "  [${label}] saw failure marker $4" >&2; return 1
            fi
            sleep 10
          done
          echo "  [${label}] timed out after ${budget}s waiting for ${marker}" >&2
          return 1
        }

        # --- BEGIN iso-pin ---
        [[ "${FAMILY}" == bootc ]] || fail params family_unsupported
        [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail params image_digest_param
        [[ "${ISO_SHA256}" =~ ^[0-9a-f]{64}$ ]] || fail iso sha256_param
        [[ -n "${ISO_URL}" ]] || fail iso url_param
        RESOLVED="$(curl -sSLI -o /dev/null -w '%{url_effective}' --max-time 60 "${ISO_URL}")" \
          || fail iso resolve
        ISO_NAME="$(basename "${RESOLVED%%\?*}")"
        ISO_PATH="/var/lib/snosi-lab/iso/${ISO_NAME}"
        if [[ -s "${ISO_PATH}" ]]; then
          echo "Installer ISO cached: ${ISO_NAME}" >&2
          if ! printf '%s  %s\n' "${ISO_SHA256}" "${ISO_PATH}" | sha256sum -c --status; then
            rm -f "${ISO_PATH}"
            fail iso sha256_mismatch
          fi
        else
          echo "Downloading ${ISO_NAME}..." >&2
          rm -f "${ISO_PATH}"
          if ! curl -fSL --max-time 3600 -o "${ISO_PATH}.part" "${RESOLVED}"; then
            rm -f "${ISO_PATH}.part"
            fail iso download
          fi
          if ! printf '%s  %s\n' "${ISO_SHA256}" "${ISO_PATH}.part" | sha256sum -c --status; then
            rm -f "${ISO_PATH}.part" "${ISO_PATH}"
            fail iso sha256_mismatch
          fi
          mv "${ISO_PATH}.part" "${ISO_PATH}"
        fi
        # --- END iso-pin ---

        # ── the unit the guest will run ──────────────────────────────────────
        # The recipe is generated IN the guest: the target disk is only knowable
        # there. IMAGE/ENC/SECUREBOOT are baked in as literals
        # (pod-side expansion); DISK and $? are escaped for guest evaluation.
        INSTALL_SH=$(cat <<SCRIPT
        #!/bin/bash
        exec > >(tee /dev/console /dev/ttyS0 2>/dev/null) 2>&1
        # Record which Firn the installer ISO carries, so a run ties to a release.
        echo "FIRN_QA__FIRN_VERSION=\$(firn --version 2>/dev/null | head -n 1 | tr -s ' ' '_' || true)"
        echo "${M_BEGIN}"
        set -x
        # Target = the one writable disk. The installer ISO is attached
        # read-only, so it is RO=1 (or a rom) and excluded.
        DISK=\$(lsblk -dnpo NAME,RO,TYPE | awk '\$3=="disk" && \$2=="0"{print \$1; exit}')
        if [ -z "\${DISK}" ]; then
          echo "${M_FAIL} no writable target disk:"; lsblk -o NAME,RO,TYPE,SIZE; exit 1
        fi
        echo "target disk: \${DISK}"

        # ── generate the recipe for this cell ──
        {
          echo 'version = 1'
          echo '[image]'
          echo 'family = "bootc"'
          echo 'ref = "ghcr.io/frostyard/${IMAGE}:latest"'
          echo '[target]'
          echo "disk = \"\${DISK}\""
          echo 'filesystem = "btrfs"'
          echo 'btrfs_subvolumes = true'
          echo '[security]'
          echo 'encryption = "${ENC}"'
          case "${ENC}" in
            *-passphrase) echo 'passphrase_file = "/run/firn-qa-pass.txt"' ;;
          esac
          if [ "${SECUREBOOT}" = true ]; then
            echo 'mok = "enroll"'
            echo 'mok_password_file = "/run/firn-qa-mok.pass"'
          fi
          echo '[system]'
          echo 'hostname = "firn-qa"'
        } > /run/firn-qa-recipe.toml
        echo "--- recipe ---"; cat /run/firn-qa-recipe.toml

        case "${ENC}" in
          *-passphrase) printf 'firn-qa-passphrase' > /run/firn-qa-pass.txt; chmod 600 /run/firn-qa-pass.txt ;;
        esac
        # bootc + Secure Boot: firn's mok-stage needs a one-time MokManager
        # password file (mok = "enroll"). The harness completes enrollment
        # host-side after install, so the value is never typed -- but firn
        # validates its presence. Created in the guest so it never crosses SMBIOS.
        if [ "${SECUREBOOT}" = true ]; then
          openssl rand -hex 8 > /run/firn-qa-mok.pass
          chmod 600 /run/firn-qa-mok.pass
        fi

        # ── flags ──
        TPM=off; case "${ENC}" in tpm2*) TPM=on ;; esac
        SBF=off; [ "${SECUREBOOT}" = true ] && SBF=on

        if firn install /run/firn-qa-recipe.toml \
             --confirm "\${DISK}" \
             --uefi on --secure-boot "\${SBF}" --tpm "\${TPM}" \
             --json-progress; then
          echo "${M_OK}"
        else
          rc=\$?
          # Fail fast: the script's stdout goes through exec > >(tee /dev/ttyS0)
          # (process substitution), and bash does NOT wait for that tee on
          # exit -- so this final marker line was being dropped, leaving install
          # failures to hang until INSTALL_TIMEOUT (~40m) instead of aborting in
          # seconds. Write the marker straight to the serial device and flush so
          # the pod's wait_for sees it immediately.
          echo "${M_FAIL} rc=\${rc}"
          echo "${M_FAIL} rc=\${rc}" > /dev/ttyS0 2>/dev/null || true
          sync; sleep 3
          exit 1
        fi
        SCRIPT
        )
        INSTALL_B64="$(printf '%s' "${INSTALL_SH}" | base64 -w0)"

        UNIT="[Unit]
        Description=firn QA unattended install
        After=live-ready.service network-online.target
        Wants=network-online.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        StandardOutput=journal+console
        StandardError=journal+console
        ExecStart=/bin/bash -c 'echo ${INSTALL_B64} | base64 -d > /run/qa-install.sh; chmod +x /run/qa-install.sh; /run/qa-install.sh'"
        DROPIN="[Unit]
        Wants=firn-qa-install.service"
        U_B64="$(printf '%s' "${UNIT}"   | base64 -w0)"
        D_B64="$(printf '%s' "${DROPIN}" | base64 -w0)"

        # ── create and run ───────────────────────────────────────────────────
        echo "Creating VM (secureboot=${SECUREBOOT}, target ${TARGET_DISK_SIZE})..." >&2
        incus init "${VM}" --empty --vm \
          -c "security.secureboot=${SECUREBOOT}" \
          -c "limits.cpu=${VM_CPUS}" -c "limits.memory=${VM_MEMORY}" \
          -d "root,size=${TARGET_DISK_SIZE}" || fail vm init_failed
        POOL="$(incus query "/1.0/instances/${VM}" | python3 -c 'import json,sys; pool=json.load(sys.stdin)["expanded_devices"]["root"]["pool"]; print(pool) if isinstance(pool,str) and pool else sys.exit("Incus root pool must be a non-empty string")')" \
          || { echo "Could not resolve Incus root pool for ${VM}" >&2; fail vm pool_unavailable; }
        [[ "${POOL}" =~ ^[A-Za-z0-9._-]+$ ]] \
          || { echo "Invalid Incus root pool: ${POOL}" >&2; fail vm pool_invalid; }
        incus config device add "${VM}" vtpm tpm || fail vm device_attach_failed
        incus config device add "${VM}" installer disk \
          source="${ISO_PATH}" boot.priority=10 readonly=true || fail vm device_attach_failed
        incus config set "${VM}" raw.qemu="-smbios type=11,value=io.systemd.credential.binary:systemd.extra-unit.firn-qa-install.service=${U_B64} -smbios type=11,value=io.systemd.credential.binary:systemd.unit-dropin.multi-user.target=${D_B64}" || fail vm config_failed

        incus start "${VM}" || fail vm start_failed
        echo "Waiting for the installer to start..." >&2
        if ! wait_for "${M_BEGIN}" "${ISO_BOOT_TIMEOUT}" "iso-boot"; then
          console_log | tail -n 400 >&2
          fail iso_boot timeout
        fi

        # --- BEGIN firn-version ---
        # Recorded, not judged. unknown = the installer printed no version.
        FIRN_VERSION="$(console_log | tr -d '\r' | grep -aoE 'FIRN_QA__FIRN_VERSION=[^[:space:]]+' | tail -n 1 | cut -d= -f2- || true)"
        FIRN_VERSION="${FIRN_VERSION:-unknown}"
        # --- END firn-version ---

        echo "Installer running; waiting up to ${INSTALL_TIMEOUT}s..." >&2
        if ! wait_for "${M_OK}" "${INSTALL_TIMEOUT}" "install" "${M_FAIL}"; then
          echo "--- console tail (install failed) ---" >&2
          console_log | tail -n 400 >&2
          if console_log | grep -qaF "${M_FAIL}"; then
            rc="$(console_log | grep -aoE 'FIRN_QA__INSTALL_FAIL rc=[0-9]+' | tail -n 1 | cut -d= -f2 || true)"
            fail install "firn_rc_${rc:-unknown}"
          fi
          fail install timeout
        fi
        echo "Install reported success." >&2

        # ── boot what was installed ──────────────────────────────────────────
        # Detach the ISO so firmware falls through to the freshly written ESP.
        # For encrypted cells, booting at all IS the TPM/passphrase-unlock proof.
        incus stop "${VM}" --force || fail vm stop_failed
        incus config device remove "${VM}" installer || fail vm device_detach_failed

        # ── Secure Boot: complete MOK enrollment host-side ────────────────────
        # firn (mok = "enroll") staged the shim -> MOK-signed systemd-boot ->
        # MokManager ESP chain and mokutil left a pending MokNew in the guest
        # varstore. On real hardware the user types the one-time password at
        # MokManager on first boot; unattended we finish it host-side (ADR-0014):
        # add the snosi MOK to MokList so shim trusts firn's second stage, and
        # delete the pending MokNew/MokAuth so shim does not launch MokManager
        # (which would hang with no one to answer). Booting under enforced
        # Secure Boot then proves firn's staged chain is what firmware accepts.
        if [[ "${SECUREBOOT}" == "true" ]]; then
          echo "Completing MOK enrollment for the bootc secure boot..." >&2
          [[ -d /src/snosi ]] || git clone -q --depth 1 https://github.com/frostyard/snosi.git /src/snosi || fail mok checkout
          MOK_CERT=/src/snosi/shared/native-ab/keys/mok-2026.crt
          [[ -f "${MOK_CERT}" ]] || fail mok certificate_missing
          NVRAM="/var/lib/incus/storage-pools/${POOL}/virtual-machines/${VM}/qemu.nvram"
          [[ -e "${NVRAM}" ]] || fail mok varstore_missing
          MOK_GUID="$(python3 -c 'import uuid; print(uuid.uuid4())')" || fail mok uuid
          virt-fw-vars --inplace "${NVRAM}" --add-mok "${MOK_GUID}" "${MOK_CERT}" -d MokNew -d MokAuth \
            || fail mok enrollment
          virt-fw-vars -i "${NVRAM}" -p 2>&1 | grep -q MokList \
            || fail mok moklist_missing
          echo "MOK enrolled into $(basename "${NVRAM}") (MokNew cleared) as owner ${MOK_GUID}" >&2
        fi

        CHECK_SH=$(cat <<SCRIPT
        #!/bin/bash
        # The pod reads only the serial log, and /dev/console on the guest is
        # tty0. serial-getty@ttyS0 (Type=idle, TTYVHangup=yes) runs vhangup on
        # ttyS0 and revokes every fd opened before it, so a long-lived
        # pipe to ttyS0 loses the rest of the output. Open /dev/ttyS0 afresh for each
        # write, and replay all results after the getty TTY setup is done.
        # See frostyard/snosi#1123. Stdout stays in the journal.
        : > /run/firn-qa-checks.txt || true
        emit() {
          local line="${M_CHECK} \$1=\$2"
          printf '%s\n' "\$line" >> /run/firn-qa-checks.txt || true
          printf '%s\n' "\$line"
          printf '%s\n' "\$line" > /dev/ttyS0 2>/dev/null || true
        }
        emit booted ok
        emit rootfs "\$(findmnt -no FSTYPE / 2>/dev/null || echo unknown)"
        # On a composefs bootc root, / is an overlay; the disk filesystem is /sysroot.
        emit sysroot "\$(findmnt -no FSTYPE /sysroot 2>/dev/null || echo unknown)"
        emit osrelease "\$(. /etc/os-release 2>/dev/null; echo "\${IMAGE_ID:-unknown}")"
        if lsblk -o FSTYPE 2>/dev/null | grep -qi crypto_LUKS; then emit luks present; else emit luks absent; fi
        if command -v bootc >/dev/null 2>&1; then
          emit bootc "\$(bootc --version 2>/dev/null | head -1 | tr ' ' '_')"
        else
          emit bootc absent
        fi
        # --- BEGIN login-poll ---
        LOGIN_WAIT_SECONDS=300
        deadline=\$((SECONDS+LOGIN_WAIT_SECONDS))
        LOGIN_UNIT=none
        while :; do
          DISPLAY_STATE="\$(timeout 10 systemctl is-active display-manager.service 2>/dev/null || true)"
          LOGIN="\$(timeout 10 systemctl is-active getty@tty1.service 2>/dev/null || true)"
          SERIAL="\$(timeout 10 systemctl is-active serial-getty@ttyS0.service 2>/dev/null || true)"
          if [[ "\${DISPLAY_STATE}" == active ]]; then
            LOGIN_UNIT=display-manager.service
          elif [[ "\${LOGIN}" == active ]]; then
            LOGIN_UNIT=getty@tty1.service
          elif [[ "\${SERIAL}" == active ]]; then
            LOGIN_UNIT=serial-getty@ttyS0.service
          fi
          if [[ "\${LOGIN_UNIT}" != none ]]; then LOGIN=active; break; fi
          if (( SECONDS >= deadline )); then break; fi
          sleep 2 || true
        done
        emit login "\${LOGIN:-unknown}"
        emit login_unit "\${LOGIN_UNIT}"
        # --- END login-poll ---
        BOOTC_STATUS="\$(timeout 120 bootc status --json 2>/dev/null || true)"
        BOOTC_FIELDS="\$(printf '%s' "\${BOOTC_STATUS}" | python3 -c '
        import json, sys
        try:
            host = json.load(sys.stdin)
            image = host["status"]["booted"]["image"]
            booted_ref = image.get("image")
            ref = booted_ref.get("image") if isinstance(booted_ref, dict) else None
            if not ref:
                ref = host["spec"]["image"]["image"]
            digest = image["imageDigest"]
            if not isinstance(ref, str) or not ref or not isinstance(digest, str) or not digest:
                raise ValueError("missing image or digest")
            print(ref, digest, sep="\n")
        except Exception:
            print("unknown\nunknown")
        ' )"
        emit bootc_image "\$(printf '%s\n' "\${BOOTC_FIELDS}" | head -n 1)"
        emit bootc_digest "\$(printf '%s\n' "\${BOOTC_FIELDS}" | tail -n 1)"
        # --- BEGIN fsverity-probe ---
        # frostyard/snosi#1130: Debian kernels 7.2.11 and 7.2.12 verify a whole
        # large folio of a btrfs fs-verity file before all of it is read and log
        # "fs-verity ... FILE CORRUPTED! ... level=-1". The synchronous re-read
        # succeeds, so no bad bytes reach user space. Upstream fix: kdave/linux
        # dcf8811f63af ("btrfs: fix the fsverity callback where unexpected range
        # is verified"). COMPRESSED extents hit it on almost every extent: our
        # trigger was Firn mounting the install target with compress=zstd:1,
        # which compressed the install-time composefs objects
        # (frostyard/firn#119), so cfs_compressed_objects is judged. UNCOMPRESSED
        # files hit it rarely, when a large folio spans two bios at an extent
        # boundary, so fsverity_errors is judged against a known-defect kernel
        # list (see the judge). Kernel logs are only read, never filtered or
        # cleared.
        fsverity_count() {
          local log trimmed
          # -q: no "-- No entries --" banner. Empty output, or only that banner,
          # means no kernel entry was read, so the count is unknown, never 0.
          log="\$(timeout 20 journalctl -q -k -b --no-pager 2>/dev/null)" || return 1
          trimmed="\${log//[[:space:]]/}"
          [[ -n "\${trimmed}" && "\${trimmed}" != "--Noentries--" ]] || return 1
          printf '%s\n' "\${log}" | awk '
            /FILE CORRUPTED/ { n++ }
            /fsverity_msg: [0-9]+ callbacks suppressed/ { sub(/.*fsverity_msg: /, ""); n += \$1 }
            END { print n + 0 }'
        }
        # Regular files under the composefs object store with at least one
        # extent flagged "encoded" (btrfs compression) in filefrag -v.
        cfs_compressed_objects() {
          local dir=/sysroot/composefs/objects n fstype
          # n/a only when findmnt succeeds and says the filesystem is not btrfs.
          if ! fstype="\$(findmnt -no FSTYPE /sysroot 2>/dev/null)" || [[ -z "\${fstype}" ]]; then echo unknown; return 0; fi
          if [[ "\${fstype}" != btrfs ]]; then echo n/a; return 0; fi
          if ! command -v filefrag >/dev/null 2>&1 || [[ ! -d "\${dir}" ]]; then echo unknown; return 0; fi
          n="\$(set -o pipefail
            find "\${dir}" -type f -print0 2>/dev/null \\
              | timeout 180 xargs -0 -r -n 256 filefrag -v 2>/dev/null \\
              | awk '
                  /^File size of / { seen = 0; next }
                  /^ *[0-9]+: / && !seen && \$0 ~ /(^|[ ,])encoded(,|\$)/ { seen = 1; n++ }
                  END { print n + 0 }')" || { echo unknown; return 0; }
          echo "\${n}"
        }
        emit cfs_compressed_objects "\$(cfs_compressed_objects)"
        # Counted before the canary below, which logs on a defective kernel.
        emit kernel "\$(uname -r)"
        emit fsverity_errors "\$(fsverity_count || echo unknown)"
        # Kernel canary, informational only (never fails the lane): does THIS
        # kernel log FILE CORRUPTED when it reads a compressed fs-verity file on
        # btrfs? defect = yes; clean = no; skipped = the canary could not run.
        # When it first says clean on a new kernel, hosts can take that kernel,
        # and its entry leaves the known-defect list in the judge.
        export CANARY_IMG=/var/tmp/qa-btrfs-verity.img CANARY_MNT=/var/tmp/qa-btrfs-verity.mnt
        dmesg_count() {
          local out
          out="\$(dmesg 2>/dev/null)" || { echo unknown; return 0; }
          printf '%s\n' "\${out}" | grep -c 'FILE CORRUPTED' || true
        }
        canary_body() {
          set -e
          [[ "\$(id -u)" == 0 ]]
          command -v mkfs.btrfs >/dev/null
          command -v losetup >/dev/null
          command -v python3 >/dev/null
          mkdir -p "\${CANARY_MNT}"
          truncate -s 64M "\${CANARY_IMG}"
          mkfs.btrfs -q -f -m single -d single "\${CANARY_IMG}" >/dev/null
          mount -o loop,compress-force=zstd "\${CANARY_IMG}" "\${CANARY_MNT}"
          local f="\${CANARY_MNT}/canary.bin"
          base64 /dev/urandom | head -c 33554432 > "\${f}"
          sync
          if command -v fsverity >/dev/null 2>&1; then
            fsverity enable --hash-alg=sha512 --block-size=4096 "\${f}"
          else
            python3 -c '
        import fcntl, os, struct, sys
        fd = os.open(sys.argv[1], os.O_RDONLY)
        # struct fsverity_enable_arg: version=1, SHA-512, 4096-byte blocks, rest zero.
        arg = struct.pack("=IIIIQIIQ11Q", 1, 2, 4096, 0, 0, 0, 0, 0, *([0] * 11))
        fcntl.ioctl(fd, 0x40806685, arg)
        ' "\${f}"
          fi
          # The canary is only meaningful if the extents really are compressed.
          if command -v filefrag >/dev/null 2>&1; then filefrag -v "\${f}" | grep -qw encoded; fi
          sync
          echo 3 > /proc/sys/vm/drop_caches
          cat "\${f}" > /dev/null
        }
        canary_cleanup() {
          umount "\${CANARY_MNT}" 2>/dev/null || umount -l "\${CANARY_MNT}" 2>/dev/null || true
          for d in \$(losetup -j "\${CANARY_IMG}" 2>/dev/null | cut -d: -f1); do losetup -d "\${d}" 2>/dev/null || true; done
          rmdir "\${CANARY_MNT}" 2>/dev/null || true
          rm -f -- "\${CANARY_IMG}" 2>/dev/null || true
        }
        CANARY=skipped
        CANARY_BEFORE="\$(dmesg_count)"
        CANARY_RC=0
        timeout -k 5 60 bash -c "\$(declare -f canary_body); canary_body" >/dev/null 2>&1 || CANARY_RC=\$?
        sleep 1 || true
        CANARY_AFTER="\$(dmesg_count)"
        canary_cleanup
        if [[ "\${CANARY_BEFORE}" =~ ^[0-9]+\$ && "\${CANARY_AFTER}" =~ ^[0-9]+\$ ]]; then
          if (( CANARY_AFTER > CANARY_BEFORE )); then
            CANARY=defect
          elif (( CANARY_RC == 0 )); then
            CANARY=clean
          fi
        fi
        emit kernel_btrfs_verity_canary "\${CANARY}"
        # --- END fsverity-probe ---
        # Wait (bounded) until serial-getty@ttyS0 has finished its TTY setup:
        # MainPID is set and the process has exec'd agetty (it is "(agetty)"
        # before that).
        SERIAL_WAIT_SECONDS=30
        serial_deadline=\$((SECONDS+SERIAL_WAIT_SECONDS))
        while :; do
          SERIAL_STATE="\$(timeout 10 systemctl is-active serial-getty@ttyS0.service 2>/dev/null || true)"
          if [[ "\${SERIAL_STATE}" != active && "\${SERIAL_STATE}" != activating ]]; then break; fi
          GETTY_PID="\$(timeout 10 systemctl show -p MainPID --value serial-getty@ttyS0.service 2>/dev/null || true)"
          if [[ "\${GETTY_PID}" =~ ^[0-9]+\$ ]] && (( GETTY_PID > 0 )) \\
             && [[ "\$(cat "/proc/\${GETTY_PID}/comm" 2>/dev/null || true)" == agetty ]]; then break; fi
          if (( SECONDS >= serial_deadline )); then break; fi
          sleep 1 || true
        done
        echo "${M_DONE}"
        { cat /run/firn-qa-checks.txt; printf '%s\n' "${M_DONE}"; } 2>/dev/null > /dev/ttyS0 || true
        sync || true
        sleep 2 || true
        { cat /run/firn-qa-checks.txt; printf '%s\n' "${M_DONE}"; } 2>/dev/null > /dev/ttyS0 || true
        SCRIPT
        )
        C_B64="$(printf '%s' "${CHECK_SH}" | base64 -w0)"
        CUNIT="[Unit]
        Description=firn QA post-install checks
        After=multi-user.target
        [Service]
        Type=oneshot
        TimeoutStartSec=900
        RemainAfterExit=yes
        StandardOutput=journal+console
        StandardError=journal+console
        ExecStart=/bin/bash -c 'echo ${C_B64} | base64 -d > /run/qa-check.sh; chmod +x /run/qa-check.sh; /run/qa-check.sh'"
        CD="[Unit]
        Wants=firn-qa-check.service"
        CU_B64="$(printf '%s' "${CUNIT}" | base64 -w0)"
        CD_B64="$(printf '%s' "${CD}"    | base64 -w0)"
        incus config set "${VM}" raw.qemu="-smbios type=11,value=io.systemd.credential.binary:systemd.extra-unit.firn-qa-check.service=${CU_B64} -smbios type=11,value=io.systemd.credential.binary:systemd.unit-dropin.multi-user.target=${CD_B64}" || fail vm config_failed

        echo "Booting the installed system..." >&2
        incus start "${VM}" || fail vm restart_failed
        if ! wait_for "${M_DONE}" "${INSTALLED_BOOT_TIMEOUT}" "installed-boot"; then
          echo "--- console tail (installed system did not report) ---" >&2
          console_log | tail -n 400 >&2
          fail boot no_report
        fi

        # `|| true` is load-bearing (pipefail + set -e): see the native lane.
        console_log | grep -aoE "${M_CHECK} [a-z_]+=[^[:space:]]+" | sed "s/${M_CHECK} //" | sort -u \
          > /tmp/results/checks.txt || true
        echo "--- post-install checks ---" >&2
        cat /tmp/results/checks.txt >&2

        # ── judge: fixed order; first failing check wins ──
        judge() {
          local checks_file="$1" bootc_image bootc_digest cfs_objects fsverity_errors fsverity_kernel fsverity_kernels fsverity_known entry fsverity_note=""
          # Kernels with the known upstream btrfs fs-verity defect (frostyard/snosi#1130,
          # kdave/linux dcf8811f63af). Remove an entry when the kernel canary says
          # `clean` on it or a fixed kernel ships. Keep identical in every lane.
          local known_defect_kernels="7.2.11+deb14-amd64 7.2.12+deb14-amd64"
          if ! grep -qx 'booted=ok' "${checks_file}"; then fail boot no_report; fi
          if ! grep -qx "osrelease=${IMAGE}" "${checks_file}"; then fail boot wrong_image; fi
          if [[ "${ENC}" != none ]]; then
            if ! grep -qx 'luks=present' "${checks_file}"; then fail boot luks_missing; fi
          fi
          # btrfs directly, or a composefs overlay whose backing /sysroot is btrfs.
          if ! grep -qx 'rootfs=btrfs' "${checks_file}" \
             && ! { grep -qx 'rootfs=overlay' "${checks_file}" && grep -qx 'sysroot=btrfs' "${checks_file}"; }; then
            fail boot rootfs_mismatch
          fi
          if ! grep -q '^bootc=[^[:space:]]\+$' "${checks_file}"; then fail boot bootc_absent; fi
          if grep -qx 'bootc=absent' "${checks_file}"; then fail boot bootc_absent; fi
          if ! grep -qx 'login=active' "${checks_file}"; then fail boot login_unavailable; fi
          bootc_image="$(grep -m1 '^bootc_image=' "${checks_file}" | cut -d= -f2- || true)"
          if [[ -z "${bootc_image}" || "${bootc_image}" == unknown ]]; then fail boot bootc_image_unknown; fi
          bootc_digest="$(grep -m1 '^bootc_digest=' "${checks_file}" | cut -d= -f2- || true)"
          if [[ -z "${bootc_digest}" || "${bootc_digest}" == unknown ]]; then fail boot bootc_digest_unknown; fi
          if [[ "${bootc_digest}" != "${IMAGE_DIGEST}" ]]; then fail boot digest_mismatch; fi
          # frostyard/snosi#1130 guards. First: no compressed composefs objects on
          # btrfs (the Firn trigger, frostyard/firn#119). A missing value is a
          # failure. On an attested composefs root (rootfs=overlay and
          # sysroot=btrfs) the value must be the number 0: `n/a`, `unknown` or a
          # malformed value fails, because a guard that silently did not run must
          # not read as green (ADR-0010).
          cfs_objects="$(grep -m1 '^cfs_compressed_objects=' "${checks_file}" | cut -d= -f2- || true)"
          if [[ -z "${cfs_objects}" ]]; then fail boot cfs_check_missing; fi
          if [[ "${cfs_objects}" =~ ^[0-9]+$ ]]; then
            if (( 10#${cfs_objects} > 0 )); then fail boot "cfs_compressed_objects_${cfs_objects}"; fi
          elif grep -qx 'sysroot=btrfs' "${checks_file}" && grep -qx 'rootfs=overlay' "${checks_file}"; then
            fail boot cfs_check_unknown
          fi
          # Second: fs-verity corruption messages in this boot's kernel log. A
          # missing or non-numeric count fails. With uncompressed objects the
          # known kernel defect still hits rarely (a large folio across two bios
          # at an extent boundary), so a count above 0 is recorded, not failed,
          # on a kernel from the known-defect list. Any other kernel with errors
          # fails: a human then checks whether that kernel has the fix.
          fsverity_errors="$(grep -m1 '^fsverity_errors=' "${checks_file}" | cut -d= -f2- || true)"
          if [[ ! "${fsverity_errors}" =~ ^[0-9]+$ ]]; then fail boot fsverity_errors_unknown; fi
          if (( 10#${fsverity_errors} > 0 )); then
            # The exemption needs one unambiguous kernel identity: exactly 1
            # distinct, well-formed `kernel=` value (identical duplicates are fine).
            # Several values, a malformed one or none fails.
            fsverity_kernels="$(grep '^kernel=' "${checks_file}" | cut -d= -f2- | sort -u || true)"
            if [[ -z "${fsverity_kernels}" || "${fsverity_kernels}" == *$'\n'* \
                  || ! "${fsverity_kernels}" =~ ^[0-9A-Za-z._+~-]{1,64}$ ]]; then
              fail boot fsverity_kernel_ambiguous
            fi
            fsverity_kernel="${fsverity_kernels}"
            fsverity_known=0
            for entry in ${known_defect_kernels}; do
              if [[ "${fsverity_kernel}" == "${entry}" ]]; then fsverity_known=1; fi
            done
            if [[ "${fsverity_known}" == 1 ]]; then
              fsverity_note=" fsverity_known_defect=${fsverity_kernel}"
              printf 'fsverity_known_defect=%s\n' "${fsverity_kernel}" >> "${checks_file}"
              echo "fs-verity: ${fsverity_errors} message(s) on known-defect kernel ${fsverity_kernel} (snosi#1130); recorded, not failed" >&2
            else
              fail boot "fsverity_errors_${fsverity_errors}"
            fi
          fi
          printf '%s' "PASS: ${CELL} image=${bootc_image} digest=${bootc_digest}${fsverity_note} firn=${FIRN_VERSION}" > /tmp/results/result-summary.txt
          cat /tmp/results/result-summary.txt >&2
        }
        judge /tmp/results/checks.txt
    volumes:
    # Writable: Secure Boot MOK enrollment edits this guest's OVMF variable store.
    - { name: incus-pools, hostPath: { path: /var/lib/incus/storage-pools, type: Directory } }
    - { name: incus-bin,  hostPath: { path: /usr/incus, type: Directory } }
    - { name: incus-sock, hostPath: { path: /var/lib/incus/unix.socket, type: Socket } }
    - { name: iso-cache,  hostPath: { path: /var/lib/snosi-lab/iso, type: DirectoryOrCreate } }
    - { name: results,    emptyDir: {} }
