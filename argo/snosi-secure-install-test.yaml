# Submit file: run snosi's Task 9 secure-install harness against the real
# external installer (Dakota ISO -> bootc-installer -> fisherman).
#
#   kubectl create -f argo/snosi-secure-install-test.yaml
#
# This is the lane that covers what `bootc install to-disk` structurally cannot:
# a real secure install, with Secure Boot enforced, MOK enrolled, and /var
# TPM-unlocked. Defaults to cayo, the smallest secure product.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: snosi-secure-install-
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    snosi.io/trigger: manual
spec:
  serviceAccountName: argo
  entrypoint: main
  activeDeadlineSeconds: 10800
  templates:
    - name: main
      dag:
        tasks:
          - name: secure-install
            templateRef:
              name: run-secure-install-tests
              template: run-secure-install-tests
            arguments:
              parameters:
                - name: profile
                  value: "cayo"
                - name: tracking-ref
                  value: "ghcr.io/frostyard/cayo:latest"
