# Based on upstream v2/docker-compose.yaml (kubestellar/hive, branch v2).
# Deviations, each covering a breakage observed in this deployment:
#   - build block omitted (no source tree in this repo — published image only)
#   - HIVE_ID pins the instance id carried over from the k3s deployment
#   - entrypoint override on the hive service: /data permission repair
#     (see comments there)
# Deployed by hand on selfie (git pull + docker compose up -d); this
# directory is no longer part of any Argo application.
services:
  gateway:
    image: nginx:alpine
    container_name: hive-gateway
    restart: unless-stopped
    # Loopback only. The node proxy behind this gateway vouches for every API
    # request (X-Hive-Internal) and hands the dashboard token to any visitor —
    # and its blanket Bearer requirement on POST blocks the device-flow login
    # that our authorized_users allowlist depends on. The LAN entrance is the
    # Go API on 3002 (published on the hive service), which enforces per-user
    # device-flow auth — the same posture the k3s deployment had.
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:7681:7681"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway-upstream:/etc/nginx/upstream
    depends_on:
      hive:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  hive:
    image: ghcr.io/kubestellar/hive:v2-latest
    container_name: hive
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # 3002 = the Go API + dashboard UI with real auth (device-flow sessions,
    # authorized_users allowlist) — the LAN-facing entrance, same port the
    # k3s Service exposed.
    ports:
      - "3002:3002"
    expose:
      - "3001"
      - "3002"
      - "7681"
    volumes:
      - ./hive.yaml:/etc/hive/hive.yaml
      - hive-data:/data
      - ./secrets:/secrets:ro
    # One fix confirmed necessary on this image (also carried by the old k3s
    # deployment): the entrypoint seeds /data as root, and the in-process
    # permissions watcher (uid 1001) can't chown root-owned trees — endless
    # "operation not permitted" warnings and broken cross-agent sharing of
    # /data/home and /data/beads between restarts.
    # Do NOT symlink /usr/bin/gh → /opt/hive/bin/gh-real: the missing binary
    # is deliberate — the wrapper's guard steers agent gh calls through the
    # hive MITM proxy (App bot identity, per-agent scoping, audit), and a
    # direct gh bypasses that control
    # (kubestellar/hive#3022, comment 5246849016).
    # Overriding entrypoint discards the image CMD, so command is restated.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown -R 1001:1000 /data 2>/dev/null || true;
        chmod -R g+rwX /data/home /data/beads /data/agents 2>/dev/null || true;
        find /data/home /data/beads /data/agents -type d -exec chmod g+s {} + 2>/dev/null || true;
        exec entrypoint.sh "$@"
      - --
    command: ["--config", "/etc/hive/hive.yaml"]
    environment:
      - HIVE_ID=frostyard
      - HIVE_GITHUB_TOKEN=${HIVE_GITHUB_TOKEN}
      - HIVE_DASHBOARD_TOKEN=${HIVE_DASHBOARD_TOKEN}
      - NTFY_SERVER=${NTFY_SERVER}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - HIVE_LEVEL=${HIVE_LEVEL:-}
      - HIVE_REPO=${HIVE_REPO:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  watchtower:
    image: containrrr/watchtower
    container_name: hive-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
    profiles:
      - auto-update

volumes:
  hive-data:
  gateway-upstream:
