# Based on upstream v2/docker-compose.yaml (kubestellar/hive, branch v2).
# Deviations, each covering a breakage observed in this deployment:
#   - build block omitted (no source tree in this repo — published image only)
#   - HIVE_ID pins the instance id carried over from the k3s deployment
#   - entrypoint override on the hive service: gh path bridge + /data
#     permission repair (see comments there)
# Deployed by hand on selfie (git pull + docker compose up -d); this
# directory is no longer part of any Argo application.
services:
  gateway:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: hive-gateway
    restart: unless-stopped
    # Loopback only. The node proxy behind this gateway vouches for every API
    # request (X-Hive-Internal) and hands the dashboard token to any visitor —
    # and its blanket Bearer requirement on POST blocks the device-flow login
    # that our authorized_users allowlist depends on. The LAN entrance is the
    # Go API on 3002 (published on the hive service), which enforces per-user
    # device-flow auth — the same posture the k3s deployment had.
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:7681:7681"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway-upstream:/etc/nginx/upstream
    depends_on:
      hive:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  hive:
    image: ghcr.io/kubestellar/hive:v2-latest@sha256:164f0c550977aae66017f47ccff91749292b43453de58099f9dfce5a439b1896
    container_name: hive
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # 3002 = the Go API + dashboard UI with real auth (device-flow sessions,
    # authorized_users allowlist) — the LAN-facing entrance, same port the
    # k3s Service exposed.
    ports:
      - "3002:3002"
    expose:
      - "3001"
      - "3002"
      - "7681"
    volumes:
      - ./hive.yaml:/etc/hive/hive.yaml
      - hive-data:/data
      - ./secrets:/secrets:ro
    # Two fixes confirmed necessary on this image (both also carried by the
    # old k3s deployment):
    #   1. bin/gh-wrapper.sh (installed at /usr/local/bin/gh) hardcodes
    #      REAL_GH=/usr/bin/gh but the real binary is at
    #      /opt/hive/bin/gh-real and nothing links them — every agent `gh`
    #      call dies at the wrapper's guard.
    #   2. The entrypoint seeds /data as root, and the in-process permissions
    #      watcher (uid 1001) can't chown root-owned trees — endless
    #      "operation not permitted" warnings and broken cross-agent sharing
    #      of /data/home and /data/beads between restarts.
    # Overriding entrypoint discards the image CMD, so command is restated.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ln -sf /opt/hive/bin/gh-real /usr/bin/gh;
        chown -R 1001:1000 /data 2>/dev/null || true;
        chmod -R g+rwX /data/home /data/beads /data/agents 2>/dev/null || true;
        find /data/home /data/beads /data/agents -type d -exec chmod g+s {} + 2>/dev/null || true;
        exec entrypoint.sh "$@"
      - --
    command: ["--config", "/etc/hive/hive.yaml"]
    environment:
      - HIVE_ID=frostyard
      - HIVE_GITHUB_TOKEN=${HIVE_GITHUB_TOKEN}
      - HIVE_DASHBOARD_TOKEN=${HIVE_DASHBOARD_TOKEN}
      - NTFY_SERVER=${NTFY_SERVER}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - HIVE_LEVEL=${HIVE_LEVEL:-}
      - HIVE_REPO=${HIVE_REPO:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  hive-data:
  gateway-upstream:
