# ServiceAccount + namespace-scoped RBAC for the hive pod, per
# hive v2/docs/manual-provisioning.md §B.1–B.2. The OpenShift anyuid binding
# is omitted (k3s), and so is the hive-self-upgrade Role — Argo CD owns the
# Deployment here; a self-upgrading hive would fight selfHeal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-sa
  namespace: hive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-secrets-writer
  namespace: hive
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-secrets-writer
  namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-secrets-writer
subjects:
  - kind: ServiceAccount
    name: hive-sa
    namespace: hive
