# LoadBalancer via k3s ServiceLB — dashboard at http://10.0.1.200:3002.
# Only the dashboard port is exposed: /terminal is proxied by the Go binary
# behind its auth middleware, so ports 3001/7681 (raw ttyd path) stay
# cluster-internal. A future Caddy front can upstream to 10.0.1.200:3002.
apiVersion: v1
kind: Service
metadata:
  name: hive
  namespace: hive
  labels:
    app: hive
spec:
  type: LoadBalancer
  selector:
    app: hive
  ports:
    - name: dashboard
      port: 3002
      targetPort: 3002
