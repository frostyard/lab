apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive
  labels:
    app: hive
spec:
  replicas: 1
  # Recreate, not RollingUpdate: hive-data is RWO local-path and hive's /data
  # state is not designed for two writers outside the RWX rollout pattern.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hive
  template:
    metadata:
      labels:
        app: hive
    spec:
      serviceAccountName: hive-sa
      # The ConfigMap is mounted read-only at /etc/hive-seed and copied into a
      # WRITABLE emptyDir at /etc/hive — the hive process writes
      # /etc/hive/hive.yaml at runtime (dashboard Save, App install). Mounting
      # the ConfigMap directly at /etc/hive breaks every config save.
      initContainers:
        - name: copy-config
          image: ghcr.io/kubestellar/hive:v2-latest
          command:
            - sh
            - -c
            - >-
              cp /etc/hive-seed/hive.yaml /etc/hive/hive.yaml &&
              echo configmap-copied;
              if [ -f /data/hive.yaml.runtime ]; then
              echo runtime-config-exists-for-recovery;
              elif [ -f /data/hive.yaml.bak ]; then
              echo legacy-runtime-config-exists-for-recovery; fi
          volumeMounts:
            - { name: config, mountPath: /etc/hive-seed, readOnly: true }
            - { name: config-writable, mountPath: /etc/hive }
            - { name: data, mountPath: /data }
        # Runs as root (image user). The in-process permissions watcher runs
        # as uid 1001 and cannot chown/chmod files created by the per-agent
        # UIDs (2001+), so cross-agent sharing of /data/home (copilot session
        # state) and /data/beads breaks between restarts unless this repairs
        # the tree on every pod start: everything dev:node (1001:1000), the
        # shared trees group-writable, setgid dirs so new files inherit the
        # node group.
        - name: init-permissions
          image: ghcr.io/kubestellar/hive:v2-latest
          command:
            - sh
            - -c
            - >-
              chown -R 1001:1000 /data 2>/dev/null || true;
              chmod -R g+rwX /data/home /data/beads /data/agents 2>/dev/null || true;
              find /data/home /data/beads /data/agents -type d -exec chmod g+s {} + 2>/dev/null || true;
              echo permissions-set
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: hive
          image: ghcr.io/kubestellar/hive:v2-latest
          imagePullPolicy: Always
          # Upstream image bug: bin/gh-wrapper.sh (installed at /usr/local/bin/gh)
          # hardcodes REAL_GH=/usr/bin/gh, but the Dockerfile installs the real
          # binary at /opt/hive/bin/gh-real and nothing links the two — so every
          # agent `gh` call dies at the wrapper's "gh CLI is not available" guard
          # and agents fall back to the GitHub MCP, which writes as the Copilot
          # login identity (403 on this org) instead of the App bot. Bridge the
          # paths on every start until kubestellar/hive fixes the wrapper.
          lifecycle:
            postStart:
              exec:
                command: ["ln", "-sf", "/opt/hive/bin/gh-real", "/usr/bin/gh"]
          ports:
            - { name: dashboard, containerPort: 3002 }
            - { name: terminal, containerPort: 3001 }
          env:
            - name: HIVE_ID
              value: frostyard
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: dashboard-token
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          # startupProbe keeps the liveness clock from starting until boot
          # finishes; livenessProbe uses /api/livez (not /api/health) so a
          # wedged heartbeat goroutine gets the pod restarted.
          startupProbe:
            httpGet: { path: /api/health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/livez, port: 3002 }
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /api/health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config-writable, mountPath: /etc/hive }
            - { name: secrets, mountPath: /secrets, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
        - name: config
          configMap:
            name: hive-config
        - name: config-writable
          emptyDir: {}
        # hive-secrets is created by hand with kubectl (never committed to
        # git): keys dashboard-token and gh-app-key.pem. See hive/README.md.
        - name: secrets
          secret:
            secretName: hive-secrets
