# Upstream recommends RWX for zero-downtime rollouts, but selfie is a
# single-node k3s cluster with local-path only — RWO plus a Recreate
# deployment strategy is the honest equivalent here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-data
  namespace: hive
  labels:
    app: hive
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
