# Report the share of closed pull requests that were merged.
name: PR metrics

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Rolling measurement window in days
        required: false
        default: '90'

permissions:
  contents: read
  pull-requests: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: '22'
      - name: Calculate PR acceptance
        run: node scripts/pr-metrics.mjs --repo "$REPOSITORY" --days "$DAYS"
        env:
          DAYS: ${{ inputs.days || '90' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
