# Report the share of closed pull requests that were merged.
name: PR metrics

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Rolling measurement window in days
        required: false
        default: '90'

permissions:
  contents: read
  pull-requests: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: '22'
      - name: Calculate PR acceptance
        run: node scripts/pr-metrics.mjs --repo "$REPOSITORY" --days "$DAYS"
        env:
          DAYS: ${{ inputs.days || '90' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
