# PR triage (core ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md): this
# caller runs on pull_request_target so the base risk list and trusted caller
# execute. It does not run a PR branch. It checks out nothing. It sets 1 level
# label (level:L1 to level:L4) and risk:high for L1 and L2, and it removes
# ready-for-human when the head moves. It is not a required check. The
# repository must have the risk:high label, or this job fails.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@c996ea3fb54bcf1a3c621113522213702a7673e2 # frostyard/core main, 2026-11-09 (core#225; core has no release tags)
