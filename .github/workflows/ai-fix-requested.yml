name: AI fix requested

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue carrying the ai-fix-requested label
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  assign-to-copilot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       github.event.label.name == 'ai-fix-requested')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate request and assign issue
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::COPILOT_AGENT_TOKEN is not configured; see docs/ai-fix-workflow.md"
            exit 1
          fi

          issue_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
          )"

          if jq -e 'has("pull_request")' <<<"$issue_json" >/dev/null; then
            echo "::error::$ISSUE_NUMBER is a pull request, not an issue"
            exit 1
          fi

          if [[ "$(jq -r '.state' <<<"$issue_json")" != "open" ]]; then
            echo "::error::Issue $ISSUE_NUMBER is not open"
            exit 1
          fi

          if ! jq -e \
            'any(.labels[]?; .name == "ai-fix-requested")' \
            <<<"$issue_json" >/dev/null; then
            echo "::error::Issue $ISSUE_NUMBER does not have the ai-fix-requested label"
            exit 1
          fi

          if jq -e \
            'any(.assignees[]?; .login == "copilot-swe-agent" or .login == "copilot-swe-agent[bot]")' \
            <<<"$issue_json" >/dev/null; then
            echo "Issue $ISSUE_NUMBER is already assigned to Copilot"
            exit 0
          fi

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $branch,
                custom_instructions: "Follow the repository instructions and keep the change scoped to this issue."
              }
            }' |
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
              --input -

          echo "Assigned issue $ISSUE_NUMBER to Copilot"
