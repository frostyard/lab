# Apply existing repository labels to issues based on their title and body.
name: issue labeler

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read  # to read .github/labeler.yml through the API
      issues: write   # to add labels to issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/labeler.yml
          enable-versioned-regex: '0'
          include-title: '1'
          repo-token: ${{ github.token }}
