# Build the reporting site and publish it to GitHub Pages.
#
# The site is a pure read-only view of runs.json. The in-cluster
# publish-results CronWorkflow commits it to the orphan branch `data/runs`
# (at :00 and :30), and the build step loads it from there
# (scripts/fetch-runs-data.sh), so the build never needs cluster access.
#
# A schedule picks up new data 15 minutes after each publish run. A push
# trigger on `data/runs` cannot work: a push runs the workflow file of the
# pushed branch, the orphan data branch holds no workflow, and the
# github-pages environment deploys from main. A repository_dispatch from the
# cluster job was rejected: it needs a token scope that the cluster token is
# not proven to have, and it adds a second write call to the job.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/fetch-runs-data.sh'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions: {}

# Never cancel a deploy midway; let it finish and queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read  # to checkout the repository
      pages: read     # to read the Pages site configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Load the published run data; the tracked runs.json is only a fallback.
      - run: scripts/fetch-runs-data.sh
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to authenticate the deployment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
