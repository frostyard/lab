# Dependabot (frostyard core ADR-0071 row B13, ADR-0089): exactly 1 entry for
# each ecosystem with a manifest in this repository.
#   github-actions  the actions that the workflows pin (ADR-0021)
#   npm             package.json: the Playwright end-to-end suite (e2e/), and
#                   site/package.json: the Astro QA dashboard, in 1 entry
#                   with `directories`
#   pip /           requirements-test.txt: pytest and the YAML and Kubernetes
#                   schema validators
# Version updates run monthly (ADR-0089): the schedule holds only
# `interval: monthly`. Each entry has 1 group with `patterns: ["*"]` and no
# `group-by`, so each ecosystem opens at most 1 version-update pull request a
# month, for all its directories (ADR-0075). The group has no `applies-to`,
# so security updates stay immediate and 1 pull request each.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip:
        patterns: ["*"]
