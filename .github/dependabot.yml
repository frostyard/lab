# Dependabot (frostyard core ADR-0071 row B13): 1 entry for each ecosystem
# with a manifest in this repository.
#   github-actions  the actions that the workflows pin (ADR-0021)
#   npm /           package.json: the Playwright end-to-end suite (e2e/)
#   npm /site       site/package.json: the Astro QA dashboard
#   pip /           requirements-test.txt: pytest and the YAML and Kubernetes
#                   schema validators
# Each entry has 1 group with `patterns: ["*"]`, so each entry opens at most 1
# version-update pull request for each run (ADR-0075). The group has no
# `applies-to`, so security updates stay 1 pull request each.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-site:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip:
        patterns: ["*"]
