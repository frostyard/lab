# CronWorkflow: collect run results from the cluster and publish them to git.
#
# The reporting site is a read-only view of runs.json. This is what keeps that
# file current: scripts/publish-runs.sh reads the Argo API, regenerates the
# file, and commits it as the only file of the orphan branch `data/runs`. It
# never pushes to main: the default branch accepts changes only through a pull
# request with the required check. The Pages workflow reads runs.json from
# `data/runs` on its schedule, so the cluster never needs to reach GitHub Pages
# and Pages never needs to reach the cluster.
#
# Requires a `github-token` Secret in the argo namespace with a token that can
# push to frostyard/lab:
#
#   kubectl create secret generic github-token -n argo \
#     --from-literal=token=<PAT with contents:write on frostyard/lab>
#
# The `data/runs` branch must stay outside every ruleset, or the push is
# rejected and every run fails.
#
# The secret is in place (created 2026-08-07). If the credential is ever
# removed, the script fails at its own guard (exit 1) so the missing credential
# shows up as a Failed run instead of a silent Succeeded.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: publish-results
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
spec:
  suspend: false
  schedules:
    - "*/30 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: argo
    entrypoint: publish
    # A hung apt or curl would otherwise hold a pod carrying a GitHub write
    # token open indefinitely, and concurrencyPolicy: Forbid means that one
    # stuck run silently stops every later one. The whole job is seconds of
    # work; ten minutes is already generous.
    activeDeadlineSeconds: 600
    podGC:
      strategy: OnPodCompletion
    ttlStrategy:
      secondsAfterCompletion: 86400
    templates:
      - name: publish
        script:
          image: docker.io/library/debian:trixie-slim
          command: [bash]
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  # optional so a missing secret still starts the pod and hits
                  # the script's guard, which exits non-zero with a clear
                  # message. Without it the pod sits in
                  # CreateContainerConfigError until the deadline.
                  optional: true
            - name: DEBIAN_FRONTEND
              value: noninteractive
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          source: |
            set -euo pipefail

            if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "ERROR: github-token secret (key: token) is missing or empty in the argo namespace; cannot publish." >&2
              echo "See the comment at the top of manifests/publish-results.yaml." >&2
              exit 1
            fi

            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              git ca-certificates curl python3 >/dev/null

            # kubectl is not in the base image and the collector shells out to
            # it. Pin to the cluster's minor version (docs/ops/bootstrap.md
            # records the server version; a patch difference is well inside
            # the supported skew).
            #
            # Verify the download. This pod holds a GitHub token with write
            # access to frostyard/lab, and it makes that binary executable and
            # runs it -- an unverified fetch here is a write-credential-adjacent
            # supply-chain hole, and every other download in this org is
            # checksum-pinned (snosi's verified_download, dakota's
            # SECURE_*_SHA256). Checksum is upstream's own published
            # kubectl.sha256, confirmed against an independent download.
            KVER=v1.36.2
            KSHA=1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
            curl -fsSL -o /usr/local/bin/kubectl \
              "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
            echo "${KSHA}  /usr/local/bin/kubectl" | sha256sum -c - \
              || { echo "kubectl ${KVER} failed checksum verification" >&2; exit 1; }
            chmod +x /usr/local/bin/kubectl

            # The clone of main supplies scripts/; the run data goes to the
            # data/runs branch. publish-runs.sh sets the git identity, retries a
            # rejected push and never pushes to main.
            git clone -q --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/frostyard/lab.git" /tmp/lab
            cd /tmp/lab

            exec bash scripts/publish-runs.sh
