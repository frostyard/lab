# CronWorkflow: collect run results from the cluster and publish them to git.
#
# The reporting site is a read-only view of site/src/data/runs.json. This is
# what keeps that file current: it reads the Argo API, regenerates the file, and
# commits it. Pushing to main is what triggers the Pages build, so the cluster
# never needs to reach GitHub Pages and Pages never needs to reach the cluster.
#
# Requires a `github-token` Secret in the argo namespace with a token that can
# push to frostyard/lab:
#
#   kubectl create secret generic github-token -n argo \
#     --from-literal=token=<PAT with contents:write on frostyard/lab>
#
# The secret is in place (created 2026-08-07), the hardened script was proven
# end to end by a manual run that pushed 988ec16 and triggered a green Pages
# deploy, so this is now active. If the credential is ever removed, the script
# exits 0 at its own guard rather than failing every 30 minutes.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: publish-results
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
spec:
  suspend: false
  schedules:
    - "*/30 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: argo
    entrypoint: publish
    # A hung apt or curl would otherwise hold a pod carrying a GitHub write
    # token open indefinitely, and concurrencyPolicy: Forbid means that one
    # stuck run silently stops every later one. The whole job is seconds of
    # work; ten minutes is already generous.
    activeDeadlineSeconds: 600
    podGC:
      strategy: OnPodCompletion
    ttlStrategy:
      secondsAfterCompletion: 86400
    templates:
      - name: publish
        script:
          image: docker.io/library/debian:trixie-slim
          command: [bash]
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  # optional so a missing secret is a clean skip rather than a
                  # pod that will not start
                  optional: true
            - name: DEBIAN_FRONTEND
              value: noninteractive
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          source: |
            set -euo pipefail

            if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "No github-token secret in the argo namespace; nothing to publish." >&2
              echo "See the comment at the top of manifests/publish-results.yaml." >&2
              exit 0
            fi

            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              git ca-certificates curl python3 >/dev/null

            # kubectl is not in the base image and the collector shells out to
            # it. Pin to the cluster's minor version (server is v1.36.3+k3s1;
            # a patch difference is well inside the supported skew).
            #
            # Verify the download. This pod holds a GitHub token with write
            # access to frostyard/lab, and it makes that binary executable and
            # runs it -- an unverified fetch here is a write-credential-adjacent
            # supply-chain hole, and every other download in this org is
            # checksum-pinned (snosi's verified_download, dakota's
            # SECURE_*_SHA256). Checksum is upstream's own published
            # kubectl.sha256, confirmed against an independent download.
            KVER=v1.36.2
            KSHA=1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
            curl -fsSL -o /usr/local/bin/kubectl \
              "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
            echo "${KSHA}  /usr/local/bin/kubectl" | sha256sum -c - \
              || { echo "kubectl ${KVER} failed checksum verification" >&2; exit 1; }
            chmod +x /usr/local/bin/kubectl

            git clone --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/frostyard/lab.git" /tmp/lab
            cd /tmp/lab

            git config user.name  "frostyard-lab[bot]"
            git config user.email "lab@frostyard.invalid"

            # main moves between the clone and the push -- this repo sees
            # frequent merges and this runs every 30 minutes, so a rejected
            # push is an expected outcome, not an exceptional one. A single
            # unguarded `git push` would fail the lane every time someone
            # merged during the window, which is noise indistinguishable from
            # a real failure.
            #
            # Recover by REGENERATING on top of the new main rather than
            # rebasing: runs.json is derived entirely from cluster state, so
            # regeneration is the correct merge by construction and there is
            # never a conflict to resolve. `reset --hard` also discards the
            # commit from the failed attempt, so attempts cannot stack.
            attempt=0
            while :; do
              attempt=$((attempt + 1))

              git fetch -q --depth 1 origin main
              git reset -q --hard FETCH_HEAD

              python3 scripts/collect_runs.py site/src/data/runs.json

              # `generated` changes every run, so committing unconditionally
              # would push an empty-signal commit every 30 minutes forever.
              # Compare everything else and skip when only the timestamp moved.
              if git diff --quiet -- site/src/data/runs.json; then
                echo "No change in run data; skipping commit."
                exit 0
              fi
              changed=$(git diff -- site/src/data/runs.json \
                          | grep -E '^[+-]' | grep -vE '^[+-]{3}' \
                          | grep -vE '"generated"' | head -1 || true)
              if [[ -z "${changed}" ]]; then
                echo "Only the generation timestamp changed; skipping commit."
                exit 0
              fi

              git add site/src/data/runs.json
              git commit -q \
                -m "chore(report): refresh run data" \
                -m "Generated by the publish-results CronWorkflow from the selfie cluster."

              if git push -q origin HEAD:main; then
                echo "Published."
                exit 0
              fi

              if (( attempt >= 3 )); then
                echo "push rejected ${attempt}x; leaving it for the next cycle" >&2
                exit 1
              fi
              echo "push rejected (main moved); regenerating on top of the new main" >&2
            done
