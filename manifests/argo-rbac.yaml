# ServiceAccount and RBAC for workflow pods, plus the workflow controller's
# ConfigMap create for Argo v4 template offload (last Role in this file).
#
# The argo-workflows Helm chart is installed with `workflow.serviceAccount.create:
# false`, so the SA and its bindings are owned here and reconciled by the
# lab-infra ArgoCD Application.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
---
# Minimum permissions the Argo emissary executor needs to report step results.
# Every workflow pod writes a workflowtaskresult; without this the controller
# never learns a step's outputs and the DAG stalls.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-executor
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-executor
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
  # A workflow that forgets serviceAccountName falls back to `default`; grant it
  # the executor minimum too so the failure mode is a clear RBAC error on the
  # real work rather than a silently stalled DAG.
  - kind: ServiceAccount
    name: default
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-executor
---
# image-poller persists digest state into the image-polling-digests ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-configmap-writer
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-configmap-writer
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-configmap-writer
---
# Workflow steps that submit or inspect other workflows (nightly fan-out,
# orphan-pod GC) need to act on Argo resources in their own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-operator
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflows/finalizers
      - workflowtemplates
      - cronworkflows
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-operator
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-operator
---
# Argo Workflows v4 offloads a pod template (ARGO_TEMPLATE) or container args
# above MaxEnvVarLen (128 KiB) to a ConfigMap that the workflow controller
# creates in the Workflow's namespace (workflow/controller/workflowpod.go,
# docs/offloading-large-workflows.md). The chart's controller Role grants only
# get, list and watch on ConfigMaps, so without this Role a large template
# fails pod creation. The controller only calls Create: the ConfigMap has the
# Workflow as its controller ownerReference, so Kubernetes garbage collection
# deletes it with the Workflow, and no update or delete is granted. Create
# cannot be limited by resourceNames (the controller names it after the pod).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-controller-template-offload
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-controller-template-offload
  namespace: argo
subjects:
  # The chart's controller ServiceAccount: Application `argo-workflows` as the
  # release name plus the default controller name (argocd/argo-workflows-app.yaml).
  - kind: ServiceAccount
    name: argo-workflows-workflow-controller
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-controller-template-offload
