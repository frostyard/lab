# Argo CD Application — manages hive/ (the frostyard hive AI-agent
# orchestrator: namespace, RBAC, PVC, config seed, Deployment, Service).
# Apply once:
#   kubectl apply -f argocd/hive-application.yaml -n argocd
#
# The hive-secrets Secret (GitHub App private key, dashboard token) is created
# by hand with kubectl and is deliberately NOT in git — Argo neither manages
# nor prunes it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frostyard-hive
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lab
spec:
  project: default
  source:
    repoURL: https://github.com/frostyard/lab
    targetRevision: main
    path: hive
  destination:
    server: https://kubernetes.default.svc
    namespace: hive
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # hive/namespace.yaml is a synced resource, like manifests/namespaces.yaml.
      - CreateNamespace=false
      - ServerSideApply=true
