# Argo CD Application — manages manifests/ (namespaces, RBAC, CronWorkflows,
# controller config). Apply once:
#   kubectl apply -f argocd/infra-application.yaml -n argocd
#
# After this, any file added to manifests/ and pushed to main is auto-applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frostyard-lab-infra
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lab
spec:
  project: default
  source:
    repoURL: https://github.com/frostyard/lab
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  ignoreDifferences:
    # image-polling-digests holds runtime state written by image-poller. Git
    # owns the key set; the cluster owns the values. Without this, selfHeal
    # would reset every digest to "" on each reconcile and the pollers would
    # re-run QA against an unchanged image forever.
    - group: ""
      kind: ConfigMap
      name: image-polling-digests
      namespace: argo
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
