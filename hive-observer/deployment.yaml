apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-observer
  labels:
    app: hive-observer
    app.kubernetes.io/name: hive-observer
    app.kubernetes.io/part-of: lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hive-observer
  template:
    metadata:
      labels:
        app: hive-observer
        app.kubernetes.io/name: hive-observer
        app.kubernetes.io/part-of: lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/hive-observer/observer.py]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HIVE_BASE_URL
              value: http://hive:3002
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: CACHE_TTL_SECONDS
              value: "30"
            - name: STALE_MAX_SECONDS
              value: "600"
            - name: MAX_REQUESTS_PER_MINUTE
              value: "120"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: code
              mountPath: /opt/hive-observer
              readOnly: true
            - name: secrets
              mountPath: /var/run/secrets/hive-observer
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: hive-observer-code
            defaultMode: 0444
        - name: secrets
          projected:
            # Secret volumes are owned by root and assigned to fsGroup 65532.
            # The group-read bit is required for the non-root process.
            defaultMode: 0440
            sources:
              - secret:
                  name: hive-secrets
                  items:
                    - key: dashboard-token
                      path: hive-dashboard-token
              - secret:
                  name: hive-observer-secrets
                  items:
                    - key: proxy-token
                      path: proxy-token
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
